{id:"r40",num:"XXXV",p:8,x:600,y:320,name:"The Clockwork Courts",topic:"Workflow agents and ADK 2.0 graphs",
objective:"Compose agents into fixed sequential, parallel and looping workflows, and into ADK 2.0 graphs.",
sections:[
{id:"r40a",title:"Three workflow agents",body:`
<p>Workflow agents "control the execution flow of one or more sub-agents" using fixed logic instead of asking a model, which gives "deterministic and predictable execution patterns."</p>
<div class="tbl"><table><thead><tr><th>Agent</th><th>Runs its sub-agents</th></tr></thead><tbody>
<tr><td><code>SequentialAgent</code></td><td>"one after another, in sequence"</td></tr>
<tr><td><code>ParallelAgent</code></td><td>Concurrently, as independent branches with "no automatic sharing of conversation history or state between these branches" while they run. Give each branch a distinct <code>output_key</code>, then merge afterwards</td></tr>
<tr><td><code>LoopAgent</code></td><td>"Repeatedly … until a specific termination condition is met"</td></tr></tbody></table></div>
<p>Data moves between sub-agents through session state, written by <code>output_key</code> and read by <code>{var}</code> in the next agent's instruction.</p>`,
cite:[{s:"adkworkflow",n:"Definitions, determinism, output_key"},{s:"adkparallel",n:"Independent branches"}]},
{id:"r40b",title:"A writer–critic loop",body:`
<p>A <code>LoopAgent</code> "does not inherently decide when to stop looping." You must give it <code>max_iterations</code>, a way for a sub-agent to escalate, or both. In this example from Google, a critic checks explicit criteria. When they're all met, the refiner calls <code>exit_loop</code>, which sets <code>escalate = True</code>. This is the verification loop (Realm XXXIX) built from ADK's workflow agents.</p>`,
code:`from google.adk.agents import LoopAgent, LlmAgent, SequentialAgent
from google.adk.tools.tool_context import ToolContext

GEMINI_MODEL = "gemini-2.5-flash"
COMPLETION_PHRASE = "No major issues found."

def exit_loop(tool_context: ToolContext):
    """Call this function ONLY when the critique indicates no further changes are needed, signaling the iterative process should end."""
    tool_context.actions.escalate = True
    tool_context.actions.skip_summarization = True
    return {}

# The original sets state["initial_topic"] in a before_agent_callback on the root agent.
initial_writer_agent = LlmAgent(
    name="InitialWriterAgent", model=GEMINI_MODEL, include_contents='none',
    instruction="Write a *very basic* first draft of a short story (just 1-2 simple sentences). Topic: {initial_topic}",
    output_key="current_document",
)

critic_agent_in_loop = LlmAgent(
    name="CriticAgent", model=GEMINI_MODEL, include_contents='none',
    instruction=f"""Review: {{current_document}}
Completion Criteria (ALL must be met): 1. At least 4 sentences  2. Clear beginning, middle, end
3. At least one descriptive detail.
IF any criteria is NOT met, give specific feedback. IF ALL are met, respond exactly with: "{COMPLETION_PHRASE}" """,
    output_key="criticism",
)

refiner_agent_in_loop = LlmAgent(
    name="RefinerAgent", model=GEMINI_MODEL, include_contents='none',
    instruction=f"""Current Document: {{current_document}}
Critique: {{criticism}}
IF the critique is exactly "{COMPLETION_PHRASE}" you MUST call exit_loop. ELSE apply the suggestions and output only the refined text.""",
    tools=[exit_loop],
    output_key="current_document",
)

refinement_loop = LoopAgent(name="RefinementLoop",
                            sub_agents=[critic_agent_in_loop, refiner_agent_in_loop],
                            max_iterations=5)

root_agent = SequentialAgent(name="IterativeWritingPipeline",
                             sub_agents=[initial_writer_agent, refinement_loop])`,lang:"py",sketch:"Abridged from Google's loop_agent_doc_improv_agent.py (prompts shortened)",
cite:[{s:"adkloopex",n:"Full example source"},{s:"adkloopdoc",n:"Termination rules"}]},
{id:"r40c",title:"ADK 2.0 graph workflows",body:`
<p>ADK 2.0 adds a <code>Workflow</code> that combines "AI-powered agents and deterministic execution nodes into a flexible execution graph that can include decision branching." Its edges are tuples. A chain starts at <code>"START"</code>, and a router node maps route names to handlers. Nodes can be agents, plain Python functions, or nested workflows. Data moves as <code>Event</code>s: <code>Event(route=...)</code> picks a branch and <code>Event(output=...)</code> passes data on. The docs now recommend graphs and dynamic workflows over the three template agents for new work. It's the same idea as LangGraph's <code>StateGraph</code> with conditional edges (Realms IX and XX).</p>`,
code:`from google.adk import Agent, Workflow, Event

root_agent = Workflow(
    name="root_agent",
    edges=[("START", city_generator_agent, lookup_time_function,
            city_report_agent, completed_message_function)],
)

routing = Workflow(
    name="routing_workflow",
    edges=[
        ("START", process_message, router),
        (router, {
            "BUG": response_1_bug,
            "CUSTOMER_SUPPORT": response_2_support,
            "LOGISTICS": response_3_logistics,
        }),
    ],
)`,lang:"py",
cite:[{s:"adkgraphs",n:"Workflow, edges, routing, Event"},{s:"adkworkflows",n:"Graph and dynamic workflows"}]}
],

{id:"r41",num:"XXXVI",p:8,x:470,y:380,name:"The Warden's Keep",topic:"Callbacks, plugins and evaluation",
objective:"Guard and observe ADK agents, and test both their answers and their tool paths.",
sections:[
{id:"r41a",title:"Six callbacks",body:`
<p>Return <code>None</code> to let execution continue. Return an object to <b>override</b> what would have happened:</p>
<div class="tbl"><table><thead><tr><th>Callback</th><th>Returning an object…</th></tr></thead><tbody>
<tr><td><code>before_agent_callback</code></td><td><code>Content</code>: skips the agent; it becomes the final output</td></tr>
<tr><td><code>before_model_callback</code></td><td><code>LlmResponse</code>: the model isn't called; your response is used</td></tr>
<tr><td><code>after_model_callback</code></td><td><code>LlmResponse</code>: replaces the model's response</td></tr>
<tr><td><code>before_tool_callback</code></td><td><code>dict</code>: the tool isn't run; your result goes to the model</td></tr>
<tr><td><code>after_tool_callback</code></td><td><code>dict</code>: replaces the tool's result</td></tr>
<tr><td><code>after_agent_callback</code></td><td>Runs after the agent finishes, to inspect or adjust its output</td></tr></tbody></table></div>`,
code:`def simple_before_model_modifier(
    callback_context: CallbackContext, llm_request: LlmRequest
) -> Optional[LlmResponse]:
    if "BLOCK" in last_user_message.upper():
        return LlmResponse(content=types.Content(
            role="model",
            parts=[types.Part(text="LLM call was blocked by before_model_callback.")],
        ))
    return None`,lang:"py",
cite:[{s:"adkcallbacks",n:"Callback types, return semantics, guardrail"}]},
{id:"r41b",title:"Plugins: register once, apply everywhere",body:`
<p>A callback is attached to "a single agent, a single tool for a specific task." A plugin is "registered once, on the Runner" and applies to everything, so the docs recommend plugins for security guardrails, logging and monitoring. Hooks include <code>on_user_message_callback</code>, <code>before_run_callback</code>, the agent, model and tool hooks plus their <code>on_*_error_callback</code> variants, <code>on_event_callback</code> and <code>after_run_callback</code>. This is the ADK counterpart of attaching middleware to every agent.</p>`,
code:`from google.adk.plugins.base_plugin import BasePlugin

class CountInvocationPlugin(BasePlugin):
    """A custom plugin that counts agent and tool invocations."""

    def __init__(self) -> None:
        super().__init__(name="count_invocation")
        self.agent_count = 0
        self.llm_request_count = 0

    async def before_agent_callback(self, *, agent, callback_context) -> None:
        self.agent_count += 1

    async def before_model_callback(self, *, callback_context, llm_request) -> None:
        self.llm_request_count += 1

app = App(name="test_app_with_plugin", root_agent=root_agent,
          plugins=[CountInvocationPlugin()])
runner = InMemoryRunner(app=app)`,lang:"py",
cite:[{s:"adkplugins",n:"Plugins vs callbacks, hooks, registration"}]},
{id:"r41c",title:"Evaluate the path and the answer",body:`
<p>ADK evaluation looks at two things. One is the <b>trajectory</b>: "the steps an agent takes to reach a solution, including its choice of tools." The other is the <b>final response</b>.</p>
<ul><li><code>.test.json</code> files: one session each, with expected tool calls and responses, for unit tests.</li><li><code>.evalset.json</code> files: many multi-turn sessions, for integration tests. They can include simulated users.</li><li>Default criteria: <code>tool_trajectory_avg_score</code> = 1.0 (an exact match) and <code>response_match_score</code> = 0.8. You can also add rubric-based quality, hallucination and safety criteria.</li></ul>
<p>This is ADK's version of LangSmith's trajectory and final-response evals (Realm XV). ADK runs can also be traced into LangSmith (Realm XXXVII).</p>`,
code:`adk eval path/to/my_agent path/to/my_agent/eval.evalset.json`,lang:"sh",
code2:`from google.adk.evaluation.agent_evaluator import AgentEvaluator

await AgentEvaluator.evaluate(
    agent_module="my_agent",
    eval_dataset_file_path_or_dir="path/to/eval.test.json",
)`,sketch2:"Sketch: pytest entry point (check the import for your version)",
cite:[{s:"adkeval",n:"Trajectory + response, file formats, criteria, CLI"}]}
],

{id:"r42",num:"XXXVII",p:8,x:340,y:320,name:"The Embassy",topic:"Deploy, A2A and LangSmith interop",
objective:"Ship ADK agents, connect them over A2A, and trace or host them with LangSmith.",
sections:[
{id:"r42a",title:"Where ADK agents run",body:`
<div class="tbl"><table><thead><tr><th>Target</th><th>Command</th><th>For</th></tr></thead><tbody>
<tr><td>Agent Runtime (Agent Platform)</td><td><code>adk deploy agent_engine</code></td><td>"Fully managed auto-scaling service … specifically designed for deploying, managing, and scaling AI agents"</td></tr>
<tr><td>Cloud Run</td><td><code>adk deploy cloud_run</code></td><td>The agent as a container-based app</td></tr>
<tr><td>GKE</td><td><code>adk deploy gke</code></td><td>More control, and open models</td></tr>
<tr><td>Any container host</td><td>Dockerfile + FastAPI entry point</td><td>Including offline or disconnected setups</td></tr></tbody></table></div>`,
cite:[{s:"adkdeploy",n:"Targets and CLI"}]},
{id:"r42b",title:"Agent-to-agent (A2A)",body:`
<p>A2A lets agents on different systems work together through a standard protocol. Expose an agent with <code>to_a2a</code>, which also generates an <b>agent card</b> at <code>/.well-known/agent-card.json</code>. Consume a remote one with <code>RemoteA2aAgent</code>, which then works like a local sub-agent. Use A2A for agents that are deployed separately or owned by other teams. Use local sub-agents when the agents are tightly coupled and you want less network overhead.</p>`,
code:`# pip install google-adk[a2a]
from google.adk.a2a.utils.agent_to_a2a import to_a2a

a2a_app = to_a2a(root_agent, port=8001)
# uvicorn path.to.module:a2a_app --host localhost --port 8001

from google.adk.agents import RemoteA2aAgent

remote_agent = RemoteA2aAgent(
    agent_card="http://localhost:8001/.well-known/agent-card.json"
)`,lang:"py",
cite:[{s:"adka2a",n:"When to use A2A"},{s:"adka2aqs",n:"to_a2a, agent card, RemoteA2aAgent"}]},
{id:"r42c",title:"Trace ADK in LangSmith",body:`<p>Install the extra, set the usual LangSmith variables (Realm XIII), and call <code>configure_google_adk()</code> once "before creating any ADK agents." Agent invocations, tool calls and model calls then appear as LangSmith traces, ready for the evals and hill-climbing loop you've already learned.</p>`,
code:`# pip install "langsmith[google-adk]"
# LANGSMITH_TRACING=true  LANGSMITH_API_KEY=...  LANGSMITH_PROJECT=...  GOOGLE_API_KEY=...
from langsmith.integrations.google_adk import configure_google_adk

configure_google_adk()          # optional: project_name, name, metadata, tags`,lang:"py",
cite:[{s:"lsadktrace",n:"Install, env vars, configure_google_adk"}]},
{id:"r42d",title:"Host ADK on LangSmith Deployment",body:`
<p>LangSmith Deployment can host ADK agents too. <code>wrap()</code> turns an ADK <code>Runner</code> into a graph that Agent Server can serve. It "bridges ADK sessions to Agent Server's checkpoint persistence," so threads, streaming, tracing and <code>langgraph deploy</code> all work. The runner <b>must</b> use <code>LangsmithSessionService()</code>, or <code>wrap()</code> raises a <code>TypeError</code>.</p>
<p>Limitations: only the last message's text reaches ADK, so images, files and audio are dropped. The reply comes back as one concatenated <code>AIMessage</code>, without separate tool or sub-agent turns. Live and voice agents aren't supported.</p>`,
code:`from saf_sdk.adk import LangsmithSessionService, wrap
from google.adk.runners import Runner

agent = wrap(
    Runner(
        agent=Agent(...),
        app_name="adk_echo",
        session_service=LangsmithSessionService(),
    )
)
# langgraph.json: {"dependencies": ["."], "graphs": {"adk_echo": "./agent.py:agent"}, "env": ".env"}
# pyproject: deployments-wrap-sdk[google-adk]  ·  then: langgraph deploy --name my-adk-agent`,lang:"py",
cite:[{s:"lsadkdeploy",n:"wrap(), LangsmithSessionService, limitations"}]}
],

/* ------------------------------------------------------------ XIII */
{id:"r13",num:"XXXVIII",p:9,x:210,y:210,name:"The Ring Walls",topic:"Loop engineering",
objective:"See agents as stacked loops, and know what each outer loop adds.",
sections:[
{id:"r13a",title:"Loops around the loop",body:`
<blockquote>Loops are a key part of how AI agents iterate at length to accomplish complex tasks like building software.</blockquote>
<p>LangChain calls the practice of stacking and extending these loops <em>loop engineering</em>: "you can stack and extend loops to build more effective agents." DeepLearning.AI and LangChain teach it as a short course built around a requirements-review agent, with lessons on the agent loop, the verification loop, the event-driven loop and the learning (hill-climbing) loop.</p>`,
cite:[{s:"dlai",n:"Course description and lessons"},{s:"artloop",n:"Stacking loops"}]},
{id:"r13b",title:"The four loops",body:`${DIAG_RINGS}
<ol>
<li><b>Agent loop.</b> "The model decides what to do, calls tools, observes the results, and continues until the task is complete." <code>create_agent</code> / <code>create_deep_agent</code>.</li>
<li><b>Verification loop.</b> "An evaluator checks the agent's output against explicit rubric criteria, and when something is missing, sends feedback for another attempt." <code>RubricMiddleware</code>.</li>
<li><b>Event-driven loop.</b> An event, such as a document update or a new ticket, triggers the agent and its verification automatically. Slack messages, schedules and webhooks via LangSmith Deployment.</li>
<li><b>Hill-climbing (learning) loop.</b> Traces from many runs are analyzed to find recurring problems, and the findings improve the agent's harness.</li>
</ol>`,
cite:[{s:"dlai",n:"Loop definitions"},{s:"artloop",n:"Loop 1–4 and their tooling"}]},
{id:"r13c",title:"The return arrow",body:`
<blockquote>The return arrow doesn't just loop back to the top—it reaches inside and updates the agent loop directly.</blockquote>
<p>That is what separates this from plain retrying. The outer loop changes the inner one: its prompt, tools, middleware and rubric. "Each cycle of the outer loop makes the inner loops more effective."</p>`,
cite:[{s:"artloop",n:"Key architectural insight"}]},
{id:"r13d",title:"Humans stay at the gates",body:`
<p>"Automation doesn't mean removing humans from the loop." Keep people at sensitive decision points: <code>interrupt_on</code> for outward actions, and human review of harness changes in the hill-climbing loop. The article's argument is that teams whose "human judgment and token capital compound together" build a lasting advantage.</p>`,
cite:[{s:"artloop",n:"Design principles"},{s:"better",n:"Human review step"}]}
],
siege:[
{id:"q13a",type:"order",q:"Order the loops from innermost to outermost.",items:["Agent loop","Verification loop","Event-driven loop","Hill-climbing loop"],why:"Execute → verify → trigger → improve.",s:"artloop"},
{id:"q13b",type:"mc",q:"A new Jira ticket automatically starts a review run. Which loop is that?",o:["Agent loop","Verification loop","Event-driven loop","Hill-climbing loop"],a:2,why:"External events trigger the agent.",s:"dlai"},
{id:"q13c",type:"mc",q:"What makes the hill-climbing loop different from retrying?",o:["It retries faster","It changes the harness (prompt, tools, middleware) based on many runs' traces","It uses a bigger model","It skips verification"],a:1,why:"The return arrow reaches inside and updates the agent loop.",s:"artloop"},
{id:"q13d",type:"mc",q:"In the Art of Loop Engineering, which component implements the verification loop?",o:["SummarizationMiddleware","RubricMiddleware","PIIMiddleware","InMemorySaver"],a:1,why:"Output is scored against a rubric and retried with feedback.",s:"artloop"}
]},
/* ------------------------------------------------------------ XIV */
{id:"r14",num:"XXXIX",p:9,x:360,y:140,name:"The Proving Grounds",topic:"The verification loop",
objective:"Make an agent check its own work against a rubric before it's allowed to finish.",
sections:[
{id:"r14a",title:"Close isn't done",body:`
<blockquote>Agents often produce outputs that head in the right direction but don't fully land on the first attempt.</blockquote>
<p>Outputs are probabilistic: "the same prompt can succeed on one run and fall short on the next." Without a verification loop, a human ends up re-reading output, diagnosing what's missing and re-running. A rubric automates that check.</p>`,
cite:[{s:"rubricblog",n:"Motivation"}]},
{id:"r14b",title:"How RubricMiddleware loops",body:`
<ol><li>The agent works normally.</li><li>When it would finish (a model response with no tool calls), the middleware runs a separate <b>grader sub-agent</b> on the transcript.</li><li>If the grader returns <code>needs_revision</code>, its per-criterion feedback is injected as a <code>HumanMessage</code> and the agent loop resumes.</li><li>This repeats until <code>satisfied</code> or <code>failed</code>, or until <code>max_iterations</code> (default 3) is reached.</li></ol>
<div class="tbl"><table><thead><tr><th>Verdict</th><th>Meaning</th></tr></thead><tbody>
<tr><td><code>satisfied</code></td><td>Every criterion passes; the run completes</td></tr>
<tr><td><code>needs_revision</code></td><td>Feedback goes back to the agent for another pass</td></tr>
<tr><td><code>max_iterations_reached</code></td><td>Still failing when the cap ran out</td></tr>
<tr><td><code>failed</code></td><td>The rubric was malformed or couldn't be evaluated</td></tr>
<tr><td><code>grader_error</code></td><td>The grader itself raised an exception</td></tr></tbody></table></div>`,
cite:[{s:"rubric",n:"Mechanics and verdicts"}]},
{id:"r14c",title:"Wire it up",body:`<p>The rubric is a newline-separated checklist passed in the input, so each task can carry its own definition of done.</p>`,
code:`from langchain.messages import HumanMessage
from deepagents import RubricMiddleware, create_deep_agent
from langgraph.checkpoint.memory import InMemorySaver

rubric_middleware = RubricMiddleware(
    model="anthropic:claude-haiku-4-5",   # the grader
    tools=[run_test_suite],               # let it check, not guess
    max_iterations=5,
)

agent = create_deep_agent(
    model="anthropic:claude-sonnet-5",
    middleware=[rubric_middleware],
    checkpointer=InMemorySaver(),
)

result = agent.invoke(
    {
        "messages": [HumanMessage("Review requirements.md and produce review.md")],
        "rubric": (
            "- Every requirement ID in requirements.md appears in review.md\\n"
            "- Each ambiguity cites the exact sentence it refers to\\n"
            "- The test suite passes"
        ),
    },
    config={"configurable": {"thread_id": "review-1"}},
)`,lang:"py",cite:[{s:"rubric",n:"Constructor and invoke pattern"}]},
{id:"r14d",title:"Make the grader check, not guess",body:`
<blockquote>Rather than asking the grader to reason abstractly about correctness, we give it a run_test_suite tool.</blockquote>
<ul><li>Write criteria a reviewer could check in one look: counts, presence, a passing command. "High quality" isn't checkable.</li><li>Give the grader tools that produce evidence: tests, linters, schema validators.</li><li>Cap it. <code>max_iterations</code> bounds the retry loop. Pair it with <code>ModelCallLimitMiddleware</code> for a hard cost ceiling.</li></ul>
<p>LangChain's coding agent uses a related trick: a <code>PreCompletionChecklistMiddleware</code> that stops the agent before exit and reminds it to run a verification pass against the task spec.</p>`,
cite:[{s:"rubricblog",n:"Grader tools"},{s:"harness",n:"PreCompletionChecklistMiddleware"}]}
],
siege:[
{id:"q14a",type:"mc",q:"When does RubricMiddleware's grader run?",o:["Before the first model call","After every tool call","When the agent would otherwise finish (a response with no tool calls)","Only when a user complains"],a:2,why:"It intercepts the finish line.",s:"rubric"},
{id:"q14b",type:"mc",q:"What happens on needs_revision?",o:["The run aborts","Feedback is injected as a HumanMessage and the agent continues","The grader rewrites the output itself","A human is paged"],a:1,why:"Per-criterion feedback re-enters the conversation.",s:"rubric"},
{id:"q14c",type:"mc",q:"Which rubric line is best?",o:["- The review is high quality","- The review is thorough and professional","- Every requirement ID in requirements.md appears in review.md","- Do your best"],a:2,why:"Concrete, checkable criteria give the grader something to verify.",s:"rubricblog"},
{id:"q14d",type:"mc",q:"The grader still wants changes, but the cap is used up. Verdict?",o:["satisfied","failed","grader_error","max_iterations_reached"],a:3,why:"failed is for malformed or unevaluable rubrics.",s:"rubric"}
]},
/* ------------------------------------------------------------ XV */
{id:"r15",num:"XL",p:9,x:520,y:190,name:"The Signal Fires",topic:"The event-driven loop",
objective:"Have events start agents, with verification and human checkpoints still in place.",
sections:[
{id:"r15a",title:"From invoked to always-on",body:`
<p>Until now, you started every run yourself. In the event-driven loop, events start them: a Slack message, a schedule, a webhook, a new ticket, a document update. The agent and its verification loop run automatically. In LangChain's tooling this is LangSmith Deployment and Fleet channels. You set up a deployment in Realms XVII–XVIII.</p>`,
cite:[{s:"artloop",n:"Loop 3"},{s:"dlai",n:"Event-driven definition"}]},
{id:"r15b",title:"Schedules: cron jobs",body:`
<p>On a LangSmith deployment you can schedule runs with the SDK. A <b>stateful</b> cron reuses one thread, so it remembers earlier runs. A <b>stateless</b> cron creates a new thread every time. All schedules are interpreted in <b>UTC</b>.</p>`,
code:`from langgraph_sdk import get_client

client = get_client(url=DEPLOYMENT_URL)
assistant_id = "agent"

# Stateful: same thread every run
cron_job = await client.crons.create_for_thread(
    thread["thread_id"], assistant_id,
    schedule="27 15 * * *",                      # 15:27 UTC daily
    input={"messages": [{"role": "user", "content": "Summarize today's new tickets"}]},
)

# Stateless: a new thread each run
cron_job_stateless = await client.crons.create(
    assistant_id, schedule="27 15 * * *",
    input={"messages": [{"role": "user", "content": "Audit yesterday's reviews"}]},
)

await client.crons.delete(cron_job["cron_id"])`,lang:"py",cite:[{s:"cron",n:"crons.create / create_for_thread, UTC"}]},
{id:"r15c",title:"Webhooks and app events",body:`<p>Whatever receives the event (a webhook route, a queue consumer, a Slack app) ends up calling the agent. Choose the thread id deliberately. Keying it to the ticket means a second event about the same ticket continues that ticket's thread instead of starting over.</p>`,
code:`def on_ticket_created(ticket: dict):
    """Called by your webhook route or queue consumer."""
    config = {"configurable": {"thread_id": f"ticket-{ticket['id']}"}}
    return agent.invoke(
        {
            "messages": [{"role": "user",
                          "content": f"Review ticket {ticket['id']}:\\n{ticket['body']}"}],
            "rubric": REVIEW_RUBRIC,          # verification still applies
        },
        config=config,
    )`,lang:"py",sketch:"Sketch: event handler pattern",cite:[{s:"artloop",n:"Events trigger agents"},{s:"stm",n:"thread_id semantics"}]},
{id:"r15d",title:"Keep humans at the gates",body:`
<p>Unattended agents need limits more than attended ones. "Automation doesn't mean removing humans from the loop." Put outward-facing tools (posting to Slack, closing tickets, sending email) behind <code>interrupt_on</code>, and set <code>ModelCallLimitMiddleware</code> so a noisy event source can't run up the bill.</p>`,
cite:[{s:"artloop",n:"Human oversight"},{s:"hitl",n:"interrupt_on"},{s:"mwbuilt",n:"Call limits"}]}
],

{id:"q15a",type:"mc",q:"Your cron runs at \"0 9 * * *\". In which timezone?",o:["Your laptop's","The deployment region's","UTC","The user's browser"],a:2,why:"All cron schedules are interpreted in UTC.",s:"cron"},
{id:"q15b",type:"mc",q:"A nightly audit should start fresh every night. Which call?",o:["client.crons.create(...)","client.crons.create_for_thread(...)","agent.invoke in a while True loop","Command(resume=...)"],a:0,why:"Stateless crons create a new thread per run.",s:"cron"},
{id:"q15c",type:"mc",q:"Why key thread_id to the ticket id?",o:["It's required by LangSmith","Later events about the same ticket continue its conversation and state","It makes runs faster","It disables verification"],a:1,why:"Same thread means shared history via the checkpointer.",s:"stm"},
{id:"q15d",type:"mc",q:"Which guardrail matters most for an agent that posts to Slack unattended?",o:["Remove the rubric to save tokens","interrupt_on for the posting tool, plus call limits","A higher temperature","Turn off tracing"],a:1,why:"Humans at sensitive decision points, and bounded cost.",s:"artloop"}
]},
/* ------------------------------------------------------------ XVI */
{id:"r16",num:"XLI",p:9,x:680,y:130,name:"The Summit Forge",topic:"The hill-climbing loop",
objective:"Improve the harness from traces and evals without overfitting.",
sections:[
{id:"r16a",title:"Traces are the currency",body:`
<blockquote>Traces are the currency of long horizon agent improvement. They're projections of agent experience in environments into a data format we can mine to understand.</blockquote>
<p>Turn tracing on (<code>LANGSMITH_TRACING=true</code>, Realm XIII) from day one. In the hill-climbing loop, an analysis agent reads production traces and proposes changes to the harness config. LangChain packaged that trace analysis as a reusable Agent Skill.</p>`,
cite:[{s:"mining",n:"Traces quote"},{s:"artloop",n:"Loop 4"},{s:"harness",n:"Trace analysis as a skill"}]},
{id:"r16b",title:"Evals encode the behavior you want",body:`
<blockquote>Evals encode the behavior we want our agent to exhibit in production.</blockquote>
<div class="tbl"><table><thead><tr><th>Evaluator</th><th>Good for</th></tr></thead><tbody>
<tr><td>Code</td><td>Deterministic structural checks</td></tr>
<tr><td>LLM-as-judge</td><td>Criteria (reference-free) or comparison to expected answers (reference-based)</td></tr>
<tr><td>Human</td><td>Annotation queues over outputs and traces</td></tr>
<tr><td>Pairwise</td><td>Comparing two versions side by side</td></tr></tbody></table></div>
<p><b>Offline</b> evals run on datasets with references before you deploy. <b>Online</b> evals score production runs, which have no reference answers. "Quality > quantity": a small, well-tagged set beats thousands of noisy cases. Realms XIV–XVI cover each evaluator type in depth.</p>`,
cite:[{s:"better",n:"Evals quote, quality > quantity"},{s:"evals",n:"Evaluator types, offline vs online"}]},
{id:"r16c",title:"The Better-Harness recipe",body:`
<ol><li><b>Source and tag evals</b> from hand-written cases, mined production traces and external datasets, tagged by behavior.</li><li><b>Split per category</b> into an Optimization set and a Holdout set.</li><li><b>Run a baseline</b> on both.</li><li><b>Optimize</b>: diagnose failures from traces and try targeted harness changes.</li><li><b>Validate</b>: improvements must not cause regressions.</li><li><b>Human review</b>: sanity-check changes and catch overfitting.</li></ol>
<blockquote>agents are famous cheaters</blockquote>
<p>An optimizer will reshape the harness until the evals you showed it pass. "Holdout sets become a proxy for true generalization." If optimization scores rise while the holdout falls, you're overfitting. Reject the change.</p>`,
cite:[{s:"better",n:"Six steps, holdout, cheaters"}]},
{id:"r16d",title:"Case study: 52.8 → 66.5",body:`
<p>LangChain moved its <code>deepagents-cli</code> coding agent from 52.8% to 66.5% on Terminal Bench 2.0, from top 30 to top 5, <b>by changing only the harness</b>. The model (gpt-5.2-codex) stayed the same. The changes:</p>
<ul><li><b>Self-verification</b>: a plan → build → verify → fix structure, and a pre-completion checklist.</li><li><b>Context injection</b>: <code>LocalContextMiddleware</code> maps the working directory and available tools at startup.</li><li><b>Doom-loop detection</b>: <code>LoopDetectionMiddleware</code> tracks repeated edits to the same file and nudges the agent to reconsider its approach.</li><li><b>Reasoning sandwich</b>: more reasoning compute (xhigh) on planning and verification, less (high) on implementation.</li></ul>
<p>These middlewares were LangChain's own harness work. The sketch below shows how you could build a doom-loop guard with the <code>wrap_tool_call</code> hook from Realm VII.</p>`,
code:`from collections import Counter
from langchain.agents.middleware import AgentMiddleware

class DoomLoopGuard(AgentMiddleware):
    """Nudge the agent when it keeps editing the same file."""
    def __init__(self, threshold: int = 4):
        super().__init__()
        self.threshold = threshold
        self.edits = Counter()

    def wrap_tool_call(self, request, handler):
        result = handler(request)
        call = request.tool_call
        if call["name"] in ("edit_file", "write_file"):
            path = call["args"].get("file_path") or call["args"].get("path")
            self.edits[path] += 1
            if self.edits[path] >= self.threshold:
                result.content = (f"{result.content}\\n\\nNote: you've edited {path} "
                                  f"{self.edits[path]} times. Step back and reconsider your approach.")
        return result`,lang:"py",sketch:"Sketch: not a library class",
cite:[{s:"harness",n:"Score, changes, middleware names"},{s:"mwcustom",n:"wrap_tool_call"}]}
],

{id:"r17",num:"✦",p:9,x:900,y:110,name:"The Loop Citadel",topic:"Final siege",citadel:true,
objective:"Prove you can combine every realm: harness, context, delegation and all four loops.",
sections:[
{id:"r17a",title:"The last gate",body:`
<p>This is the final siege. The questions combine ideas from several realms, as real designs do. Pass it to earn the title <b>Loop Architect</b>.</p>
<p>A quick map of what you've taken:</p>
<div class="tbl"><table><thead><tr><th>Need</th><th>Reach for</th></tr></thead><tbody>
<tr><td>A capable agent fast</td><td><code>create_deep_agent</code></td></tr>
<tr><td>Exact control of each step</td><td><code>create_agent</code> + middleware</td></tr>
<tr><td>Non-loop workflows</td><td>LangGraph <code>StateGraph</code></td></tr>
<tr><td>Fan out work, route from inside nodes</td><td><code>Send</code>, <code>Command</code></td></tr>
<tr><td>Debug or retry a past run</td><td><code>get_state_history</code>, replay, fork with <code>update_state</code></td></tr>
<tr><td>Memory in one conversation</td><td>checkpointer + <code>thread_id</code></td></tr>
<tr><td>Memory across conversations</td><td><code>StoreBackend</code> + <code>memory=</code></td></tr>
<tr><td>Keep the coordinator's context clean</td><td>subagents via <code>task</code></td></tr>
<tr><td>"Done" means done</td><td><code>RubricMiddleware</code></td></tr>
<tr><td>See what happened</td><td>LangSmith traces, <code>@traceable</code></td></tr>
<tr><td>Measure quality</td><td>datasets + code / LLM-as-judge / trajectory evaluators; online evals in production</td></tr>
<tr><td>Ship it</td><td><code>langgraph.json</code> → <code>langgraph deploy</code>; assistants, threads, runs</td></tr>
<tr><td>Plug in any model, store or tool</td><td><code>langchain-&lt;provider&gt;</code> packages; standard interfaces</td></tr>
<tr><td>Use tools from anywhere</td><td><code>MCPAdapter</code> → <code>list_tools()</code>; serve agents at <code>/mcp</code></td></tr>
<tr><td>Build on Google's stack</td><td>ADK <code>Agent</code>, workflow agents, <code>McpToolset</code>, A2A; trace with <code>configure_google_adk()</code></td></tr>
<tr><td>Run without being asked</td><td>crons, webhooks, Slack via LangSmith Deployment</td></tr>
<tr><td>Get better over time</td><td>traces → evals → harness changes, checked on a holdout set</td></tr></tbody></table></div>`,
cite:[{s:"artloop",n:"The four loops"},{s:"stack",n:"The three layers"}]}
],

{id:"qzm",type:"mc",q:"Your agent connects to a billing MCP server and a docs MCP server with different credentials, and both expose a search tool. Which setup handles both problems?",o:["One MCPConfig with a shared token","A ClientGroup with a Client per server; tools stay distinguishable by server prefix","Two separate agents","Rename tools by hand on the servers"],a:1,why:"ClientGroup gives each server its own auth, and namespacing keeps same-named tools apart.",s:"mcpauth"},

const LS_KEY = "lc-conquest-v1";
const RANKS = [["Recruit",0],["Scout",200],["Squire",550],["Knight",1000],["Captain",1600],["Warlord",2400]];
let S = {scouted:{}, answered:{}, missed:{}, conquered:{}, freeRoam:false};
try { const raw = localStorage.getItem(LS_KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}

let cloudRef = null, saving = false, dirty = false, saveTimer = null;
function persist(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e) {}
  if (!cloudRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 900);
}
async function flush(){
  if (!cloudRef) return;
  if (saving) { dirty = true; return; }
  saving = true;
  try { await cloudRef.set(JSON.parse(JSON.stringify(S))); }
  catch(e){ if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) { cloudRef = null; setSync(false); } }
  saving = false;
  if (dirty) { dirty = false; flush(); }
}
function mergeIn(o){
  if (!o) return;
  for (const k of ["scouted","conquered","missed"]) Object.assign(S[k], o[k] || {});
  for (const [q,v] of Object.entries(o.answered || {})) {
    if (!S.answered[q] || (v === "first")) S.answered[q] = v;
  }
  if (typeof o.freeRoam === "boolean") S.freeRoam = S.freeRoam || o.freeRoam;
}
function setSync(cloud){
  const el = document.getElementById("sync");
  el.classList.toggle("cloud", cloud);
  el.querySelector("span").textContent = cloud ? "Saved to your account" : "Saved in this browser";
}

const ALL_Q = REALMS.flatMap(r => r.siege.map(q => q.id));
function xp(){
  let x = Object.keys(S.scouted).length * 10;
  for (const v of Object.values(S.answered)) x += v === "first" ? 25 : 10;
  for (const id of Object.keys(S.conquered)) x += id === "r17" ? 300 : 100;
  return x;
}
function rankOf(x){
  if (S.conquered.r17) return {name:"Loop Architect", next:null, floor:x, ceil:x};
  let i = 0; for (let k=0;k<RANKS.length;k++) if (x >= RANKS[k][1]) i = k;
  const next = RANKS[i+1];
  return {name:RANKS[i][0], next: next ? next[0] : "Loop Architect", floor:RANKS[i][1], ceil: next ? next[1] : null};
}
const idx = id => REALMS.findIndex(r => r.id === id);
function status(r){
  if (S.conquered[r.id]) return "held";
  const i = idx(r.id);
  if (i === 0 || S.conquered[REALMS[i-1].id] || S.freeRoam) return "open";
  return "locked";
}

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function hl(code, lang){
  if (lang === "txt") return esc(code);
  if (lang === "sh") return code.split("\n").map(l => /^\s*#/.test(l) ? `<span class="tk-c">${esc(l)}</span>` : esc(l).replace(/(&quot;.*?&quot;)/g,'<span class="tk-s">$1</span>')).join("\n");
  const re = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|f?"(?:\\.|[^"\\\n])*"|f?'(?:\\.|[^'\\\n])*')|(@[A-Za-z_]\w*)|\b(def|class|return|from|import|as|if|elif|else|for|in|while|with|try|except|raise|None|True|False|async|await|lambda|and|or|not|is|pass|yield)\b|\b(\d+(?:\.\d+)?)\b/g;
  let out = "", last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const cls = m[1] ? "c" : m[2] ? "s" : m[3] ? "d" : m[4] ? "k" : "n";
    out += `<span class="tk-${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}
function codeBlock(code, lang, sketch){
  const tag = sketch ? `<span class="tag sketch">${esc(sketch)}</span>` : `<span class="tag">${lang === "sh" ? "shell" : lang === "json" ? "json" : "python"} · from the docs</span>`;
  return `<div class="codewrap"><div class="codehead">${tag}<button class="copy" type="button">Copy</button></div><pre class="code">${hl(code, lang)}</pre></div>`;
}

function contours(){
  const centers = [[220,1120,5],[640,760,6],[980,1060,5],[1050,510,4],[200,660,4],[760,610,3],[640,310,4],[400,150,4]];
  let d = "";
  centers.forEach(([cx,cy,n], ci) => {
    for (let k=1;k<=n;k++){
      const base = 22*k + 10;
      let p = "";
      for (let i=0;i<=72;i++){
        const t = i/72*Math.PI*2;
        const r = base + 7*Math.sin(3*t + ci + k*.6) + 5*Math.sin(5*t + ci*2) + 3*Math.cos(7*t + k);
        const x = cx + r*Math.cos(t)*1.35, y = cy + r*Math.sin(t)*.85;
        p += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
      }
      d += `<path class="contour" d="${p}Z" opacity="${(0.9 - k*0.1).toFixed(2)}"/>`;
    }
  });
  return d;
}
function smoothPath(pts){
  let d = `M${pts[0].x} ${pts[0].y}`;
  for (let i=0;i<pts.length-1;i++){
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    const c1x = p1.x + (p2.x - p0.x)/6, c1y = p1.y + (p2.y - p0.y)/6;
    const c2x = p2.x - (p3.x - p1.x)/6, c2y = p2.y - (p3.y - p1.y)/6;
    d += ` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2.x} ${p2.y}`;
  }
  return d;
}
let selected = null;
function mapSVG(){
  const held = REALMS.filter(r => S.conquered[r.id]);
  let heldPts = [];
  for (const r of REALMS){ if (S.conquered[r.id]) heldPts.push(r); else { heldPts.push(r); break; } }
  if (!S.conquered[REALMS[0].id]) heldPts = [];
  const nodes = REALMS.map(r => {
    const st = status(r), big = r.citadel;
    const sc = big ? 1.5 : 1.05;
    return `<g class="node ${st} ${selected===r.id?"sel":""}" data-id="${r.id}" tabindex="0" role="button" aria-label="Realm ${r.num}: ${esc(r.name)} (${st==="held"?"conquered":st==="open"?"open to attack":"locked"})" transform="translate(${r.x} ${r.y})">
      ${st==="open" ? `<circle class="pulse" r="22"/>` : ""}
      <g transform="scale(${sc})"><path class="shield" d="M-16 -18H16V2C16 14 0 22 0 22C0 22 -16 14 -16 2Z"/>
      ${big ? `<path d="M-9 4V-6H-5V-2H-2V-6H2V-2H5V-6H9V4Z" fill="${st==="held"?"#231904":st==="open"?"#F6CBC5":"#5D6880"}"/>` : `<text class="num" y="0" style="font-size:${r.num.length>=7?6.5:r.num.length>=6?7.5:r.num.length>=5?9:r.num.length>=4?10.5:13}px">${r.num}</text>`}</g>
      <text class="lbl" y="${big?50:40}">${esc(r.name.replace(/^The /,""))}</text>
    </g>`;
  }).join("");
  const provLabels = PROVINCES.map(p => `<text class="prov-label" x="${p.lx}" y="${p.ly}">${p.name}</text>`).join("");
  return `<svg viewBox="0 0 1200 1240" role="group" aria-label="Campaign map">
    <g>${contours()}</g>
    ${provLabels}
    <path class="road" d="${smoothPath(REALMS)}"/>
    ${heldPts.length > 1 ? `<path class="road-held" d="${smoothPath(heldPts)}"/>` : ""}
    ${nodes}
  </svg>`;
}

const orderState = {};
function shuffled(arr){
  const a = arr.map((v,i)=>i);
  for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  if (a.every((v,i)=>v===i)) a.reverse();
  return a;
}

      body = `<div class="order-picked">${q.items.map((it,k)=>`<div class="picked-item"><b>${k+1}</b>${esc(it)}</div>`).join("")}</div>`;
    } else {
      body = `<div class="order-picked" aria-label="Your order">${os.picked.length ? os.picked.map((ix,k)=>`<div class="picked-item"><b>${k+1}</b>${esc(q.items[ix])}</div>`).join("") : `<div class="picked-item" style="color:var(--faint)">Tap the items below in order.</div>`}</div>
      <div class="order-pool">${os.pool.filter(ix=>!os.picked.includes(ix)).map(ix=>`<button class="chip" type="button" data-oq="${q.id}" data-ix="${ix}">${esc(q.items[ix])}</button>`).join("")}</div>
      <div class="order-actions"><button class="btn" type="button" data-oreset="${q.id}" ${os.picked.length?"":"disabled"}>Clear</button></div>`;
    }
  }
  const fb = right ? `<div class="fb ok">Correct. ${esc(q.why)} <a href="${so.u}" target="_blank" rel="noopener">${esc(so.t)}</a></div>`
    : (S.missed[q.id] && q._lastWrong) ? `<div class="fb no">${esc(q._lastWrong)} Check <a href="${so.u}" target="_blank" rel="noopener">${esc(so.t)}</a>.</div>` : "";
  return `<div class="q ${right?"right":""}" id="q-${q.id}"><div class="qh"><span class="qn">${["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI"][qi]}.</span><p>${esc(q.q)}</p>${pts}</div>${body}${fb}</div>`;
}

let curRealm = null;
function viewRealm(id){
  const r = REALMS.find(x => x.id === id);
  if (!r || status(r) === "locked") { location.hash = ""; return; }
  curRealm = r;
  $("#app").innerHTML = realmHTML(r);
  bindRealm(r);
  setupOracle(r);
}
function rerenderSiege(r, qid){
  const y = window.scrollY;
  const qs = $("#siege .qs");
  qs.innerHTML = r.siege.map((q, qi) => questionHTML(q, qi)).join("");
  const won = !!S.conquered[r.id];
  const nRight = r.siege.filter(q => S.answered[q.id]).length;
  const m = $(".siege-meter");
  m.innerHTML = `<h4>Siege progress</h4>${nRight} of ${r.siege.length} answered correctly<div class="bar2"><div style="width:${nRight/r.siege.length*100}%"></div></div>`;
  m.classList.toggle("won", won);
  window.scrollTo(0, y);
  if (qid) { const b = document.querySelector(`#q-${qid} button:not(:disabled)`); if (b) b.focus({preventScroll:true}); }
}
function bindRealm(r){
  $("#back").onclick = () => { location.hash = ""; };
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  document.querySelectorAll("[data-jump]").forEach(a => a.onclick = e => { e.preventDefault(); document.getElementById(a.dataset.jump).scrollIntoView({behavior:"smooth", block:"start"}); });
  document.querySelectorAll(".copy").forEach(b => b.onclick = () => {
    const pre = b.closest(".codewrap").querySelector("pre");
    const done = () => { b.textContent = "Copied"; setTimeout(()=>b.textContent="Copy", 1400); };
    try {
      navigator.clipboard.writeText(pre.textContent).then(done, () => selectText(pre));
    } catch(e) { selectText(pre); }
  });
}
function onAppClick(e){
    const r = curRealm; if (!r) return;
    const sc = e.target.closest("[data-scout]");
    if (sc && !S.scouted[sc.dataset.scout]) {
      S.scouted[sc.dataset.scout] = true; persist(); updateBar();
      sc.classList.add("done"); sc.textContent = "✓ Scouted";
      sc.parentElement.querySelector(".eyebrow").textContent = "Scouted";
      const li = document.querySelector(`[data-jump="${sc.dataset.scout}"]`); if (li) li.parentElement.classList.add("done");
      toast("<b>+10 XP</b> · briefing scouted");
      return;
    }
    const opt = e.target.closest(".opt");
    if (opt && !opt.disabled) { answerMC(r, opt.dataset.q, +opt.dataset.o); return; }
    const chip = e.target.closest("[data-oq]");
    if (chip) {
      const q = r.siege.find(x => x.id === chip.dataset.oq), os = orderState[q.id];
      os.picked.push(+chip.dataset.ix);
      if (os.picked.length === q.items.length) {
        const ok = os.picked.every((v,i)=>v===i);
        if (ok) correct(r, q); else {
          const k = os.picked.findIndex((v,i)=>v!==i);
          S.missed[q.id] = true; q._lastWrong = `Not quite. Position ${k+1} is the first one out of place.`;
          os.picked = []; persist(); rerenderSiege(r, q.id);
        }
      } else rerenderSiege(r, q.id);
      return;
    }
    const rs = e.target.closest("[data-oreset]");
    if (rs) { orderState[rs.dataset.oreset].picked = []; rerenderSiege(r); }
}
function selectText(el){ const range = document.createRange(); range.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(range); }
function answerMC(r, qid, oi){
  const q = r.siege.find(x => x.id === qid);
  if (S.answered[qid]) return;
  if (oi === q.a) correct(r, q);
  else {
    (wrongPicks[qid] ||= new Set()).add(oi);
    S.missed[qid] = true; q._lastWrong = "Not that one. Try again.";
    persist(); rerenderSiege(r, qid);
  }
}
function correct(r, q){
  const first = !S.missed[q.id];
  S.answered[q.id] = first ? "first" : "retry";
  persist(); updateBar();
  toast(`<b>${first ? "+25" : "+10"} XP</b> · ${first ? "first-try strike" : "breach on retry"}`);
  rerenderSiege(r);
  if (!S.conquered[r.id] && r.siege.every(x => S.answered[x.id])) {
    S.conquered[r.id] = Date.now(); persist(); updateBar();
    setTimeout(() => victory(r), 350);
  }
}
function victory(r){
  const i = idx(r.id), next = REALMS[i+1];
  const v = document.createElement("div"); v.className = "victory"; v.setAttribute("role","dialog"); v.setAttribute("aria-modal","true");
  v.innerHTML = `<div class="card">
    <svg width="90" height="110" viewBox="-18 -20 36 44" aria-hidden="true"><path d="M-16 -18H16V2C16 14 0 22 0 22C0 22 -16 14 -16 2Z" fill="#D9A940" stroke="#F3D58E" stroke-width="1.5"/><text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-family="IM Fell English SC, Georgia, serif" font-size="${r.num.length>=7?5.2:r.num.length>=6?6:r.num.length>=5?7:r.num.length>3?8:11}" fill="#231904">${r.num}</text></svg>
    <h2>${r.citadel ? "The Citadel falls" : "Realm conquered"}</h2>
    <p>${r.citadel ? "You are now a <b style='color:var(--gold)'>Loop Architect</b>. +300 XP." : `${esc(r.name)} is yours. +100 XP.`}</p>
    <p>${next ? `The road to <b>${esc(next.name)}</b> is open.` : "Every realm is held."}</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px">
      ${next ? `<button class="btn primary" id="vNext" type="button">March on</button>` : ""}
      <button class="btn" id="vMap" type="button">War table</button>
    </div></div>`;
  document.body.appendChild(v);
  const close = () => v.remove();
  const stay = () => { close(); const y = window.scrollY; viewRealm(r.id); window.scrollTo(0, y); };
  (v.querySelector("#vNext") || v.querySelector("#vMap")).focus();
  if (v.querySelector("#vNext")) v.querySelector("#vNext").onclick = () => { close(); go(next.id); };
  v.querySelector("#vMap").onclick = () => { close(); selected = next ? next.id : r.id; location.hash = ""; };
  v.addEventListener("keydown", e => { if (e.key === "Escape") stay(); });
  v.addEventListener("click", e => { if (e.target === v) stay(); });
}

/* =====================================================================
   ORACLE (sample capability)
   ===================================================================== */

    r38:["Which SessionService should I use in production?","When should I use temp: state?"],

    r40:["When should I use a Workflow graph instead of a SequentialAgent?","How do I merge ParallelAgent results?"],
    r41:["Callbacks vs plugins: which for logging?","How do I write my first ADK evalset?"],

  };
  return base[r.id] || [`Explain "${r.sections[0].title}" with a concrete example`, "What mistakes do beginners make here?"];
}
function realmText(r){
  const strip = h => h.replace(/<svg[\s\S]*?<\/svg>/g,"").replace(/<[^>]+>/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/\s+/g," ").trim();
  return r.sections.map(s => `## ${s.title}\n${strip(s.body)}${s.code ? "\n```\n"+s.code+"\n```" : ""}${s.code2 ? "\n```\n"+s.code2+"\n```" : ""}\nSources: ${(s.cite||[]).map(c=>"["+c.s+"]").join(" ")}`).join("\n\n").slice(0, 14000);
}
function mdLite(t){
  const parts = t.split(/```[a-zA-Z]*\n?/);
  return parts.map((p, i) => {
    if (i % 2) return `<pre>${esc(p.replace(/\n$/,""))}</pre>`;
    return p.split(/\n{2,}/).filter(x=>x.trim()).map(par => "<p>" + esc(par)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/\n/g, "<br>") + "</p>").join("");
  }).join("");
}
function setupOracle(r){
  if (!sampleFn) return;
  const box = $("#oracle"); box.hidden = false;
  let ctl = null;
  box.querySelectorAll("[data-sug]").forEach(b => b.onclick = () => { $("#oq").value = b.dataset.sug; $("#oq").focus(); });
  $("#ostop").onclick = () => ctl?.abort();
  $("#oask").onclick = async () => {
    const question = $("#oq").value.trim();
    if (!question) { $("#ohint").textContent = "Type a question first."; return; }
    const srcList = [...new Set(r.sections.flatMap(s => (s.cite||[]).map(c=>c.s)))].map(k => `[${k}] ${SOURCES[k].t}: ${SOURCES[k].u}`).join("\n");
    const prompt = `You are the Oracle in "LangChain Conquest", a learning game that teaches LangChain, LangGraph, Deep Agents and loop engineering.
The learner is in Realm ${r.num}, "${r.name}" (${r.topic}). Answer their question using the realm briefing below as your primary ground truth.
Rules:
- Stay consistent with the briefing's API names and imports. If the briefing does not cover something, say so plainly and point to the most relevant source URL rather than inventing API details.
- Cite sources inline by their bracket id, e.g. [agents].
- Be concrete and brief: under 220 words. Use one short Python code block only if it helps.
- Plain text with optional \`inline code\`, **bold**, and \`\`\` code fences. No headings.

REALM BRIEFING
${realmText(r)}

SOURCES
${srcList}

LEARNER'S QUESTION
${question}`;
    ctl = new AbortController();
    const ans = $("#oans"); ans.hidden = false; ans.textContent = "The Oracle is thinking…";
    $("#oask").disabled = true; $("#ostop").hidden = false; $("#ohint").textContent = "";
    try {
      await sampleFn(prompt, { signal: ctl.signal, onText: ({text}) => { ans.innerHTML = mdLite(text); } });
    } catch(e) {
      if (e && e.text) ans.innerHTML = mdLite(e.text); else if (!e || e.code !== "cancelled") ans.textContent = "";
      const c = e && e.code;
      if (c === "not_granted" || c === "sampling_disabled" || c === "not_declared" || c === "capability_disabled" || c === "capability_removed") { sampleFn = null; box.hidden = true; }
      else if (c === "rate_limited") $("#ohint").textContent = "The Oracle needs a rest. Try again in a little while.";
      else if (c === "refused") { ans.hidden = true; $("#ohint").textContent = "The Oracle declined that one. Try rephrasing."; }
      else if (c !== "cancelled") $("#ohint").textContent = "The answer was interrupted. Ask again to retry.";
    } finally {
      $("#oask").disabled = false; $("#ostop").hidden = true;
    }
  };
}

/* =====================================================================
   ROUTING + BOOT
   ===================================================================== */
function rerenderCurrent(){
  const y = window.scrollY;
  if (curRealm) { const typed = $("#oq") && $("#oq").value; viewRealm(curRealm.id); if (typed && $("#oq")) $("#oq").value = typed; }
  else viewHome();
  window.scrollTo(0, y);
}
function go(id){ if (location.hash === "#" + id) { viewRealm(id); window.scrollTo(0,0); } else location.hash = id; }
function route(){
  const h = location.hash.slice(1);
  if (h && REALMS.some(r => r.id === h)) { viewRealm(h); window.scrollTo(0,0); }
  else { curRealm = null; viewHome(); }
}
window.addEventListener("hashchange", route);
$("#app").addEventListener("click", onAppClick);
$("#brand").onclick = e => { e.preventDefault(); location.hash = ""; if (!location.hash) route(); };
updateBar();
route();

(async function initCapabilities(){
  const c = window.claude;
  if (!c || typeof c.use !== "function") return;
  c.use("sample").then(fn => { if (fn) { sampleFn = fn; if (curRealm) setupOracle(curRealm); } }).catch(()=>{});
  try {
    const [user, db] = await Promise.all([c.use("user"), c.use("db")]);
    if (!user || !db) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc("data/users/" + id + "/campaign");
    const snap = await ref.get();
    const hadLocal = Object.keys(S.scouted).length + Object.keys(S.answered).length > 0;
    if (snap.exists) mergeIn(snap.data());
    cloudRef = ref; setSync(true);
    updateBar(); rerenderCurrent();
    if (hadLocal) persist(); else { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e) {} }
  } catch(e) { cloudRef = null; setSync(false); }
})();
</script>
