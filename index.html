<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A conquest-style campaign from LangChain basics through Deep Agents, LangSmith, advanced LangGraph, integrations and MCP, and Google ADK, to loop engineering. Every briefing links to official docs.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>LangChain Conquest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0E131D; --bg-deep:#0A0E16; --panel:#151D2C; --panel2:#1B2538; --line:#2A3750; --line-soft:#212C40;
  --text:#E9E1CC; --muted:#A3AABA; --faint:#6F7A8E;
  --gold:#D9A940; --gold-soft:#D9A94026; --gold-ink:#231904;
  --gules:#D24A3F; --gules-soft:#D24A3F22;
  --azure:#7AA3E6; --vert:#6DB487; --vert-soft:#6DB48720;
  --contour:#2C3B57;
  --code-bg:#0B1019; --k:#E8877A; --s:#A6D394; --c:#6F7A8E; --d:#E4BA5C; --n:#8FB4F0;
  --display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --italic:"IM Fell English", "Iowan Old Style", Georgia, serif;
  --body:"Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--text);font-family:var(--body);font-size:17px;line-height:1.6;margin:0;
  background:radial-gradient(1200px 700px at 70% -10%, #18233A 0%, transparent 60%), var(--bg);}
a{color:var(--azure);text-underline-offset:3px}
a:hover{color:#A9C4F2}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
code{font-family:var(--mono);font-size:.84em;background:var(--panel2);border:1px solid var(--line-soft);padding:.05em .35em;border-radius:4px;color:#F1E6C8}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
@media (max-width:480px){.wrap{padding-inline:16px}}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#0E131DEE;backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft)}
.bar .wrap{display:flex;align-items:center;gap:20px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:22px;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand svg{flex:none}
.rank{display:flex;align-items:center;gap:12px;flex:1;min-width:220px}
.rank-name{font-family:var(--display);font-size:18px;color:var(--gold);white-space:nowrap}
.xp{flex:1;min-width:100px}
.xp-track{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;border:1px solid var(--line-soft)}
.xp-fill{height:100%;background:linear-gradient(90deg,#B8862A,var(--gold));width:0;transition:width .6s ease}
.xp-label{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px;display:flex;justify-content:space-between;gap:8px}
.held{font-size:14px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.held b{color:var(--text);font-weight:700}
.sync{font-size:12px;color:var(--faint);white-space:nowrap;display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.sync.cloud i{background:var(--vert)}
@media (max-width:640px){.bar{position:static}.sync{display:none}.aside{top:16px}}

/* ---------- war table ---------- */
.hero{padding-block:34px 8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.05}
.hero p{color:var(--muted);max-width:62ch;margin:.6em 0 0}
.hero .actions{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-decoration:none;color:var(--text);font-weight:500;font-size:15px;line-height:1.3}
.btn:hover{border-color:var(--faint);background:var(--panel2)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700}
.btn.primary:hover{background:#E7B954}
.btn.danger{border-color:#6B2A26;color:#F0A39C}
.btn:disabled{opacity:.45;cursor:not-allowed}

.map-frame{margin-top:22px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,#121A29,#0F1521);position:relative;overflow:hidden}
.map-frame svg{display:block;width:100%;height:auto}
.contour{fill:none;stroke:var(--contour);stroke-width:1}
.road{fill:none;stroke:#3A4864;stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round}
.road-held{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;opacity:.75}
.prov-label{font-family:var(--italic);font-style:italic;font-size:17px;fill:#8794AD;letter-spacing:.04em}
.node{cursor:pointer}
.node .shield{stroke-width:2}
.node.locked .shield{fill:#1A2234;stroke:#34425E}
.node.open .shield{fill:#3A1714;stroke:var(--gules)}
.node.held .shield{fill:var(--gold);stroke:#F3D58E}
.node .num{font-family:var(--display);font-size:13px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node.locked .num{fill:#5D6880}
.node.open .num{fill:#F6CBC5}
.node.held .num{fill:var(--gold-ink)}
.node .lbl{font-family:var(--display);font-size:14px;fill:#C6CCD8;text-anchor:middle;pointer-events:none}
.node.locked .lbl{fill:#5F6A80}
.node.sel .shield{stroke:#fff;stroke-width:2.5}
.node:focus{outline:none}
.node:focus-visible .shield{stroke:#fff;stroke-width:3}
.pulse{fill:none;stroke:var(--gules);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{opacity:.8;transform:scale(.9)}100%{opacity:0;transform:scale(1.9)}}
@media (max-width:680px){.node .lbl{display:none}.prov-label{font-size:20px}}

.selcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 18px;border-top:1px solid var(--line);background:#131B2AE6}
.selcard h3{font-size:24px}
.selcard p{margin:.2em 0 0;color:var(--muted)}
@media (max-width:560px){.selcard{grid-template-columns:1fr}}

.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:46px 0 14px;flex-wrap:wrap}
.section-h h2{font-size:30px}
.section-h p{margin:0;color:var(--muted);font-size:15px}

.province{margin-bottom:26px}
.province-h{display:flex;gap:12px;align-items:baseline;margin-bottom:10px;border-bottom:1px solid var(--line-soft);padding-bottom:6px;flex-wrap:wrap}
.province-h h3{font-size:21px;color:var(--text)}
.province-h span{color:var(--faint);font-size:14px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.realm-card{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start;text-align:left;padding:12px 14px;border-radius:8px;border:1px solid var(--line-soft);background:var(--panel);cursor:pointer;width:100%}
.realm-card:hover{border-color:var(--line);background:var(--panel2)}
.realm-card.locked{opacity:.62}
.realm-card .badge{width:40px;height:44px}
.realm-card .rc-t{display:block;font-family:var(--display);font-size:18px;line-height:1.2}
.realm-card .rc-s{display:block;margin-top:2px;font-size:14px;color:var(--muted);line-height:1.4}
.realm-card .state{font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-top:6px;display:block}
.state.held{color:var(--gold)} .state.open{color:#F08C82} .state.locked{color:var(--faint)}

.codex{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.src{padding:12px 14px;border:1px solid var(--line-soft);border-radius:8px;background:var(--panel)}
.src a{font-weight:500}
.src .meta{font-size:13px;color:var(--faint);margin-top:2px}
.src .used{font-size:13px;color:var(--muted);margin-top:6px}
.ranks{display:flex;flex-wrap:wrap;gap:8px}
.rank-chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.rank-chip.got{border-color:var(--gold);color:var(--gold)}
.settings{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 0 50px}
.toggle{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted);cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--gold)}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:15px;color:#F0A39C}

/* ---------- realm view ---------- */
.realm-top{padding-block:26px 6px}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;font-size:15px;background:none;border:0;cursor:pointer;padding:4px 0}
.back:hover{color:var(--text)}
.realm-top h1{font-size:clamp(34px,5vw,52px);line-height:1.05;margin-top:10px}
.realm-top .topic{font-family:var(--italic);font-style:italic;font-size:22px;color:var(--muted);margin-top:4px}
.objective{margin-top:14px;padding:10px 14px;border-left:3px solid var(--gold);background:var(--gold-soft);border-radius:0 6px 6px 0;max-width:72ch}
.objective b{color:var(--gold);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;margin-right:6px}
.realm-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:34px;margin-top:26px;align-items:start}
@media (max-width:920px){.realm-grid{grid-template-columns:1fr}}
.aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:grid;gap:14px}
@media (max-width:920px){.aside{position:static;order:-1}}
.abox{border:1px solid var(--line-soft);border-radius:8px;padding:14px;background:var(--panel)}
.abox h4{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:17px}
.objlist{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:15px}
.objlist a{color:var(--muted);text-decoration:none;display:flex;gap:8px;align-items:baseline}
.objlist a:hover{color:var(--text)}
.objlist .tick{flex:none;width:14px;height:14px;border:1.5px solid var(--faint);border-radius:3px;transform:translateY(2px)}
.objlist .done .tick{background:var(--vert);border-color:var(--vert)}
.objlist .done a{color:var(--text)}
.siege-meter{font-size:15px;color:var(--muted)}
.siege-meter .bar2{height:6px;border-radius:3px;background:var(--panel2);margin-top:8px;overflow:hidden}
.siege-meter .bar2 div{height:100%;background:var(--gules);transition:width .4s}
.siege-meter.won .bar2 div{background:var(--gold)}
.mini-src{font-size:14px;display:grid;gap:6px}
.mini-src a{text-decoration:none}

.brief{display:grid;gap:22px;min-width:0}
.sec{border:1px solid var(--line-soft);border-radius:10px;background:var(--panel);padding:20px 22px;min-width:0;scroll-margin-top:90px}
@media (max-width:480px){.sec{padding:16px}}
.sec h2{font-size:26px;display:flex;gap:12px;align-items:baseline}
.sec h2 .idx{font-family:var(--body);font-size:13px;color:var(--faint);letter-spacing:.1em}
.prose{max-width:68ch}
.prose p{margin:.7em 0}
.prose ul,.prose ol{padding-left:1.25em;margin:.6em 0}
.prose li{margin:.3em 0}
.prose blockquote{margin:1em 0;padding:4px 0 4px 16px;border-left:2px solid var(--gold);font-family:var(--italic);font-style:italic;font-size:19px;color:#E6D7B0;line-height:1.45}
.tbl{overflow-x:auto;margin:.9em 0;border:1px solid var(--line-soft);border-radius:8px}
.tbl table{border-collapse:collapse;width:100%;font-size:15px;min-width:480px}
.tbl th,.tbl td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl th{font-weight:500;color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase;background:var(--panel2)}
.tbl tr:last-child td{border-bottom:0}
.codewrap{margin:1em 0;border:1px solid var(--line-soft);border-radius:8px;background:var(--code-bg);overflow:hidden}
.codehead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px 6px 14px;border-bottom:1px solid var(--line-soft);font-size:12px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.codehead .tag{color:var(--muted)}
.codehead .tag.sketch{color:var(--d)}
.copy{background:none;border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-size:12px;cursor:pointer;color:var(--muted);text-transform:none;letter-spacing:0}
.copy:hover{color:var(--text)}
pre.code{margin:0;padding:14px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55;color:#DCE3EF;tab-size:4}
.tk-k{color:var(--k)} .tk-s{color:var(--s)} .tk-c{color:var(--c);font-style:italic} .tk-d{color:var(--d)} .tk-n{color:var(--n)}
.cites{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.cite{display:inline-flex;gap:6px;align-items:center;font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);text-decoration:none;max-width:100%}
.cite:hover{color:var(--text);border-color:var(--faint)}
.cite svg{flex:none}
.cite span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line-soft);flex-wrap:wrap}
.scout-btn.done{border-color:var(--vert);color:var(--vert)}
.diagram{margin:1em 0;overflow-x:auto}
.diagram svg{display:block;max-width:100%;height:auto;margin:0 auto}
.dg-box{fill:var(--panel2);stroke:var(--line)}
.dg-hot{fill:#3A1714;stroke:var(--gules)}
.dg-gold{fill:var(--gold-soft);stroke:var(--gold)}
.dg-t{fill:var(--text);font-family:var(--body);font-size:14px}
.dg-s{fill:var(--muted);font-family:var(--body);font-size:12px}
.dg-a{stroke:var(--muted);stroke-width:1.5;fill:none}
.dg-ring{fill:none;stroke-width:1.5}

/* siege */
.siege{margin-top:30px;border:1px solid #4A2724;border-radius:10px;background:linear-gradient(180deg,#1C1518,#161B28);padding:22px}
.siege.won{border-color:#6E5622;background:linear-gradient(180deg,#1E1A10,#161B28)}
.siege-h{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.siege-h h2{font-size:30px}
.siege-h p{margin:0;color:var(--muted);font-size:15px}
.qs{display:grid;gap:16px;margin-top:16px}
.q{border:1px solid var(--line-soft);border-radius:8px;padding:16px;background:#121826}
.q.right{border-color:#3C6B4D}
.qh{display:flex;gap:10px;align-items:baseline}
.qh .qn{font-family:var(--display);color:var(--gules);font-size:16px;flex:none}
.q.right .qh .qn{color:var(--vert)}
.qh p{margin:0;font-weight:500}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{text-align:left;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:15.5px;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--faint);background:var(--panel2)}
.opt.bad{border-color:#7A2F29;color:#E9A49D;background:var(--gules-soft);cursor:not-allowed;text-decoration:line-through;text-decoration-color:#E9A49D88}
.opt.good{border-color:var(--vert);background:var(--vert-soft);color:#CFEBD9}
.opt:disabled{cursor:default}
.order-pool,.order-picked{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.order-picked{min-height:44px;padding:8px;border:1px dashed var(--line);border-radius:6px;flex-direction:column}
.chip{padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:15px;text-align:left}
.chip:hover{border-color:var(--faint)}
.picked-item{display:flex;gap:10px;font-size:15px;padding:4px 6px}
.picked-item b{color:var(--gold);font-family:var(--display);font-weight:400;min-width:1.4em}
.order-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.fb{margin-top:10px;font-size:15px;line-height:1.5}
.fb.ok{color:#BFE3CB}
.fb.no{color:#F0A39C}
.fb a{font-size:14px}
.pts{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-left:auto;flex:none}

/* oracle */
.oracle{margin-top:26px;border:1px solid var(--line);border-radius:10px;padding:20px 22px;background:var(--panel)}
.oracle h2{font-size:26px}
.oracle p.lead{color:var(--muted);margin:.3em 0 .8em;font-size:15px;max-width:66ch}
.oracle textarea{width:100%;min-height:76px;resize:vertical;background:var(--bg-deep);border:1px solid var(--line);border-radius:6px;color:var(--text);font:inherit;font-size:16px;padding:10px 12px}
.oracle .row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;align-items:center}
.oracle .hint{font-size:13px;color:var(--faint)}
.answer{margin-top:14px;padding:14px 16px;border-radius:8px;background:var(--bg-deep);border:1px solid var(--line-soft);font-size:16px;max-width:76ch;overflow-wrap:anywhere}
.answer p{margin:.5em 0}
.answer pre{background:var(--code-bg);padding:10px;border-radius:6px;overflow-x:auto;font-family:var(--mono);font-size:13px}
.suggest{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.suggest button{font-size:13.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--muted)}
.suggest button:hover{color:var(--text);border-color:var(--faint)}

.next-nav{display:flex;justify-content:space-between;gap:12px;margin:30px 0 60px;flex-wrap:wrap}

/* toast + banner */
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:50;max-width:calc(100% - 32px)}
.toast{background:var(--panel2);border:1px solid var(--gold);color:var(--text);padding:10px 14px;border-radius:8px;font-size:15px;box-shadow:0 8px 30px #0008;animation:tin .25s ease-out}
.toast b{color:var(--gold)}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.victory{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#05080DCC;padding:16px}
.victory .card{max-width:440px;width:100%;text-align:center;padding:30px 24px;border-radius:12px;border:1px solid var(--gold);background:linear-gradient(180deg,#221B0E,#141B29)}
.victory .card svg{animation:drop .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translateY(-40px) scale(.8);opacity:0}to{transform:none;opacity:1}}
.victory h2{font-size:34px;color:var(--gold);margin-top:10px}
.victory p{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<header class="bar">
  <div class="wrap">
    <a class="brand" href="#" id="brand">
      <svg width="26" height="28" viewBox="-18 -20 36 44" aria-hidden="true"><path d="M-16 -18H16V2C16 14 0 22 0 22C0 22 -16 14 -16 2Z" fill="#D9A940" stroke="#F3D58E" stroke-width="2"/><path d="M-7 -6 0 6 7 -6" fill="none" stroke="#231904" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      LangChain Conquest
    </a>
    <div class="rank">
      <span class="rank-name" id="rankName">Recruit</span>
      <div class="xp">
        <div class="xp-track"><div class="xp-fill" id="xpFill"></div></div>
        <div class="xp-label"><span id="xpNow">0 XP</span><span id="xpNext">200 to Scout</span></div>
      </div>
    </div>
    <span class="held">Realms held <b id="heldN">0</b> / <span id="heldT">17</span></span>
    <span class="sync" id="sync"><i></i><span>Saved in this browser</span></span>
  </div>
</header>

<main id="app"></main>

{id:"r1a",title:"Three layers, one stack",body:`
<p>"LangChain" now means three packages that sit on top of each other. Each one trades some determinism for more agency.</p>
<blockquote>LangGraph is an agent runtime, LangChain is an agent framework, and Deep Agents is an agent harness.</blockquote>
<div class="tbl"><table><thead><tr><th>Layer</th><th>Role</th><th>What you get</th></tr></thead><tbody>
<tr><td><b>LangGraph</b></td><td>Agent runtime</td><td>Graph-based workflows, durable execution, human-in-the-loop, fault tolerance, observability. The most deterministic end.</td></tr>
<tr><td><b>LangChain</b></td><td>Agent framework</td><td>Abstractions and integrations, plus a minimal, unopinionated agent built around a simple loop (<code>create_agent</code>).</td></tr>
<tr><td><b>Deep Agents</b></td><td>Agent harness</td><td>An off-the-shelf harness with context-management practices bundled in: filesystem, subagents, skills, memory. The most agency.</td></tr>
</tbody></table></div>`,
cite:[{s:"stack",n:"Defines runtime / framework / harness"}]},
{id:"r1b",title:"Which layer to reach for",body:`
<ul>
<li><b>Deep Agents</b>: start here when you want a capable agent with planning, files, subagents and memory already wired in.</li>
<li><b>LangChain</b>: choose it when you need fine-grained control over which tools and context reach the model at each step, and for RAG question-answering apps.</li>
<li><b>LangGraph</b>: reach for it when your agent doesn't fit a standard loop, or you need to mix deterministic and agentic steps in one workflow. The article's example is processing rental applications.</li>
</ul>
<p>These layers nest. A deep agent is built from LangChain's agent, and LangChain's agent runs on LangGraph. You can drop down a layer whenever you need more control.</p>`,

{id:"r2b",title:"Three ways to call",body:`

code:`response = model.invoke("Why do parrots talk?")

for chunk in model.stream("Why do parrots talk?"):
    print(chunk.text, end="", flush=True)

responses = model.batch([

    "How do airplanes fly?",
])`,lang:"py",cite:[{s:"models",n:"invoke / stream / batch"}]},

code:`response = model.invoke([

{id:"q2b",type:"mc",q:"You have 200 independent product descriptions to summarize. Which call runs them in parallel?",o:["model.batch([...])","A for-loop of model.stream()","model.bind_tools()","init_chat_model(parallel=True)"],a:0,why:"batch() sends multiple requests in parallel.",s:"models"},

{id:"q2d",type:"mc",q:"What is init_chat_model for?",o:["Training a model on your data","One interface to initialize chat models across providers","Starting a LangSmith project","Creating an agent with tools"],a:1,why:"It initializes a chat model from an identifier and parameters, whatever the provider.",s:"models"}

/* ------------------------------------------------------------ III */
{id:"r3",num:"III",p:0,x:320,y:1160,name:"The Armory",topic:"Tools",
objective:"Write tools a model can choose correctly, and understand who actually runs them.",
sections:[
{id:"r3a",title:"Forge a tool",body:`
<p>Decorate a function with <code>@tool</code>. Its name, type hints and docstring become what the model reads when it decides whether to call it. Write the docstring for the model: say when to use the tool and what it returns.</p>`,
code:`from langchain.tools import tool

@tool
def get_weather(location: str) -> str:
    """Get weather at a location."""
    return f"It's sunny in {location}."`,lang:"py",cite:[{s:"models",n:"@tool + bind_tools example"}]},
{id:"r3b",title:"Bind, but don't run",body:`
<p><code>bind_tools</code> tells the model which tools exist. When the model wants one, it returns a <b>tool call request</b> with a name, arguments and an id. The function is <em>not</em> executed. Some code has to run it and send the result back as a tool message. That code is the agent loop, which is the next realm.</p>`,
code:`model_with_tools = model.bind_tools([get_weather])
response = model_with_tools.invoke("What's the weather in Boston?")

print(response.tool_calls)
# [{'name': 'get_weather', 'args': {'location': 'Boston'}, 'id': '...', 'type': 'tool_call'}]`,lang:"py",cite:[{s:"models",n:"bind_tools"}]},
{id:"r3c",title:"What an agent accepts as a tool",body:`
<p><code>create_agent(tools=...)</code> takes plain Python callables, LangChain tools, or tool dicts. Deep Agents' quickstart passes a bare function with a type-hinted signature. Later you'll meet tools the harness provides for you (<code>write_todos</code>, the filesystem tools, and <code>task</code> for subagents), ready-made integration tools (Realm XXVIII), and tools from any MCP server (Realm XXIX).</p>`,
cite:[{s:"agents",n:"tools: callables, LangChain tools, or dicts"},{s:"daover",n:"Quickstart passes a plain function"}]}
],
siege:[
{id:"q3a",type:"mc",q:"After model_with_tools.invoke(\"weather in Boston?\"), has get_weather run?",o:["Yes, bind_tools executes tools automatically","No. The model returned a tool call request, and something else must execute it","Only if temperature is 0","Only when streaming"],a:1,why:"Binding exposes the schema. Execution belongs to your code or the agent loop.",s:"models"},
{id:"q3b",type:"mc",q:"What does the model use to decide whether your tool fits?",o:["The function body","Its name, argument schema and docstring","The file it's defined in","Its return value from a previous run"],a:1,why:"The model never sees your code, only the description and schema.",s:"models"},
{id:"q3c",type:"mc",q:"Which of these can you pass in create_agent(tools=[...])?",o:["Only @tool-decorated functions","Only tool dicts","Python callables, LangChain tools, or tool dicts","Only MCP servers"],a:2,why:"The agents docs list all three forms.",s:"agents"}
]},
/* ------------------------------------------------------------ IV */
{id:"r4",num:"IV",p:1,x:440,y:1110,name:"The Crossroads of the Loop",topic:"create_agent and the agent loop",
objective:"Build your first agent and trace exactly what happens inside one run.",
sections:[
{id:"r4a",title:"The loop at the heart",body:`
<blockquote>An agent is a model calling tools in a loop until a given task is complete.</blockquote>
${DIAG_LOOP}
<ol><li>The model receives the messages and the tool schemas.</li><li>It returns either a final answer or one or more tool calls.</li><li>Tools execute and their results are appended as tool messages.</li><li>The model reads the results and decides again.</li><li>When it responds with no tool calls, the loop ends.</li></ol>
<p>Everything else in this campaign is about what you put <em>around</em> this loop.</p>`,
cite:[{s:"agents",n:"\"a model calling tools in a loop\""},{s:"ctx",n:"The two-step loop"}]},
{id:"r4b",title:"create_agent",body:`
<p>One call builds the loop. Its parameters are your first set of levers:</p>
<div class="tbl"><table><thead><tr><th>Parameter</th><th>What it controls</th></tr></thead><tbody>
<tr><td><code>model</code></td><td>A <code>"provider:model"</code> string or a model instance</td></tr>
<tr><td><code>tools</code></td><td>What the agent can do</td></tr>
<tr><td><code>system_prompt</code></td><td>Standing instructions</td></tr>
<tr><td><code>middleware</code></td><td>Hooks into every step (Province III)</td></tr>
<tr><td><code>response_format</code></td><td>Validated structured output</td></tr>
<tr><td><code>checkpointer</code></td><td>Persistence across calls</td></tr>
<tr><td><code>state_schema</code> / <code>context_schema</code></td><td>Extra state fields / per-run configuration</td></tr>
<tr><td><code>name</code></td><td>Identifier for multi-agent systems</td></tr>
</tbody></table></div>`,
code:`from langchain.agents import create_agent
from langchain.tools import tool

@tool
def search(query: str) -> str:
    """Search for information."""
    return f"Results for: {query}"

agent = create_agent(
    model="anthropic:claude-sonnet-5",
    tools=[search],
    system_prompt="You are a helpful assistant.",
)`,lang:"py",cite:[{s:"agents",n:"Signature and basic example"}]},
{id:"r4c",title:"Run it and read the messages",body:`
<p>The result is the final state. <code>result["messages"]</code> holds the whole run in order: your message, the model's tool calls, the tool messages, and the final answer at the end.</p>`,
code:`result = agent.invoke(
    {"messages": [{"role": "user", "content": "Find the LangGraph release notes"}]}
)

for m in result["messages"]:
    print(type(m).__name__, getattr(m, "tool_calls", None) or m.content[:80])

print(result["messages"][-1].content)   # the final answer`,lang:"py",
cite:[{s:"agents",n:"Invocation"}]},
{id:"r4d",title:"Watch it, don't guess",body:`
<p>With tracing on, every model call and tool call in a run appears as a span in LangSmith, along with inputs, outputs and timing. Get used to opening the trace whenever an agent surprises you. The Observatory (Realms XIII–XVI) teaches you to read and score traces, and the last province uses them to improve the agent.</p>`,
cite:[{s:"evals",n:"Tracing env vars"},{s:"mining",n:"Traces as the raw material for improvement"}]}
],
siege:[
{id:"q4a",type:"order",q:"Put one turn of the agent loop in order.",items:["Model reads messages and tool schemas","Model returns tool calls","Tools run; results appended as tool messages","Model reads the results and decides again","Model replies with no tool calls, so the loop ends"],why:"Model → tools → model … until no more tool calls.",s:"agents"},
{id:"q4b",type:"mc",q:"When does a plain create_agent loop stop?",o:["After exactly one tool call","When the model returns a response with no tool calls","After 10 iterations by default","When the user sends a stop message"],a:1,why:"The model decides it's done by answering without requesting tools.",s:"ctx"},
{id:"q4c",type:"mc",q:"Where is the agent's final answer?",o:["result[\"answer\"]","result[\"messages\"][0]","result[\"messages\"][-1]","agent.output"],a:2,why:"The last message in the returned state is the final AI message.",s:"agents"},
{id:"q4d",type:"mc",q:"Which create_agent parameter would you use to plug in guardrails and retries?",o:["system_prompt","middleware","state_schema","name"],a:1,why:"Middleware is the extensibility hook into each step of the loop.",s:"agents"}
]},
/* ------------------------------------------------------------ V */
{id:"r5",num:"V",p:1,x:370,y:1030,name:"The Archive Keep",topic:"Memory and structured output",
objective:"Make an agent remember a conversation, and make it return typed data.",
sections:[
{id:"r5a",title:"Short-term memory is a checkpointer plus a thread",body:`
<p>Give the agent a <code>checkpointer</code>, then call it with a <code>thread_id</code>. Calls with the same thread id continue one conversation. A new thread id starts fresh.</p>`,
code:`from langchain.agents import create_agent
from langgraph.checkpoint.memory import InMemorySaver

agent = create_agent(
    model="anthropic:claude-sonnet-5",
    tools=[get_user_info],
    checkpointer=InMemorySaver(),
)

thread_config = {"configurable": {"thread_id": "1"}}
agent.invoke({"messages": [{"role": "user", "content": "Hi! My name is Bob."}]}, thread_config)
agent.invoke({"messages": [{"role": "user", "content": "What's my name?"}]}, thread_config)  # remembers Bob`,lang:"py",cite:[{s:"stm",n:"InMemorySaver + thread_id"}]},
{id:"r5b",title:"Production checkpointers",body:`
<p><code>InMemorySaver</code> is fine in development, but everything is lost when the process restarts. In production use a database-backed saver. The docs list SQLite, PostgreSQL and Azure Cosmos DB.</p>`,
code:`# pip install -U langgraph-checkpoint-postgres "psycopg[binary]"
from langgraph.checkpoint.postgres import PostgresSaver

DB_URI = "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable"
with PostgresSaver.from_conn_string(DB_URI) as checkpointer:
    checkpointer.setup()
    agent = create_agent("anthropic:claude-sonnet-5", tools=[get_user_info], checkpointer=checkpointer)`,lang:"py",cite:[{s:"stm",n:"PostgresSaver"}]},
{id:"r5c",title:"Typed results from an agent",body:`
<p>Pass a schema as <code>response_format</code>. The validated object comes back under <code>result["structured_response"]</code>.</p>
<ul><li><b>ProviderStrategy</b> uses the provider's native structured output. It's picked automatically when you pass a schema and the model supports it.</li><li><b>ToolStrategy</b> works through tool calling, for models without native support.</li></ul>`,
code:`from pydantic import BaseModel, Field
from langchain.agents import create_agent

class ContactInfo(BaseModel):
    """Contact information for a person."""
    name: str = Field(description="The name of the person")
    email: str = Field(description="The email address of the person")
    phone: str = Field(description="The phone number of the person")

agent = create_agent(model="anthropic:claude-sonnet-5", response_format=ContactInfo)
result = agent.invoke({"messages": [{"role": "user",
    "content": "Extract contact info from: John Doe, john@example.com, (555) 123-4567"}]})
print(result["structured_response"])`,lang:"py",cite:[{s:"structured",n:"response_format, strategies"}]},
{id:"r5d",title:"Short-term vs long-term",body:`
<p>A checkpointer remembers within a thread. Remembering <em>across</em> threads (a user's preferences next week, lessons the agent learned) needs a store. Deep Agents makes this a filesystem path, which you'll meet in Realm XII.</p>
<div class="tbl"><table><thead><tr><th></th><th>Scope</th><th>Mechanism</th></tr></thead><tbody>
<tr><td>Short-term</td><td>One thread: history and scratch files</td><td>Checkpointer</td></tr>
<tr><td>Long-term</td><td>Across conversations</td><td>Store (e.g. Deep Agents' StoreBackend)</td></tr></tbody></table></div>`,
cite:[{s:"damem",n:"Short-term vs long-term memory"}]}
],
siege:[
{id:"q5a",type:"mc",q:"Two invoke() calls should be one conversation. What ties them together?",o:["Using the same system_prompt","The same thread_id in config[\"configurable\"] plus a checkpointer","Passing the previous result as a tool","Setting temperature=0"],a:1,why:"The checkpointer saves state per thread_id.",s:"stm"},
{id:"q5b",type:"mc",q:"With response_format=ContactInfo, where's the object?",o:["result[\"messages\"][-1].content","result[\"structured_response\"]","agent.schema","result[\"ContactInfo\"]"],a:1,why:"Validated output lands in structured_response.",s:"structured"},
{id:"q5c",type:"mc",q:"When does ToolStrategy make sense?",o:["When the model lacks native structured output but supports tool calling","Always. It's the default for every model","Only for streaming","Only with LangGraph"],a:0,why:"ProviderStrategy is preferred when the model supports it natively; ToolStrategy is the universal fallback.",s:"structured"},
{id:"q5d",type:"mc",q:"Your production agent uses InMemorySaver. What happens on a redeploy?",o:["Threads migrate automatically","Conversation state is lost, so use a database-backed checkpointer","Nothing, because memory lives in the model","LangSmith restores it"],a:1,why:"In-memory means process memory. Use Postgres, SQLite or similar in production.",s:"stm"}
]},
/* ------------------------------------------------------------ VI */
{id:"r6",num:"VI",p:1,x:240,y:1010,name:"The Library of Echoes",topic:"Retrieval and RAG",
objective:"Ground answers in your own documents, and choose the right RAG architecture.",
sections:[
{id:"r6a",title:"Five building blocks",body:`
<ol><li><b>Document loaders</b> ingest data from external sources (Google Drive, Slack, Notion…) as standard <code>Document</code> objects.</li><li><b>Text splitters</b> cut large documents into chunks that fit a context window and can be retrieved individually.</li><li><b>Embedding models</b> turn text into vectors, so similar meaning ends up close together.</li><li><b>Vector stores</b> store and search those embeddings.</li><li><b>Retrievers</b> return documents for an unstructured query.</li></ol>`,
cite:[{s:"retrieval",n:"Building blocks"}]},
{id:"r6b",title:"Three architectures",body:`
<div class="tbl"><table><thead><tr><th>Type</th><th>How it works</th><th>Best for</th></tr></thead><tbody>
<tr><td>2-step RAG</td><td>Retrieval always runs before generation</td><td>FAQs and documentation bots: predictable and simple</td></tr>
<tr><td>Agentic RAG</td><td>The LLM decides when and how to retrieve</td><td>Research assistants with several tools</td></tr>
<tr><td>Hybrid</td><td>Combines both and adds validation steps</td><td>Domain Q&amp;A that needs quality control</td></tr></tbody></table></div>`,
cite:[{s:"retrieval",n:"Architecture comparison"}]},
{id:"r6c",title:"Agentic RAG: retrieval is just a tool",body:`
<p>The docs' agentic example is a tool that fetches a URL. The agent decides when to call it. The second block wires the building blocks into a search tool the same way.</p>`,
code:`import requests
from langchain.tools import tool

@tool
def fetch_url(url: str) -> str:
    """Fetch text content from a URL"""
    response = requests.get(url, timeout=10.0)
    response.raise_for_status()
    return response.text`,lang:"py",
code2:`from langchain_text_splitters import RecursiveCharacterTextSplitter
from langchain_core.vectorstores import InMemoryVectorStore
from langchain_openai import OpenAIEmbeddings
from langchain.agents import create_agent
from langchain.tools import tool

splitter = RecursiveCharacterTextSplitter(chunk_size=1000, chunk_overlap=200)
chunks = splitter.split_documents(docs)          # docs from any document loader
store = InMemoryVectorStore(OpenAIEmbeddings(model="text-embedding-3-small"))
store.add_documents(chunks)

@tool
def search_handbook(query: str) -> str:
    """Search the employee handbook. Use for any policy question."""
    hits = store.similarity_search(query, k=4)
    return "\\n\\n".join(d.page_content for d in hits)

agent = create_agent("anthropic:claude-sonnet-5", tools=[search_handbook])`,sketch2:"Sketch: check imports for your embedding provider",
cite:[{s:"retrieval",n:"Agentic RAG fetch_url example"}]},
{id:"r6d",title:"Choosing",body:`
<p>The Granary (Realm XXVII) covers production loaders, embedding caches and vector stores. Use 2-step RAG when every question needs the same corpus and you want predictable cost and latency. Use agentic RAG when some questions need no retrieval, or several sources, or follow-up searches. Choose hybrid when wrong answers are expensive and you want a validation step between retrieval and answer.</p>`,
cite:[{s:"retrieval",n:"Trade-offs"}]}
],
siege:[
{id:"q6a",type:"mc",q:"An internal FAQ bot where every answer must come from one handbook. Best starting architecture?",o:["Agentic RAG with five tools","2-step RAG","A deep agent with subagents","No retrieval; rely on the model"],a:1,why:"Predictable, always-retrieve flows suit FAQs and documentation bots.",s:"retrieval"},
{id:"q6b",type:"mc",q:"What defines agentic RAG?",o:["It uses a vector database","The LLM decides when and how to retrieve","It always retrieves twice","It requires LangGraph"],a:1,why:"Retrieval becomes a tool the model chooses to call.",s:"retrieval"},
{id:"q6c",type:"mc",q:"Which component makes semantically similar text land near each other?",o:["Document loader","Text splitter","Embedding model","Retriever"],a:2,why:"Embeddings map text into a vector space.",s:"retrieval"},
{id:"q6d",type:"mc",q:"Why split documents?",o:["To fit context windows and make passages individually retrievable","To encrypt them","To remove duplicates","Splitters are only for PDFs"],a:0,why:"Chunks are small enough to embed and retrieve precisely.",s:"retrieval"}
]},
/* ------------------------------------------------------------ VII */
{id:"r7",num:"VII",p:2,x:110,y:940,name:"The Gatehouse",topic:"Middleware",
objective:"Intercept every step of the agent loop: before, around and after the model and tools.",
sections:[
{id:"r7a",title:"Why middleware",body:`
<blockquote>Middleware provides a way to more tightly control what happens inside the agent.</blockquote>
<p>Use it for tracking, transforming requests, retrying, and guardrails. You don't fork the loop. You attach behavior to points inside it.</p>`,
cite:[{s:"mw",n:"Overview"}]},
{id:"r7b",title:"The six hooks",body:`
<div class="tbl"><table><thead><tr><th>Hook</th><th>Style</th><th>Runs</th></tr></thead><tbody>
<tr><td><code>before_agent</code></td><td>node</td><td>Once per invocation, before anything</td></tr>
<tr><td><code>before_model</code></td><td>node</td><td>Before each model call</td></tr>
<tr><td><code>wrap_model_call</code></td><td>wrap</td><td>Around each model call; you call <code>handler(request)</code></td></tr>
<tr><td><code>after_model</code></td><td>node</td><td>After each model response</td></tr>
<tr><td><code>wrap_tool_call</code></td><td>wrap</td><td>Around each tool execution</td></tr>
<tr><td><code>after_agent</code></td><td>node</td><td>Once, after the agent completes</td></tr></tbody></table></div>
<p>Node hooks receive <code>(state, runtime)</code> and return a state update or <code>None</code>. To exit early, return <code>"jump_to"</code> with one of <code>"end"</code>, <code>"tools"</code> or <code>"model"</code>, and declare it with <code>can_jump_to</code>.</p>`,
cite:[{s:"mwcustom",n:"Hook reference and jump_to"}]},
{id:"r7c",title:"Write your own",body:`<p>Decorators for one-off hooks; a class when hooks share state.</p>`,
code:`from typing import Any, Callable
from langchain.agents.middleware import (
    before_model, wrap_model_call, AgentMiddleware, AgentState, ModelRequest, ModelResponse,
)
from langchain.messages import AIMessage
from langgraph.runtime import Runtime

@before_model(can_jump_to=["end"])
def check_message_limit(state: AgentState, runtime: Runtime) -> dict[str, Any] | None:
    if len(state["messages"]) >= 50:
        return {"messages": [AIMessage("Conversation limit reached.")], "jump_to": "end"}
    return None

@wrap_model_call
def retry_model(request: ModelRequest, handler: Callable[[ModelRequest], ModelResponse]) -> ModelResponse:
    for attempt in range(3):
        try:
            return handler(request)
        except Exception as e:
            if attempt == 2:
                raise
            print(f"Retry {attempt + 1}/3 after error: {e}")

class LoggingMiddleware(AgentMiddleware):
    def before_model(self, state: AgentState, runtime: Runtime) -> dict[str, Any] | None:
        print(f"About to call model with {len(state['messages'])} messages")
        return None`,lang:"py",cite:[{s:"mwcustom",n:"Decorator and class examples"}]},
{id:"r7d",title:"The built-in arsenal",body:`
<div class="tbl"><table><thead><tr><th>Middleware</th><th>Purpose</th></tr></thead><tbody>
<tr><td><code>SummarizationMiddleware</code></td><td>Summarize history at token limits (<code>trigger</code>, <code>keep</code>)</td></tr>
<tr><td><code>HumanInTheLoopMiddleware</code></td><td>Pause for approval of tool calls</td></tr>
<tr><td><code>ModelCallLimitMiddleware</code></td><td>Cap model calls per thread / per run</td></tr>
<tr><td><code>ToolCallLimitMiddleware</code></td><td>Cap tool calls, optionally per tool</td></tr>
<tr><td><code>ModelRetryMiddleware</code> / <code>ToolRetryMiddleware</code></td><td>Retry with exponential backoff</td></tr>
<tr><td><code>ModelFallbackMiddleware</code></td><td>Fall back to other models on failure</td></tr>
<tr><td><code>PIIMiddleware</code></td><td>Detect and handle personal data</td></tr>
<tr><td><code>LLMToolSelectorMiddleware</code></td><td>Let a model pick the relevant tools</td></tr>
<tr><td><code>ContextEditingMiddleware</code></td><td>Trim old tool outputs from context</td></tr>
<tr><td><code>TodoListMiddleware</code> · <code>FilesystemMiddleware</code> · <code>SubAgentMiddleware</code></td><td>Deep-agent building blocks</td></tr>
<tr><td><code>RubricMiddleware</code></td><td>LLM-as-judge self-evaluation (Realm XXXIX)</td></tr></tbody></table></div>`,
code:`from langchain.agents import create_agent
from langchain.agents.middleware import SummarizationMiddleware, ModelCallLimitMiddleware
from langgraph.checkpoint.memory import InMemorySaver

agent = create_agent(
    model="anthropic:claude-sonnet-5",
    tools=[...],
    checkpointer=InMemorySaver(),
    middleware=[
        SummarizationMiddleware(model="anthropic:claude-haiku-4-5",
                                trigger=("tokens", 4000), keep=("messages", 20)),
        ModelCallLimitMiddleware(thread_limit=10, run_limit=5, exit_behavior="end"),
    ],
)`,lang:"py",cite:[{s:"mwbuilt",n:"Built-in list and examples"}]}
],
siege:[
{id:"q7a",type:"mc",q:"You want to load a user profile exactly once at the start of every invocation. Which hook?",o:["before_model","before_agent","after_model","wrap_tool_call"],a:1,why:"before_agent runs once per invocation; before_model runs before every model call.",s:"mwcustom"},
{id:"q7b",type:"mc",q:"Which hook lets you retry a failed model call by calling handler(request) again?",o:["after_agent","before_model","wrap_model_call","after_model"],a:2,why:"Wrap-style hooks receive the handler, so they can call it zero, one or many times.",s:"mwcustom"},
{id:"q7c",type:"mc",q:"Which are valid jump_to targets?",o:["\"start\", \"middle\", \"end\"","\"end\", \"tools\", \"model\"","\"retry\", \"abort\"","Any node name"],a:1,why:"Declare them with can_jump_to.",s:"mwcustom"},
{id:"q7d",type:"mc",q:"An agent sometimes loops forever and burns budget. Which built-in sets a hard ceiling?",o:["PIIMiddleware","ModelCallLimitMiddleware","LLMToolSelectorMiddleware","ContextEditingMiddleware"],a:1,why:"It limits model calls (thread_limit, run_limit) with a chosen exit_behavior.",s:"mwbuilt"}
]},
/* ------------------------------------------------------------ VIII */
{id:"r8",num:"VIII",p:2,x:210,y:860,name:"The Council Chamber",topic:"Human-in-the-loop",
objective:"Pause an agent before risky actions and resume it with a human decision.",
sections:[
{id:"r8a",title:"Pause before the irreversible",body:`
<p><code>HumanInTheLoopMiddleware</code> takes an <code>interrupt_on</code> map keyed by tool name:</p>
<ul><li><code>True</code>: interrupt, with every decision allowed.</li><li><code>{"allowed_decisions": [...]}</code>: interrupt, with only those decisions allowed.</li><li><code>False</code>: never interrupt for this tool.</li></ul>`,
cite:[{s:"hitl",n:"interrupt_on"}]},
{id:"r8b",title:"Interrupt and resume",body:`<p>The first invoke stops at the risky tool call. The second resumes the <em>same thread</em> with your decision.</p>`,
code:`from langchain.agents import create_agent
from langchain.agents.middleware import HumanInTheLoopMiddleware
from langgraph.checkpoint.memory import InMemorySaver
from langgraph.types import Command

agent = create_agent(
    model="anthropic:claude-sonnet-5",
    tools=[write_file, execute_sql, read_data],
    middleware=[HumanInTheLoopMiddleware(interrupt_on={
        "write_file": True,
        "execute_sql": {"allowed_decisions": ["approve", "reject"]},
        "read_data": False,
    })],
    checkpointer=InMemorySaver(),
)

config = {"configurable": {"thread_id": "1"}}
agent.invoke({"messages": [{"role": "user", "content": "Delete old records"}]}, config=config, version="v2")

agent.invoke(Command(resume={"decisions": [{"type": "approve"}]}), config=config, version="v2")`,lang:"py",cite:[{s:"hitl",n:"Full example"}]},
{id:"r8c",title:"Four decisions",body:`
<div class="tbl"><table><thead><tr><th>Decision</th><th>Effect</th></tr></thead><tbody>
<tr><td><code>approve</code></td><td>Run the tool call unchanged</td></tr>
<tr><td><code>edit</code></td><td>Run it with modified arguments</td></tr>
<tr><td><code>reject</code></td><td>Deny it, optionally with feedback to the model</td></tr>
<tr><td><code>respond</code></td><td>Answer in place of running the tool</td></tr></tbody></table></div>
<p>A pause can last minutes or days, so the paused state has to be saved somewhere. That's why the example uses a checkpointer and resumes with the same <code>thread_id</code>. To pause inside any node, not only on tool calls, see <code>interrupt()</code> in Realm XXII.</p>`,
cite:[{s:"hitl",n:"Decision types"}]}
],
siege:[
{id:"q8a",type:"mc",q:"Why does human-in-the-loop need a checkpointer?",o:["To speed up the model","To persist the paused run so it can resume on the same thread","To log approvals to Slack","It doesn't"],a:1,why:"Resuming means loading the saved state for that thread_id.",s:"hitl"},
{id:"q8b",type:"mc",q:"The reviewer wants the SQL to run, but with a LIMIT added. Which decision?",o:["approve","reject","edit","respond"],a:2,why:"edit changes the arguments before execution.",s:"hitl"},
{id:"q8c",type:"mc",q:"How do you continue a paused agent?",o:["Call agent.invoke(Command(resume={...})) with the same config","Start a new thread with the same message","Call agent.resume()","Re-create the agent"],a:0,why:"Command(resume=...) on the same thread.",s:"hitl"},
{id:"q8d",type:"mc",q:"\"read_data\": False in interrupt_on means…",o:["The tool is disabled","The tool never triggers an approval pause","Only reject is allowed","The tool runs twice"],a:1,why:"False = no interrupt for that tool.",s:"hitl"}
]},
/* ------------------------------------------------------------ IX */
{id:"r9",num:"IX",p:2,x:340,y:900,name:"The Engineer's Yard",topic:"LangGraph",
objective:"Build explicit graphs for workflows that don't fit a single loop.",
sections:[
{id:"r9a",title:"Graphs instead of a loop",body:`
<ul><li><b>StateGraph</b>: the workflow. Computation flows through connected nodes over shared state.</li><li><b>Nodes</b>: functions that read state and return updates.</li><li><b>Edges</b>: fixed transitions. <code>START</code> and <code>END</code> mark entry and exit.</li><li><b>Conditional edges</b>: route dynamically based on state.</li><li><b>Reducers</b>: how updates merge. <code>add_messages</code> appends to the message list instead of overwriting it.</li><li><b>compile()</b>: turns the definition into an executable runtime.</li></ul>`,
cite:[{s:"lg",n:"Core concepts"}]},
{id:"r9b",title:"Hello, graph",body:"",
code:`from langgraph.graph import StateGraph, MessagesState, START, END

def mock_llm(state: MessagesState):
    return {"messages": [{"role": "ai", "content": "hello world"}]}

graph = StateGraph(MessagesState)
graph.add_node(mock_llm)
graph.add_edge(START, "mock_llm")
graph.add_edge("mock_llm", END)
graph = graph.compile()

graph.invoke({"messages": [{"role": "user", "content": "hi!"}]})`,lang:"py",cite:[{s:"lg",n:"Hello world"}]},
{id:"r9c",title:"Mix deterministic and agentic steps",body:`
<p>A deterministic router sends each request to a specialist agent. An agent built with <code>create_agent</code> is itself a compiled graph, so it can be a node.</p>`,
code:`from typing import Literal
from langgraph.graph import StateGraph, MessagesState, START, END

def route(state: MessagesState) -> Literal["refunds", "general"]:
    text = state["messages"][-1].content.lower()
    return "refunds" if "refund" in text else "general"

g = StateGraph(MessagesState)
g.add_node("refunds", refunds_agent)     # create_agent(...) results
g.add_node("general", general_agent)
g.add_conditional_edges(START, route)
g.add_edge("refunds", END)
g.add_edge("general", END)
app = g.compile()`,lang:"py",sketch:"Sketch: illustrative routing pattern",cite:[{s:"lg",n:"Conditional edges"},{s:"stack",n:"Use LangGraph to mix deterministic and agentic steps"}]},
{id:"r9d",title:"What the runtime gives you",body:`
<p>Every layer above inherits these: a <b>checkpointer</b> for persistence and resume, <b>interrupts</b> to pause for human review or editing, and <b>durable execution</b> so long runs survive failures. The Foundry (Realms XIX–XXV) covers each of them in depth.</p>`,
cite:[{s:"lg",n:"Persistence, interrupts, durable execution"}]}
],
siege:[
{id:"q9a",type:"mc",q:"What does graph.compile() do?",o:["Exports Python to C","Turns the graph definition into an executable runtime","Uploads it to LangSmith","Validates the API key"],a:1,why:"You define nodes and edges, then compile to run.",s:"lg"},
{id:"q9b",type:"mc",q:"What does the add_messages reducer do?",o:["Deletes old messages","Appends new messages to the list instead of overwriting it","Summarizes messages","Sends messages to Slack"],a:1,why:"Reducers define how node updates merge into state.",s:"lg"},
{id:"q9c",type:"mc",q:"Which feature lets a node send work down different paths depending on state?",o:["add_edge","Conditional edges","Checkpointer","MessagesState"],a:1,why:"Conditional edges route dynamically.",s:"lg"},
{id:"q9d",type:"mc",q:"Which statement is true?",o:["LangGraph replaces create_agent","An agent from create_agent can be a node in a LangGraph graph","LangGraph can't do human-in-the-loop","LangGraph is only for RAG"],a:1,why:"The layers nest: agents are graphs, and graphs compose.",s:"stack"}
]},
/* ------------------------------------------------------------ X */
{id:"r10",num:"X",p:2,x:470,y:950,name:"The Cartographer's Tent",topic:"Context engineering",
objective:"Diagnose agent failures as context failures, and know which lever changes which context.",
sections:[
{id:"r10a",title:"Why agents fail",body:`
<p>An agent fails for one of two reasons: the model isn't capable enough, or it wasn't given the right context.</p>
<blockquote>More often than not - it's actually the second reason that causes agents to not be reliable.</blockquote>`,
cite:[{s:"ctx",n:"Why agents fail"}]},
{id:"r10b",title:"Three kinds of context",body:`
<div class="tbl"><table><thead><tr><th>Context</th><th>Controls</th><th>Lifetime</th></tr></thead><tbody>
<tr><td>Model context</td><td>What goes into a model call: instructions, history, tools, response format</td><td>Transient (only this call)</td></tr>
<tr><td>Tool context</td><td>What tools can read and write: state, store, runtime context</td><td>Persistent</td></tr>
<tr><td>Life-cycle context</td><td>What happens between model and tool calls: summarization, guardrails, logging</td><td>Persistent</td></tr></tbody></table></div>
<p><b>Transient</b> is what the LLM sees for one call. <b>Persistent</b> is what gets saved in state across turns.</p>`,
cite:[{s:"ctx",n:"Model / tool / life-cycle context"}]},
{id:"r10c",title:"Shape the model context per call",body:`<p><code>@dynamic_prompt</code> rebuilds the system prompt on every model call from runtime context, without touching saved state.</p>`,
code:`from dataclasses import dataclass
from langchain.agents import create_agent
from langchain.agents.middleware import dynamic_prompt, ModelRequest

@dataclass
class Context:
    user_role: str = "user"

@dynamic_prompt
def by_role(request: ModelRequest) -> str:
    base = "You are a helpful assistant."
    if request.runtime.context.user_role == "expert":
        return base + " Give full technical detail."
    return base + " Explain simply, no jargon."

agent = create_agent("anthropic:claude-sonnet-5", tools=[...],
                     middleware=[by_role], context_schema=Context)
agent.invoke({"messages": [...]}, context=Context(user_role="expert"))`,lang:"py",sketch:"Sketch: dynamic_prompt pattern",cite:[{s:"mwcustom",n:"@dynamic_prompt decorator"},{s:"ctx",n:"Model context"}]},
{id:"r10d",title:"Map your levers",body:`
<ul><li><b>Model context</b>: <code>system_prompt</code>, <code>@dynamic_prompt</code>, <code>LLMToolSelectorMiddleware</code>, <code>response_format</code>.</li><li><b>Tool context</b>: tools that read or write state and the store, and Deep Agents' filesystem.</li><li><b>Life-cycle context</b>: <code>SummarizationMiddleware</code>, <code>ContextEditingMiddleware</code>, guardrails, logging.</li></ul>
<p>Deep Agents, in the next province, is mostly a bundle of these context practices that are already decided for you.</p>`,
cite:[{s:"ctx",n:"Context types"},{s:"stack",n:"Harness bundles context-management practices"}]}
],
siege:[
{id:"q10a",type:"mc",q:"According to the docs, what most often makes agents unreliable?",o:["The model is too small","The right context wasn't passed to the model","Too many tools","Python version"],a:1,why:"Usually it's context, not capability.",s:"ctx"},
{id:"q10b",type:"mc",q:"SummarizationMiddleware works on which context?",o:["Model context","Tool context","Life-cycle context","None"],a:2,why:"Summarization happens between calls and persists.",s:"ctx"},
{id:"q10c",type:"mc",q:"A @dynamic_prompt change is…",o:["Transient: it affects only that model call","Persistent across all threads","Written to the store","Applied to tools only"],a:0,why:"Model-context edits don't change saved state.",s:"ctx"},
{id:"q10d",type:"mc",q:"LLMToolSelectorMiddleware narrows which tools the model sees. Which context is that?",o:["Model context","Life-cycle context","Tool context","Runtime config only"],a:0,why:"Tools offered to a call are part of the model context.",s:"ctx"}
]},
/* ------------------------------------------------------------ XI */
{id:"r11",num:"XI",p:3,x:580,y:1030,name:"The Deep Gate",topic:"Deep Agents: the harness",
objective:"Understand why a plain loop runs out of steam, and what a deep agent adds.",
sections:[
{id:"r11a",title:"Why shallow agents run aground",body:`
<p>Harrison Chase's July 2025 post starts from an observation. A simple tool-calling loop struggles to plan and act over longer, more complex tasks. Yet Claude Code and Deep Research do this well. Their architecture adds a few things around the same loop.</p>`,
cite:[{s:"dablog",n:"Shallow vs deep agents"}]},
{id:"r11b",title:"Four components",body:`
<ol>
<li><b>A detailed system prompt</b>, with long instructions on how to use each tool, plus examples.</li>
<li><b>A planning tool</b>, which is a todo list. <blockquote>It's basically a no-op. It's just context engineering strategy to keep the agent on track.</blockquote></li>
<li><b>Subagents</b>, to split up tasks and keep each context clean.</li>
<li><b>A file system</b>, a shared workspace for work products and notes. <blockquote>…not just to complete its task but also to jot down notes.</blockquote></li>
</ol>`,
cite:[{s:"dablog",n:"The four components, quoted"}]},
{id:"r11c",title:"Summon a deep agent",body:`<p>The signature mirrors <code>create_agent</code>. The difference is everything that comes preinstalled.</p>`,
code:`# pip install deepagents
from deepagents import create_deep_agent

def get_weather(city: str) -> str:
    return f"It's always sunny in {city}!"

agent = create_deep_agent(
    model="anthropic:claude-sonnet-5",
    tools=[get_weather],
    system_prompt="You are a helpful assistant",
)

agent.invoke({"messages": [{"role": "user", "content": "what is the weather in sf"}]})`,lang:"py",cite:[{s:"daover",n:"Quickstart"}]},
{id:"r11d",title:"What's in the box",body:`
<div class="tbl"><table><thead><tr><th>Pillar</th><th>Includes</th></tr></thead><tbody>
<tr><td>Execution environment</td><td>Tools, virtual filesystem, sandbox, code execution</td></tr>
<tr><td>Context management</td><td>Skills, <code>AGENTS.md</code> memory, summarization, prompt caching</td></tr>
<tr><td>Delegation</td><td><code>write_todos</code> planning, <code>task</code> for subagents</td></tr>
<tr><td>Steering</td><td>Human-in-the-loop interrupts (<code>interrupt_on</code>), filesystem <code>permissions</code></td></tr>
<tr><td>Streaming</td><td>Typed events for messages, tools and delegated tasks</td></tr></tbody></table></div>
<p>Built-in filesystem tools: <code>ls</code>, <code>read_file</code>, <code>write_file</code>, <code>edit_file</code>, <code>delete</code>, <code>glob</code>, <code>grep</code>, plus <code>execute</code> for shell commands, which is only available with a sandbox or <code>LocalShellBackend</code>.</p>`,
cite:[{s:"daover",n:"Pillars and parameters"},{s:"daback",n:"Filesystem tools"}]}
],
siege:[
{id:"q11a",type:"mc",q:"What does the todo-list planning tool actually do, according to Harrison Chase?",o:["Schedules jobs on a cron","Nothing functionally. It's a context-engineering strategy to keep the agent on track","Calls a planning model","Writes to a database"],a:1,why:"\"It's basically a no-op.\"",s:"dablog"},
{id:"q11b",type:"mc",q:"Which built-in tool delegates work to a subagent?",o:["write_todos","task","grep","execute"],a:1,why:"The main agent calls task() to delegate.",s:"dasub"},
{id:"q11c",type:"mc",q:"When is the execute tool available?",o:["Always","Only with a sandbox or LocalShellBackend","Only with StoreBackend","Only in LangSmith"],a:1,why:"Shell execution needs a backend that can run commands.",s:"daback"},
{id:"q11d",type:"mc",q:"Which is NOT one of the four deep-agent components in the original post?",o:["Detailed system prompt","Planning tool","Vector database","File system"],a:2,why:"Prompt, planning, subagents, file system.",s:"dablog"}
]},
/* ------------------------------------------------------------ XII */
{id:"r12",num:"XII",p:3,x:700,y:1110,name:"The Hall of Many Hands",topic:"Subagents, backends and memory",
objective:"Delegate without polluting context, and decide where every file lives.",
sections:[
{id:"r12a",title:"Context quarantine",body:`
<blockquote>Subagents isolate detailed work—the main agent receives only the final result, not the dozens of tool calls that produced it.</blockquote>
<p><code>task()</code> is synchronous: the coordinator waits for the subagent to finish. For long parallel workstreams there are async subagents. Unless you supply your own, Deep Agents adds a <code>general-purpose</code> subagent with filesystem tools that uses the main model.</p>`,
cite:[{s:"dasub",n:"Why subagents; task(); general-purpose"}]},
{id:"r12b",title:"Define a specialist",body:`
<p>Required: <code>name</code>, <code>description</code> (the coordinator reads it to decide when to delegate) and <code>system_prompt</code>. Optional: <code>tools</code> (replaces inherited tools), <code>model</code>, <code>middleware</code>, <code>interrupt_on</code>, <code>skills</code>, <code>response_format</code>, <code>permissions</code>, and <code>mode</code>, which is <code>"isolated"</code> by default (sees only the delegated task) or <code>"fork"</code> (inherits the parent conversation).</p>`,
code:`from deepagents import create_deep_agent

researcher = {
    "name": "researcher",
    "description": "Researches ONE narrow question in depth and returns a short, cited summary.",
    "system_prompt": "You are a careful researcher. Reply in under 300 words and list your sources.",
    "tools": [internet_search],
    "model": "anthropic:claude-haiku-4-5",
}

agent = create_deep_agent(
    model="anthropic:claude-sonnet-5",
    tools=[internet_search],
    system_prompt="You coordinate research. Plan with write_todos, delegate each sub-question with task().",
    subagents=[researcher],
)`,lang:"py",sketch:"Sketch: built from the subagent schema",cite:[{s:"dasub",n:"SubAgent dict keys"}]},
{id:"r12c",title:"Backends: where files live",body:`
<div class="tbl"><table><thead><tr><th>Backend</th><th>Storage</th><th>Scope</th></tr></thead><tbody>
<tr><td><code>StateBackend</code> (default)</td><td>Agent state, checkpointed</td><td>One thread</td></tr>
<tr><td><code>StoreBackend</code></td><td>LangGraph <code>BaseStore</code></td><td>Across threads (long-term)</td></tr>
<tr><td><code>FilesystemBackend</code></td><td>Real files under <code>root_dir</code>; use <code>virtual_mode=True</code></td><td>Disk</td></tr>
<tr><td><code>CompositeBackend</code></td><td>Routes path prefixes to backends</td><td>Mixed</td></tr></tbody></table></div>`,
code:`from deepagents import create_deep_agent
from deepagents.backends import CompositeBackend, StateBackend, StoreBackend
from langgraph.store.memory import InMemoryStore

agent = create_deep_agent(
    model="anthropic:claude-sonnet-5",
    backend=CompositeBackend(
        default=StateBackend(),                                   # /workspace/plan.md → this thread
        routes={"/memories/": StoreBackend(namespace=lambda rt: ("memories",))},  # survives threads
    ),
    store=InMemoryStore(),
)`,lang:"py",cite:[{s:"daback",n:"Backends and routing"}]},
{id:"r12d",title:"Memory and skills",body:`
<p><b>Memory</b> is files. Pass paths with <code>memory=</code> (for example <code>/memories/AGENTS.md</code>). The agent can load them into the system prompt at startup or read them on demand, and route them to a store so they persist.</p>
<p><b>Skills</b> live in <code>SKILL.md</code> files with a <code>name</code> and <code>description</code>. Only descriptions load at startup. The full file is read when a task matches. That progressive disclosure keeps context small until a skill is actually needed.</p>`,
code:`agent = create_deep_agent(
    model="anthropic:claude-sonnet-5",
    memory=["/memories/AGENTS.md"],
    skills=["/skills/"],
    backend=CompositeBackend(default=StateBackend(),
                             routes={"/memories/": StoreBackend(namespace=lambda rt: ("memories",))}),
    store=InMemoryStore(),
)`,lang:"py",cite:[{s:"damem",n:"memory=, skills, progressive disclosure"}]}
],
siege:[
{id:"q12a",type:"mc",q:"A subagent reads 40 web pages. What does the coordinator receive?",o:["All 40 pages","Every tool call transcript","Only the subagent's final result","Nothing until the user asks"],a:2,why:"That isolation is what subagents are for.",s:"dasub"},
{id:"q12b",type:"mc",q:"Which backend is the default?",o:["StoreBackend","FilesystemBackend","StateBackend","CompositeBackend"],a:2,why:"Thread-scoped files in agent state.",s:"daback"},
{id:"q12c",type:"mc",q:"Routing \"/memories/\" to StoreBackend means files there…",o:["Vanish after each message","Persist across threads","Are written to your laptop's disk","Are read-only"],a:1,why:"StoreBackend is durable, cross-thread storage.",s:"daback"},
{id:"q12d",type:"mc",q:"How are skills loaded?",o:["All SKILL.md files are pasted into the prompt at startup","Only descriptions at startup; the full file when a task matches","Only by a subagent","Never; they're documentation"],a:1,why:"Progressive disclosure keeps context lean.",s:"damem"},
{id:"q12e",type:"mc",q:"Which subagent mode lets the subagent see the parent conversation?",o:["\"isolated\"","\"fork\"","\"shared\"","\"general-purpose\""],a:1,why:"isolated (default) sees only the task; fork inherits the conversation.",s:"dasub"}
]},
/* ------------------------------------------------------------ OBSERVATORY: TRACING */
{id:"r18",num:"XIII",p:4,x:820,y:1160,name:"The Lookout Spire",topic:"Tracing and observability",
objective:"See every step of every run, whether it's LangChain code or not.",
sections:[
{id:"r18a",title:"Traces, runs and projects",body:`
<blockquote>A complete record of every step that ran during a request, from the inputs passed in to the final output returned.</blockquote>
<p>That's a <b>trace</b>. Each step inside it (a model call, a tool call, a retriever, one of your functions) is a <b>run</b>, nested under the step that called it. Traces are grouped where you tell LangSmith to put them: a project (<code>LANGSMITH_PROJECT</code>), or in newer workspaces an agent and environment.</p>`,
code:`export LANGSMITH_TRACING=true
export LANGSMITH_API_KEY="<your-langsmith-api-key>"

# Project-based workspaces:
export LANGSMITH_PROJECT="conquest-dev"

# Agent-based workspaces use these instead:
# export LANGSMITH_AGENT_ID="<your-agent-id>"
# export LANGSMITH_AGENT_ENVIRONMENT="production"`,lang:"sh",
cite:[{s:"obs",n:"Trace definition and env vars"}]},
{id:"r18b",title:"LangChain code traces itself",body:`
<p>With those variables set, everything from earlier realms gets traced without code changes: <code>create_agent</code>, LangGraph graphs and deep agents. Each model call, tool call, middleware step and subagent shows up as a nested run.</p>
<p>Use one project per environment (dev, staging, prod) so experiments don't mix with real traffic.</p>`,
cite:[{s:"obs",n:"Tracing setup"},{s:"evals",n:"LANGSMITH_TRACING"}]},
{id:"r18c",title:"Trace anything else",body:`
<p>Code outside LangChain needs one of two things. A provider <b>wrapper</b> logs every SDK call. The <b>@traceable</b> decorator turns any function into a run, and nested calls become child runs.</p>`,
code:`from openai import OpenAI
from langsmith import traceable
from langsmith.wrappers import wrap_openai

client = wrap_openai(OpenAI())  # logs every call automatically

@traceable(run_type="tool")
def get_context(question: str) -> str:
    return "Retrieved context here"

@traceable
def assistant(question: str) -> str:
    context = get_context(question)      # appears as a child run
    response = client.chat.completions.create(
        model="gpt-5.5",
        messages=[{"role": "user", "content": f"{context}\\n\\n{question}"}],
    )
    return response.choices[0].message.content`,lang:"py",
cite:[{s:"obs",n:"wrap_openai and @traceable"}]},
{id:"r18d",title:"Read a trace like a field report",body:`
<p>When an agent misbehaves, open the trace and check these in order:</p>
<ol><li><b>What did the model actually see?</b> The full prompt, including the system prompt, tool schemas and any summarized history.</li><li><b>Which tools did it call, and with what arguments?</b></li><li><b>What came back?</b> Huge tool outputs crowd out everything else.</li><li><b>Where did the time and tokens go?</b></li><li><b>Where did it first go wrong?</b> Fix the earliest mistake, not the last symptom.</li></ol>
<p>Most failures turn out to be context failures (Realm X), and the trace is the only place you can see the exact context. Traces are also the raw material for evals and for the hill-climbing loop.</p>`,
cite:[{s:"ctx",n:"Wrong context is the usual failure"},{s:"mining",n:"Traces as the currency of improvement"}]}
],
siege:[
{id:"q18a",type:"mc",q:"What is a trace in LangSmith?",o:["A log line","A complete record of every step that ran during a request","A dataset row","A deployment revision"],a:1,why:"Inputs → every nested step → final output.",s:"obs"},
{id:"q18b",type:"mc",q:"Your create_agent app has LANGSMITH_TRACING=true and an API key set. What else do you need to trace it?",o:["Wrap every tool in @traceable","Nothing; LangChain and LangGraph runs are traced automatically","A LangSmith deployment","A callback handler per model"],a:1,why:"The env vars are enough for LangChain code.",s:"obs"},
{id:"q18c",type:"mc",q:"How do you trace a plain Python helper that isn't LangChain code?",o:["@tool","@traceable","@before_model","You can't"],a:1,why:"@traceable records any function as a run.",s:"obs"},
{id:"q18d",type:"mc",q:"get_context is decorated @traceable and called inside assistant(), also @traceable. How does it appear?",o:["As a separate, unrelated trace","As a child run nested inside the assistant trace","It doesn't appear","As feedback"],a:1,why:"Nesting follows the call stack.",s:"obs"}
]},
/* ------------------------------------------------------------ OBSERVATORY: DATASETS */
{id:"r19",num:"XIV",p:4,x:950,y:1130,name:"The Assay Hall",topic:"Datasets and offline evals",
objective:"Turn expected behavior into a dataset, then score every version of your agent against it.",
sections:[
{id:"r19a",title:"The vocabulary",body:`
<div class="tbl"><table><thead><tr><th>Term</th><th>Meaning</th></tr></thead><tbody>
<tr><td>Dataset</td><td>"A collection of examples used for evaluating an application."</td></tr>
<tr><td>Example</td><td>Inputs (a dict passed to your app) plus optional reference outputs</td></tr>
<tr><td>Experiment</td><td>"The results of evaluating a specific application version on a dataset": outputs, scores and traces for every example</td></tr>
<tr><td>Evaluator</td><td>Scores performance; used for both offline and online evaluation</td></tr>
<tr><td>Feedback</td><td>What evaluators return: a <code>key</code> (metric name) and a <code>score</code> or <code>value</code></td></tr>
<tr><td>Splits</td><td>"Named subsets of a dataset," e.g. by category or rollout stage</td></tr></tbody></table></div>`,
cite:[{s:"evals",n:"Definitions"}]},
{id:"r19b",title:"Build a dataset",body:`<p>Start small. A couple of dozen well-chosen examples that cover the behaviors you care about are worth more than thousands of random ones.</p>`,
code:`# pip install -U langsmith openevals
from langsmith import Client

client = Client()

dataset = client.create_dataset(
    dataset_name="Sample dataset",
    description="A sample dataset in LangSmith.",
)

examples = [
    {
        "inputs": {"question": "Which country is Mount Kilimanjaro located in?"},
        "outputs": {"answer": "Mount Kilimanjaro is located in Tanzania."},
    },
    {
        "inputs": {"question": "What is Earth's lowest point?"},
        "outputs": {"answer": "Earth's lowest point is The Dead Sea."},
    },
]

client.create_examples(dataset_id=dataset.id, examples=examples)`,lang:"py",
cite:[{s:"evalqs",n:"Dataset creation"},{s:"better",n:"Quality over quantity"}]},
{id:"r19c",title:"Write a code evaluator",body:`
<p>An evaluator is a function that receives <code>inputs</code>, <code>outputs</code> and <code>reference_outputs</code>. Return a bool, or a dict with <code>key</code> and <code>score</code> when you want to name the metric. Use code evaluators for anything you can check deterministically: exact labels, JSON validity, length, required fields.</p>`,
code:`def correct(inputs: dict, outputs: dict, reference_outputs: dict) -> bool:
    return outputs["class"] == reference_outputs["label"]

def concise(inputs: dict, outputs: dict, reference_outputs: dict) -> dict:
    return {"key": "concise", "score": len(outputs["answer"]) <= 400}`,lang:"py",
cite:[{s:"evalapp",n:"Evaluator signature and return types"},{s:"evals",n:"Feedback key/score"}]},
{id:"r19d",title:"Run an experiment on your agent",body:`
<p>The <b>target</b> adapts your app to the dataset: it takes an example's inputs and returns outputs. <code>client.evaluate</code> runs the target over every example, scores each one and records an experiment. Change the prompt, run again, and compare the two experiments side by side.</p>
<p>The docs list four offline uses: <b>benchmarking</b>, <b>regression testing</b>, <b>unit testing</b> and <b>backtesting</b>.</p>`,
code:`from langsmith import Client

client = Client()

def target(inputs: dict) -> dict:
    result = agent.invoke({"messages": [{"role": "user", "content": inputs["question"]}]})
    return {"answer": result["messages"][-1].content}

results = client.evaluate(
    target,
    data="Sample dataset",
    evaluators=[concise],
    experiment_prefix="agent-v1",
    max_concurrency=2,
)`,lang:"py",sketch:"Sketch: evaluate() pattern wrapping an agent",
cite:[{s:"evalqs",n:"client.evaluate"},{s:"evals",n:"Offline use cases"}]}
],

{id:"r20",num:"XV",p:4,x:1080,y:1070,name:"The Judges' Bench",topic:"LLM-as-judge and agent evals",
objective:"Grade answers that code can't check, and grade the agent's path as well as its answer.",
sections:[
{id:"r20a",title:"When code can't judge",body:`
<p>"Is this answer correct?" or "is this summary faithful?" can't be checked with string matching. An <b>LLM-as-judge</b> evaluator uses a model to score against criteria.</p>
<ul><li><b>Reference-free</b> judges grade against criteria alone. They work offline <em>and</em> online, since production has no answer key.</li><li><b>Reference-based</b> judges compare against an expected answer, so they need a dataset.</li></ul>
<p>In the LangSmith UI, feedback can be boolean, categorical, or a continuous score in a range.</p>`,
cite:[{s:"evals",n:"Reference-free vs reference-based"},{s:"judge",n:"Feedback types"}]},
{id:"r20b",title:"A judge from openevals",body:`<p><code>openevals</code> ships ready-made judge prompts. This is the evaluation quickstart's correctness judge.</p>`,
code:`from openevals.llm import create_llm_as_judge
from openevals.prompts import CORRECTNESS_PROMPT

def correctness_evaluator(inputs: dict, outputs: dict, reference_outputs: dict):
    evaluator = create_llm_as_judge(
        prompt=CORRECTNESS_PROMPT,
        model="openai:o3-mini",
        feedback_key="correctness",
    )
    return evaluator(
        inputs=inputs,
        outputs=outputs,
        reference_outputs=reference_outputs,
    )

client.evaluate(target, data="Sample dataset",
                evaluators=[correctness_evaluator],
                experiment_prefix="first-eval-in-langsmith", max_concurrency=2)`,lang:"py",
cite:[{s:"evalqs",n:"create_llm_as_judge + CORRECTNESS_PROMPT"}]},
{id:"r20c",title:"Judge the path as well as the answer",body:`
<div class="tbl"><table><thead><tr><th>Agent eval</th><th>Asks</th></tr></thead><tbody>
<tr><td>Final response</td><td>Is the end answer right? (often an LLM-as-judge against ground truth)</td></tr>
<tr><td>Trajectory</td><td>Did it take the expected steps? Partial credit for each expected step it took</td></tr>
<tr><td>Single step</td><td>Does one component work on its own, e.g. does the router pick the right subagent?</td></tr></tbody></table></div>
<p>A trajectory evaluator from the docs scores the fraction of expected steps taken, in order:</p>`,
code:`def trajectory_subsequence(outputs: dict, reference_outputs: dict) -> float:
    """Check how many of the desired steps the agent took."""
    if len(reference_outputs['trajectory']) > len(outputs['trajectory']):
        return False

    i = j = 0
    while i < len(reference_outputs['trajectory']) and j < len(outputs['trajectory']):
        if reference_outputs['trajectory'][i] == outputs['trajectory'][j]:
            i += 1
        j += 1

    return i / len(reference_outputs['trajectory'])`,lang:"py",
code2:`def target(inputs: dict) -> dict:
    result = agent.invoke({"messages": [{"role": "user", "content": inputs["question"]}]})
    trajectory = [tc["name"]
                  for m in result["messages"]
                  for tc in (getattr(m, "tool_calls", None) or [])]
    return {"answer": result["messages"][-1].content, "trajectory": trajectory}`,sketch2:"Sketch: pulling a tool trajectory from an agent run",
cite:[{s:"agenteval",n:"Final / trajectory / single-step, trajectory code"}]},
{id:"r20d",title:"Pairwise and human review",body:`
<p><b>Pairwise</b> evaluators compare two versions' outputs on the same input, using heuristics, an LLM with a pairwise prompt, or human reviewers. They're useful when "which is better?" is easier to answer than "how good is this?".</p>
<p><b>Annotation queues</b> collect structured human feedback on runs, with rubrics and team review. Human labels calibrate your LLM judges.</p>
<p>The idea also appears at runtime. <code>RubricMiddleware</code> (Realm XXXIX) puts a judge <em>inside</em> the run to drive revisions. Offline judges score finished experiments to compare versions.</p>`,
cite:[{s:"evals",n:"Pairwise, annotation queues"},{s:"rubric",n:"Runtime grader"}]}
],

{id:"q20c",type:"mc",q:"trajectory_subsequence returns 0.5. What does that mean?",o:["Half the answer was correct","The agent took half of the expected steps, in order","The judge was unsure","It ran twice"],a:1,why:"It counts matched expected steps ÷ expected steps.",s:"agenteval"},
{id:"q20d",type:"mc",q:"You have two prompt versions and want to know which answers better on the same inputs. Which evaluator style fits?",o:["Pairwise","Exact match","Trajectory","Single step"],a:0,why:"Pairwise compares two versions side by side.",s:"evals"},
