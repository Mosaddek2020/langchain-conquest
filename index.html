{id:"r21",num:"XVI",p:4,x:1000,y:990,name:"The Night Watch",topic:"Online evals and monitoring",
objective:"Score production traffic continuously and feed what fails back into your datasets.",
sections:[
{id:"r21a",title:"Production has no answer key",body:`
<blockquote>Online evaluations provide real-time feedback on your production traces. This is useful to monitor the performance of your application continuously.</blockquote>
<div class="tbl"><table><thead><tr><th></th><th>Offline</th><th>Online</th></tr></thead><tbody>
<tr><td>Runs on</td><td>Datasets with reference outputs</td><td>Production runs and threads, no references</td></tr>
<tr><td>Used for</td><td>Pre-deployment testing: benchmarks, regressions, unit tests</td><td>Monitoring and anomaly detection</td></tr>
<tr><td>Evaluators</td><td>Code, LLM-as-judge (either kind), pairwise, human</td><td>Reference-free: code checks and LLM-as-judge</td></tr></tbody></table></div>`,
cite:[{s:"online",n:"Online evaluations"},{s:"evals",n:"Offline vs online"}]},
{id:"r21b",title:"Configure a rule",body:`
<p>Online evaluators are set up in the LangSmith UI as rules:</p>
<ul><li><b>Filters</b> pick which runs qualify: user feedback, tool calls, metadata, or other evaluators' scores.</li><li><b>Sampling rate</b> sets what percentage of the filtered runs gets evaluated, which controls cost.</li><li><b>Backfill</b> optionally applies the rule to past runs from a date you choose.</li><li><b>Spend limits</b> cap each evaluator's weekly LLM cost.</li></ul>`,
cite:[{s:"online",n:"Filters, sampling, backfill, spend limits"}]},
{id:"r21c",title:"Judge whole conversations",body:`
<p>Some failures only show across turns: the agent forgets a constraint, loops, or frustrates the user. <b>Thread-level</b> evaluators grade the entire conversation history. LangSmith finds matching threads and applies the rule once a thread goes idle.</p>`,
cite:[{s:"online",n:"Multi-turn thread evaluation"}]},
{id:"r21d",title:"Close the loop",body:`
<ol><li>An online evaluator flags a bad production run.</li><li>Inspect its trace (Realm XIII) and find the earliest mistake.</li><li>Add the input to a dataset as a new example with a correct reference, or route it to an annotation queue for a human label.</li><li>Fix the harness, and run the offline experiment so the fix holds and nothing else regresses.</li></ol>
<p>This is the first step of LangChain's Better-Harness recipe, "production trace mining," and the start of the hill-climbing loop in Realm XLI.</p>`,
cite:[{s:"better",n:"Source evals from production traces"},{s:"evals",n:"Annotation queues"}]}
],

{id:"r22",num:"XVII",p:5,x:870,y:1000,name:"The Harbor",topic:"Packaging and the local Agent Server",
objective:"Package an agent for LangSmith Deployment and run it locally with Studio.",
sections:[
{id:"r22a",title:"What LangSmith Deployment is",body:`
<blockquote>A workflow orchestration runtime purpose-built for agent workloads.</blockquote>
<p>It runs your graph on an <b>Agent Server</b> with three primitives: <b>assistants</b> for configuration, <b>threads</b> for state, and <b>runs</b> for workloads. The server is framework-agnostic and also supports Google ADK, the Claude Agent SDK, CrewAI and others.</p>
<div class="tbl"><table><thead><tr><th>Option</th><th>Who runs what</th></tr></thead><tbody>
<tr><td>Cloud</td><td>Fully managed by LangChain on AWS and GCP (Plus plan)</td></tr>
<tr><td>Hybrid</td><td>LangChain-managed control plane; Agent Servers and data plane in your infrastructure</td></tr>
<tr><td>Self-hosted</td><td>Control plane and Agent Servers in your own Kubernetes cluster (Enterprise)</td></tr>
<tr><td>Standalone Server</td><td>Agent Server via Docker, Compose or Kubernetes, without a control plane</td></tr></tbody></table></div>`,
cite:[{s:"deploy",n:"Definition, primitives, options"}]},
{id:"r22b",title:"langgraph.json",body:`
<p>One config file tells the server what to load. Deployed graphs are also exposed as MCP tools at <code>/mcp</code> (Realm XXXI). <code>graphs</code> maps an id to <code>"./path/file.py:variable"</code>, where the variable is your compiled graph. Any <code>create_agent</code> or <code>create_deep_agent</code> result qualifies. You can list several graphs.</p>`,
code:`{
    "dependencies": ["langchain_openai", "./your_package"],
    "graphs": {
        "my_agent": "./your_package/your_file.py:agent"
    },
    "env": "./.env"
}`,lang:"json",
code2:`my-app/
├── my_agent/
│   ├── utils/
│   │   ├── __init__.py
│   │   ├── tools.py
│   │   ├── nodes.py
│   │   └── state.py
│   ├── __init__.py
│   └── agent.py          # agent = create_deep_agent(...)
├── .env
├── requirements.txt
└── langgraph.json`,sketch2:"Recommended layout",
cite:[{s:"appstruct",n:"Config keys and layout"}]},
{id:"r22c",title:"Run the server locally",body:`
<p><code>langgraph dev</code> starts an in-memory Agent Server with hot reloading:</p>
<ul><li>API at <code>http://localhost:2024</code></li><li>Interactive API docs at <code>/docs</code></li><li><b>Studio</b> at <code>smith.langchain.com/studio/?baseUrl=http://127.0.0.1:2024</code>, a visual debugger where you can step through the graph and inspect state</li></ul>`,
code:`pip install "langgraph-cli[inmem]"

# Start from a template, or point it at your own project with a langgraph.json
uvx --from langgraph-cli@latest langgraph new path/to/your/app --template new-langgraph-project-python

uv run langgraph dev`,lang:"sh",
cite:[{s:"local",n:"CLI, dev server, URLs"}]},
{id:"r22d",title:"Call it from code",body:`<p>The SDK talks to any Agent Server, local or deployed. Passing <code>None</code> as the thread means a threadless run.</p>`,
code:`# pip install langgraph-sdk
import asyncio
from langgraph_sdk import get_client

client = get_client(url="http://localhost:2024")

async def main():
    async for chunk in client.runs.stream(
        None,            # threadless run
        "agent",         # assistant / graph id
        input={"messages": [{"role": "human", "content": "What is LangGraph?"}]},
        stream_mode="messages-tuple",
    ):
        print(f"Event: {chunk.event}")
        print(chunk.data)

asyncio.run(main())`,lang:"py",
cite:[{s:"local",n:"SDK client example"}]}
],

{id:"r23",num:"XVIII",p:5,x:760,y:940,name:"The Fleet Yards",topic:"Deploy, then drive it with the SDK",
objective:"Ship to LangSmith Cloud and operate the agent through assistants, threads and runs.",
sections:[
{id:"r23a",title:"Ship it",body:`
<p>You need a LangSmith account on the Plus plan or above, an API key, and the CLI. Docker is optional because builds can run remotely.</p>
<ul><li><code>langgraph deploy</code> creates a <b>Serverless</b> deployment named after your project directory.</li><li>Add <code>--deployment-type dedicated</code> for a Dedicated deployment.</li><li>Then open the deployment in LangSmith and click <b>Studio</b> to test it interactively.</li></ul>`,
code:`uv tool install langgraph-cli

# .env
LANGSMITH_API_KEY=lsv2_...

langgraph deploy
# or: langgraph deploy --deployment-type dedicated`,lang:"sh",
cite:[{s:"deployqs",n:"Prerequisites and deploy command"}]},
{id:"r23b",title:"Threads and runs",body:`
<p>A <b>thread</b> is a persistent conversation that keeps state across runs. A <b>run</b> executes an assistant on a thread, or threadless if you pass <code>None</code>. Without threads, each run is stateless. This is the same idea as <code>thread_id</code> and the checkpointer from Realm V, except the server manages persistence for you.</p>`,
code:`from langgraph_sdk import get_client

client = get_client(url="your-deployment-url", api_key="your-langsmith-api-key")

thread = await client.threads.create()

async for chunk in client.runs.stream(
    thread_id=thread["thread_id"],
    assistant_id="agent",
    input={"messages": [{"role": "user", "content": "Hello"}]},
    stream_mode="updates",
):
    print(chunk.data)

state = await client.threads.get_state(thread["thread_id"])   # values, next nodes, checkpoint`,lang:"py",
cite:[{s:"threads",n:"threads.create, runs.stream, get_state"},{s:"deployqs",n:"Calling a deployment"}]},
{id:"r23c",title:"Assistants: one graph, many configurations",body:`
<blockquote>An instance of a graph with a specific configuration.</blockquote>
<p>Deploying a graph creates a default assistant. You can add more that share the graph but differ in prompt, model or tools, without changing code. Each update creates a new <b>version</b>, which you can promote or roll back. Updates replace the whole configuration, so pass every field you want to keep.</p>`,
code:`assistant = await client.assistants.create(
    "agent",                                   # graph id
    context={"model_name": "openai"},
    name="Open AI Assistant",
)

assistant_v2 = await client.assistants.update(
    assistant["assistant_id"],
    context={
        "model_name": "openai",                # keep it, or it's gone
        "system_prompt": "You are a mindful assistant!",
    },
)`,lang:"py",
cite:[{s:"assistants",n:"Definition and versioning"},{s:"asstcfg",n:"create / update code"}]},
{id:"r23d",title:"Where the loops plug in",body:`
<ul><li><b>Event-driven loop</b> (Realm XL): crons and webhooks start runs against this deployment.</li><li><b>Verification loop</b> (Realm XXXIX): <code>RubricMiddleware</code> ships inside the graph, so deployed runs verify themselves.</li><li><b>Hill-climbing loop</b> (Realm XLI): a harness improvement can be a new assistant version. Promote it when the evals pass, and roll it back if online evals drop.</li></ul>`,
cite:[{s:"cron",n:"Crons on a deployment"},{s:"assistants",n:"Versions, promote, roll back"},{s:"artloop",n:"Loops around the agent"}]}
],

/* ------------------------------------------------------------ FOUNDRY: STATE */
{id:"r24",num:"XIX",p:6,x:650,y:880,name:"The Ledger Hall",topic:"State design and reducers",
objective:"Design graph state that's minimal and typed, and that merges correctly when branches write at once.",
sections:[
{id:"r24a",title:"Think in steps before state",body:`
<p>The LangGraph docs suggest a five-step design method:</p>
<ol><li><b>Map the workflow as discrete steps</b> and sketch how they connect.</li><li><b>Classify each step</b> as an LLM step, data step, action step or user-input step.</li><li><b>Design the state</b> as shared memory holding <em>raw data</em>, not formatted text. Format prompts inside the node that needs them.</li><li><b>Build the nodes</b> as plain functions.</li><li><b>Wire it together</b> with as few explicit edges as possible, letting nodes route themselves with <code>Command</code>.</li></ol>
<p>The same page sorts errors four ways: retry <b>transient</b> ones, store <b>LLM-recoverable</b> ones in state and loop back, use <code>interrupt()</code> for ones a <b>user can fix</b>, and let <b>unexpected</b> ones surface.</p>`,
cite:[{s:"thinking",n:"Five-step method, error handling"}]},
{id:"r24b",title:"Reducers decide how updates merge",body:`
<p>Every state key has a reducer. With none declared, a node's update <b>overwrites</b> the key. Declare one with <code>Annotated</code>, and LangGraph computes <code>reducer(current, update)</code> instead. This matters most when parallel branches write the same key in the same step: without a reducer there's no rule for combining their updates.</p>`,
code:`from operator import add
from typing import Annotated
from typing_extensions import TypedDict

class State(TypedDict):
    foo: int                              # overwritten by each update
    bar: Annotated[list[str], add]        # ["old"] + ["new"] -> ["old", "new"]`,lang:"py",
cite:[{s:"graphapi",n:"Reducers"},{s:"lg",n:"add_messages reducer"}]},
{id:"r24c",title:"Input, output and private schemas",body:`
<p>A graph can expose a narrower interface than its internal state. Callers send <code>InputState</code> and get back <code>OutputState</code>. Internal channels stay internal. "Nodes can write to any state channel in the graph state," and private channels are hidden from <code>invoke()</code> output.</p>`,
code:`from langgraph.graph import StateGraph, START, END
from typing_extensions import TypedDict

class InputState(TypedDict):
    user_input: str

class OutputState(TypedDict):
    graph_output: str

class OverallState(TypedDict):
    foo: str
    user_input: str
    graph_output: str

class PrivateState(TypedDict):
    bar: str

builder = StateGraph(OverallState, input_schema=InputState, output_schema=OutputState)`,lang:"py",
cite:[{s:"graphapi",n:"Multiple schemas"}]},
{id:"r24d",title:"Context is not state",body:`
<p>Things fixed for the whole run (which provider to use, a user id, a database client) belong in <b>runtime context</b>, not in state. State is what changes as the graph runs. This is the same <code>context_schema</code> idea you met with <code>@dynamic_prompt</code> in Realm X.</p>`,
code:`from dataclasses import dataclass
from langgraph.graph import StateGraph
from langgraph.runtime import Runtime

@dataclass
class ContextSchema:
    llm_provider: str = "openai"

graph = StateGraph(State, context_schema=ContextSchema)

def node_a(state: State, runtime: Runtime[ContextSchema]):
    llm = get_llm(runtime.context.llm_provider)
    ...

# graph.compile().invoke(inputs, context={"llm_provider": "anthropic"})`,lang:"py",
cite:[{s:"graphapi",n:"Runtime context"}]}
],

{id:"r25",num:"XX",p:6,x:530,y:820,name:"The Branching Roads",topic:"Command, Send and loop limits",
objective:"Route from inside nodes, fan out to a number of workers chosen at runtime, and bound every loop.",
sections:[
{id:"r25a",title:"Command: update and route in one return",body:`
<p>A node can return a <code>Command</code> that both updates state and says where to go next. The return annotation <code>Command[Literal[...]]</code> is required so the graph can be drawn. Watch out: "static edges defined with add_edge still execute," so don't give the same node both a static edge and a <code>Command</code>.</p>`,
code:`from typing import Literal
from langgraph.types import Command

def my_node(state: State) -> Command[Literal["my_other_node"]]:
    return Command(
        update={"foo": "bar"},
        goto="my_other_node",
    )`,lang:"py",
cite:[{s:"graphapi",n:"Command"}]},
{id:"r25b",title:"Send: fan out at runtime",body:`
<p>Sometimes you don't know how many branches you need until the graph runs: one per subject, one per document, one per report section. Return a list of <code>Send</code> objects from a conditional edge. Each one runs the target node with its own input. Their outputs merge through the reducer on the shared key.</p>`,
code:`from langgraph.types import Send

def continue_to_jokes(state: OverallState):
    return [Send("generate_joke", {"subject": s}) for s in state['subjects']]

graph.add_conditional_edges("node_a", continue_to_jokes)`,lang:"py",
cite:[{s:"graphapi",n:"Send API / map-reduce"}]},
{id:"r25c",title:"Orchestrator-worker, end to end",body:`
<p>A planner decides the sections, <code>Send</code> starts one worker per section, the workers' results merge through <code>operator.add</code>, and a synthesizer joins them. Here <code>llm</code> is any chat model from Realm II.</p>`,
code:`import operator
from typing import Annotated, List
from typing_extensions import TypedDict
from pydantic import BaseModel, Field
from langgraph.graph import StateGraph, START, END
from langgraph.types import Send
from langchain.messages import SystemMessage, HumanMessage

class Section(BaseModel):
    name: str = Field(description="Name for this section of the report.")
    description: str = Field(description="Brief overview of the main topics and concepts to be covered in this section.")

class Sections(BaseModel):
    sections: List[Section] = Field(description="Sections of the report.")

class State(TypedDict):
    topic: str
    sections: list[Section]
    completed_sections: Annotated[list, operator.add]
    final_report: str

class WorkerState(TypedDict):
    section: Section
    completed_sections: Annotated[list, operator.add]

planner = llm.with_structured_output(Sections)

def orchestrator(state: State):
    report_sections = planner.invoke([
        SystemMessage(content="Generate a plan for the report."),
        HumanMessage(content=f"Here is the report topic: {state['topic']}"),
    ])
    return {"sections": report_sections.sections}

def llm_call(state: WorkerState):
    section = llm.invoke([
        SystemMessage(content="Write a report section following the provided name and description. Include no preamble for each section. Use markdown formatting."),
        HumanMessage(content=f"Here is the section name: {state['section'].name} and description: {state['section'].description}"),
    ])
    return {"completed_sections": [section.content]}

def synthesizer(state: State):
    return {"final_report": "\\n\\n---\\n\\n".join(state["completed_sections"])}

def assign_workers(state: State):
    return [Send("llm_call", {"section": s}) for s in state["sections"]]

b = StateGraph(State)
b.add_node("orchestrator", orchestrator)
b.add_node("llm_call", llm_call)
b.add_node("synthesizer", synthesizer)
b.add_edge(START, "orchestrator")
b.add_conditional_edges("orchestrator", assign_workers, ["llm_call"])
b.add_edge("llm_call", "synthesizer")
b.add_edge("synthesizer", END)
orchestrator_worker = b.compile()`,lang:"py",
cite:[{s:"workflows",n:"Orchestrator-worker with Send"}]},
{id:"r25d",title:"Bound every loop",body:`
<p>Graphs with cycles need a ceiling. <code>recursion_limit</code> caps the number of steps in a run. Rather than letting a run hit the limit and fail, a node can read the <code>RemainingSteps</code> managed value and wrap up on its own. This is the graph-level version of <code>ModelCallLimitMiddleware</code>.</p>`,
code:`from typing import Annotated
from typing_extensions import TypedDict
from langgraph.managed import RemainingSteps

class State(TypedDict):
    messages: Annotated[list, lambda x, y: x + y]
    remaining_steps: RemainingSteps

def reasoning_node(state: State) -> dict:
    if state["remaining_steps"] <= 2:
        return {"messages": ["Wrapping up..."]}
    return {"messages": ["thinking..."]}

graph.invoke(inputs, config={"recursion_limit": 5})
# inside a node: config["metadata"]["langgraph_step"] is the current step`,lang:"py",
cite:[{s:"graphapi",n:"Recursion limit, RemainingSteps"}]}
],

{id:"r26",num:"XXI",p:6,x:410,y:780,name:"The Workshop of Patterns",topic:"Workflow patterns",
objective:"Know the classic workflow shapes and build each one as a graph.",
sections:[
{id:"r26a",title:"Workflows and agents",body:`
<p>Workflows follow code paths you decided in advance. Agents are "dynamic and define their own processes and tool usage." Most production systems mix both, and LangGraph lets you put them in one graph.</p>
<div class="tbl"><table><thead><tr><th>Pattern</th><th>Shape</th></tr></thead><tbody>
<tr><td>Prompt chaining</td><td>"Each LLM call processes the output of the previous call."</td></tr>
<tr><td>Parallelization</td><td>LLMs work simultaneously: independent subtasks at once, or the same task several times</td></tr>
<tr><td>Routing</td><td>Classify the input, then send it to a context-specific task</td></tr>
<tr><td>Orchestrator-worker</td><td>Break the task into subtasks, assign them to workers, synthesize (Realm XX)</td></tr>
<tr><td>Evaluator-optimizer</td><td>"One LLM call creates a response and the other evaluates that response."</td></tr>
<tr><td>Agent</td><td>The model decides the steps and tools</td></tr></tbody></table></div>`,
cite:[{s:"workflows",n:"Pattern definitions"}]},
{id:"r26b",title:"Chaining with a gate",body:`<p>A chain becomes reliable when you put a cheap programmatic check between the steps and route on the result.</p>`,
code:`from typing import Literal
from typing_extensions import TypedDict
from langgraph.graph import StateGraph, START, END

class State(TypedDict):
    topic: str
    draft: str
    final: str

def write_draft(state: State):
    return {"draft": llm.invoke(f"Write a short product blurb about {state['topic']}").content}

def gate(state: State) -> Literal["polish", "__end__"]:
    return "polish" if len(state["draft"]) > 80 else END   # programmatic check

def polish(state: State):
    return {"final": llm.invoke(f"Tighten this blurb:\\n{state['draft']}").content}

g = StateGraph(State)
g.add_node("write_draft", write_draft)
g.add_node("polish", polish)
g.add_edge(START, "write_draft")
g.add_conditional_edges("write_draft", gate)
g.add_edge("polish", END)
chain = g.compile()`,lang:"py",sketch:"Sketch: prompt chain with a gate",
cite:[{s:"workflows",n:"Prompt chaining"}]},
{id:"r26c",title:"Parallel branches",body:`<p>Give a node several outgoing edges and the targets run in the same step. A node that every branch points to runs once all of them have finished. Use this for independent checks (tone, facts, policy), or for running the same prompt several times and voting.</p>`,
code:`g = StateGraph(State)
g.add_node("check_tone", check_tone)
g.add_node("check_facts", check_facts)
g.add_node("check_policy", check_policy)
g.add_node("aggregate", aggregate)

for n in ["check_tone", "check_facts", "check_policy"]:
    g.add_edge(START, n)          # fan out: all three run in the same step
    g.add_edge(n, "aggregate")    # fan in
g.add_edge("aggregate", END)`,lang:"py",sketch:"Sketch: fan-out / fan-in",
cite:[{s:"workflows",n:"Parallelization"},{s:"graphapi",n:"Reducers for concurrent writes"}]},
{id:"r26d",title:"Evaluator-optimizer",body:`
<p>A generator writes, an evaluator grades with structured output, and a conditional edge either accepts the result or sends the feedback back to the generator. This is the verification loop (Realm XXXIX) built by hand. In production, add an attempt counter or <code>recursion_limit</code> so it can't loop forever.</p>`,
code:`from typing import Literal
from typing_extensions import TypedDict
from pydantic import BaseModel, Field
from langgraph.graph import StateGraph, START, END

class State(TypedDict):
    joke: str
    topic: str
    feedback: str
    funny_or_not: str

class Feedback(BaseModel):
    grade: Literal["funny", "not funny"] = Field(description="Decide if the joke is funny or not.")
    feedback: str = Field(description="If the joke is not funny, provide feedback on how to improve it.")

evaluator = llm.with_structured_output(Feedback)

def llm_call_generator(state: State):
    if state.get("feedback"):
        msg = llm.invoke(f"Write a joke about {state['topic']} but take into account the feedback: {state['feedback']}")
    else:
        msg = llm.invoke(f"Write a joke about {state['topic']}")
    return {"joke": msg.content}

def llm_call_evaluator(state: State):
    grade = evaluator.invoke(f"Grade the joke {state['joke']}")
    return {"funny_or_not": grade.grade, "feedback": grade.feedback}

def route_joke(state: State):
    if state["funny_or_not"] == "funny":
        return "Accepted"
    elif state["funny_or_not"] == "not funny":
        return "Rejected + Feedback"

b = StateGraph(State)
b.add_node("llm_call_generator", llm_call_generator)
b.add_node("llm_call_evaluator", llm_call_evaluator)
b.add_edge(START, "llm_call_generator")
b.add_edge("llm_call_generator", "llm_call_evaluator")
b.add_conditional_edges("llm_call_evaluator", route_joke,
                        {"Accepted": END, "Rejected + Feedback": "llm_call_generator"})
optimizer_workflow = b.compile()`,lang:"py",
cite:[{s:"workflows",n:"Evaluator-optimizer"}]}
],

{id:"r27",num:"XXII",p:6,x:280,y:760,name:"The Paused Gate",topic:"Interrupts in depth",
objective:"Pause any node for a human, resume safely, and avoid the replay traps.",
sections:[
{id:"r27a",title:"interrupt() inside any node",body:`
<p><code>HumanInTheLoopMiddleware</code> (Realm VIII) only pauses on tool calls. <code>interrupt()</code> pauses anywhere, sends a payload out, and returns whatever the human sends back. It needs a checkpointer (a durable one in production), a <code>thread_id</code>, and a JSON-serializable payload.</p>`,
code:`from langgraph.types import interrupt, Command

def approval_node(state: State):
    approved = interrupt("Do you approve this action?")
    return {"approved": approved}

config = {"configurable": {"thread_id": "thread-1"}}

stream = graph.stream_events({"input": "data"}, config=config, version="v3")
if stream.interrupted:
    print(stream.interrupts)                       # the pause payloads
    resumed = graph.stream_events(Command(resume=user_response), config=config, version="v3")`,lang:"py",
cite:[{s:"interrupts",n:"Basic usage and resume"}]},
{id:"r27b",title:"The rules",body:`
<blockquote>Any code that ran before the interrupt will execute again.</blockquote>
<p>On resume, the node <b>restarts from its first line</b>. Five rules follow:</p>
<ol><li><b>Side effects before <code>interrupt()</code> must be idempotent.</b> Use upsert instead of create, or move them after the interrupt.</li><li><b>Don't wrap it in a bare try/except.</b> <code>interrupt()</code> works by raising, so a catch-all swallows the pause.</li><li><b>Keep interrupt order consistent.</b> Resumes are matched by position, so don't skip interrupts conditionally.</li><li><b>No <code>while True</code> validation loops.</b> Re-ask through a conditional edge instead.</li><li><b>Payloads must be simple JSON values</b>, not functions or class instances.</li></ol>`,
cite:[{s:"interrupts",n:"Critical rules"}]},
{id:"r27c",title:"Four patterns",body:"",
code:`# 1. Approve or reject, then route
def approval_node(state: State) -> Command:
    is_approved = interrupt({"question": "Proceed?", "details": state["action"]})
    return Command(goto="proceed" if is_approved else "cancel")

# 2. Review and edit state
def review_node(state: State):
    edited = interrupt({"instruction": "Review content", "content": state["text"]})
    return {"text": edited}

# 3. Approve a tool call from inside the tool
@tool
def send_email(to: str, subject: str, body: str):
    response = interrupt({"action": "send_email", "to": to, "subject": subject, "body": body})
    if response.get("action") == "approve":
        return f"Sent to {response.get('to', to)}"
    return "Cancelled"

# 4. Validate input without a while loop: a conditional edge re-enters the node
def get_age_node(state: FormState):
    question = state.get("pending_question") or "Age?"
    answer = interrupt(question)
    if isinstance(answer, int) and answer > 0:
        return {"age": answer, "pending_question": None}
    return {"pending_question": "Invalid. Enter positive number."}`,lang:"py",
cite:[{s:"interrupts",n:"Common patterns"}]},
{id:"r27d",title:"Several interrupts at once",body:`<p>When parallel branches pause in the same step, each interrupt has an id. Resume them all at once with a map from id to value.</p>`,
code:`stream = graph.stream_events({"vals": []}, config, version="v3")

resume_map = {i.id: f"answer_{i.id}" for i in stream.interrupts}
resumed = graph.stream_events(Command(resume=resume_map), config, version="v3")`,lang:"py",
cite:[{s:"interrupts",n:"Multiple interrupts"}]}
],

{id:"r28",num:"XXIII",p:6,x:150,y:700,name:"The Hall of Mirrors",topic:"Persistence, time travel and durability",
objective:"Inspect past checkpoints, replay or fork from them, and choose how often to save.",
sections:[
{id:"r28a",title:"Checkpoints and stores",body:`
<div class="tbl"><table><thead><tr><th></th><th>Checkpointer</th><th>Store</th></tr></thead><tbody>
<tr><td>Holds</td><td>Snapshots of graph state, one per step</td><td>Application data you choose to save</td></tr>
<tr><td>Scope</td><td>One thread: short-term memory</td><td>Across threads: long-term memory</td></tr>
<tr><td>Gives you</td><td>Conversation continuity, fault tolerance, interrupts, time travel</td><td>User preferences, shared knowledge</td></tr></tbody></table></div>
<p>Every step writes a checkpoint, so a thread is a full history you can inspect and rewind.</p>`,
cite:[{s:"persist",n:"Checkpointers vs stores"}]},
{id:"r28b",title:"Replay and fork",body:`
<ul><li><b>Replay</b> runs again from an earlier checkpoint. It "re-executes nodes—it doesn't just read from cache. LLM calls, API requests, and interrupts fire again."</li><li><b>Fork</b> changes state at a checkpoint with <code>update_state</code> and continues from there on a new branch. "The original execution history remains intact."</li></ul>`,
code:`from langgraph.graph import StateGraph, START
from langgraph.checkpoint.memory import InMemorySaver
from typing_extensions import TypedDict, NotRequired
from langchain_core.utils.uuid import uuid7

class State(TypedDict):
    topic: NotRequired[str]
    joke: NotRequired[str]

def generate_topic(state: State):
    return {"topic": "socks in the dryer"}

def write_joke(state: State):
    return {"joke": f"Why do {state['topic']} disappear? They elope!"}

graph = (
    StateGraph(State)
    .add_node("generate_topic", generate_topic)
    .add_node("write_joke", write_joke)
    .add_edge(START, "generate_topic")
    .add_edge("generate_topic", "write_joke")
    .compile(checkpointer=InMemorySaver())
)

config = {"configurable": {"thread_id": str(uuid7())}}
graph.invoke({}, config)

# REPLAY from just before write_joke
history = list(graph.get_state_history(config))
before_joke = next(s for s in history if s.next == ("write_joke",))
replay_result = graph.invoke(None, before_joke.config)

# FORK with different state
fork_config = graph.update_state(before_joke.config, values={"topic": "chickens"})
fork_result = graph.invoke(None, fork_config)`,lang:"py",
cite:[{s:"timetravel",n:"Replay vs fork, full example"}]},
{id:"r28c",title:"Durability modes",body:`
<div class="tbl"><table><thead><tr><th>Mode</th><th>Writes checkpoints</th><th>Trade-off</th></tr></thead><tbody>
<tr><td><code>"exit"</code></td><td>Only when the graph exits: done, error or interrupt</td><td>Fastest, but a crash mid-run loses intermediate state</td></tr>
<tr><td><code>"async"</code> (default)</td><td>In the background while the next step runs</td><td>Good balance, with a small risk if the process crashes</td></tr>
<tr><td><code>"sync"</code></td><td>Before the next step starts</td><td>Highest durability, some overhead</td></tr></tbody></table></div>`,
code:`graph.invoke(inputs, config, durability="sync")   # e.g. for payment or provisioning flows`,lang:"py",sketch:"Sketch: choosing a mode per call",
cite:[{s:"thinking",n:"Async durability by default; exit and sync modes"}]},
{id:"r28d",title:"Cache expensive nodes",body:`<p>Nodes can cache their output keyed by a hash of their input (customize it with <code>key_func</code>). Repeat calls with the same input within the <code>ttl</code> skip the work.</p>`,
code:`from langgraph.cache.memory import InMemoryCache
from langgraph.types import CachePolicy

builder.add_node("expensive_node", expensive_node, cache_policy=CachePolicy(ttl=3))
graph = builder.compile(cache=InMemoryCache())`,lang:"py",
cite:[{s:"graphapi",n:"CachePolicy"}]}
],

{id:"r29",num:"XXIV",p:6,x:230,y:610,name:"The Nested Keeps",topic:"Subgraphs and multi-agent systems",
objective:"Compose graphs inside graphs, and pick the right multi-agent pattern.",
sections:[
{id:"r29a",title:"Subgraphs, two ways",body:`<p>If the parent and the subgraph <b>share state keys</b>, add the compiled subgraph directly as a node. If their <b>schemas differ</b>, call the subgraph inside a wrapper node and map state in and out.</p>`,
code:`# Shared keys: the compiled subgraph IS the node
subgraph_builder = StateGraph(State)
subgraph_builder.add_node(subgraph_node_1)
subgraph_builder.add_edge(START, "subgraph_node_1")
subgraph = subgraph_builder.compile()

builder = StateGraph(State)
builder.add_node("node_1", subgraph)
builder.add_edge(START, "node_1")
graph = builder.compile()

# Different schemas: translate inside a wrapper node
def call_subgraph(state: State):
    subgraph_output = subgraph.invoke({"bar": state["foo"]})
    return {"foo": subgraph_output["bar"]}`,lang:"py",
cite:[{s:"subgraphs",n:"Two communication patterns"}]},
{id:"r29b",title:"Subgraph memory and escaping to the parent",body:`
<div class="tbl"><table><thead><tr><th>Subgraph compiled with</th><th>Behavior</th></tr></thead><tbody>
<tr><td><code>checkpointer=None</code> (default)</td><td>Each call starts fresh, but it inherits the parent's checkpointer for interrupts</td></tr>
<tr><td><code>checkpointer=True</code></td><td>State builds up across calls on the same thread</td></tr>
<tr><td><code>checkpointer=False</code></td><td>No checkpointing; it runs like a plain function call</td></tr></tbody></table></div>
<p>"The parent graph must be compiled with a checkpointer for subgraph persistence features (interrupts, state inspection, per-thread memory) to work." Inspect a subgraph with <code>graph.get_state(config, subgraphs=True)</code>. A subgraph node can jump to a node in the <em>parent</em> graph with <code>Command.PARENT</code>. Parent keys that receive these updates need reducers.</p>`,
code:`def my_node(state: State) -> Command[Literal["other_subgraph"]]:
    return Command(
        update={"foo": "bar"},
        goto="other_subgraph",
        graph=Command.PARENT,
    )`,lang:"py",
cite:[{s:"subgraphs",n:"Persistence modes, key rule"},{s:"graphapi",n:"Command.PARENT"}]},
{id:"r29c",title:"Five multi-agent patterns",body:`
<blockquote>At the center of multi-agent design is context engineering.</blockquote>
<div class="tbl"><table><thead><tr><th>Pattern</th><th>How it works</th><th>Good for</th></tr></thead><tbody>
<tr><td>Subagents</td><td>A main agent calls specialists as tools and makes every routing decision</td><td>Parallel work, large-context domains</td></tr>
<tr><td>Handoffs</td><td>Agents pass control to each other with tool calls</td><td>Multi-hop conversations directly with the user</td></tr>
<tr><td>Router</td><td>A routing step classifies the request, sends it to specialists, and combines their answers</td><td>Single requests, parallel execution</td></tr>
<tr><td>Skills</td><td>One agent stays in control and loads specialist prompts on demand</td><td>Simple, focused tasks</td></tr>
<tr><td>Custom workflow</td><td>A LangGraph graph that mixes deterministic and agentic steps, with other patterns as nodes</td><td>Complex requirements</td></tr></tbody></table></div>`,
cite:[{s:"multiagent",n:"Patterns and when to use each"}]},
{id:"r29d",title:"Subagent as a tool, and a handoff",body:`
<p>A subagent wrapped as a tool returns only its final message, because "the supervisor only sees the final output." A handoff uses <code>Command.PARENT</code> to move control. It must include both the AI message that triggered it and a <code>ToolMessage</code> confirming it, so the next agent sees a valid history.</p>`,
code:`from langchain.tools import tool
from langchain.agents import create_agent

subagent = create_agent(model="anthropic:claude-haiku-4-5", tools=[...])

@tool("research", description="Research a topic and return findings")
def call_research_agent(query: str):
    result = subagent.invoke({"messages": [{"role": "user", "content": query}]})
    return result["messages"][-1].content

main_agent = create_agent(model="anthropic:claude-sonnet-5", tools=[call_research_agent])`,lang:"py",
code2:`from langchain.tools import tool, ToolRuntime
from langchain.messages import AIMessage, ToolMessage
from langgraph.types import Command

@tool
def transfer_to_sales(runtime: ToolRuntime) -> Command:
    """Transfer to the sales agent."""
    last_ai_message = next(
        msg for msg in reversed(runtime.state["messages"]) if isinstance(msg, AIMessage)
    )
    transfer_message = ToolMessage(
        content="Transferred to sales agent",
        tool_call_id=runtime.tool_call_id,
    )
    return Command(
        goto="sales_agent",
        update={"active_agent": "sales_agent", "messages": [last_ai_message, transfer_message]},
        graph=Command.PARENT,
    )`,sketch2:"Handoff tool, from the handoffs docs",
cite:[{s:"subagentdoc",n:"Subagent as a tool"},{s:"handoffs",n:"Handoff with Command.PARENT"}]}
],

{id:"r30",num:"XXV",p:6,x:360,y:650,name:"The Signal Tower",topic:"Streaming and the Functional API",
objective:"Stream exactly what your UI needs, and write workflows as plain Python when a graph is overkill.",
sections:[
{id:"r30a",title:"Seven stream modes",body:`
<div class="tbl"><table><thead><tr><th>Mode</th><th>Emits</th></tr></thead><tbody>
<tr><td><code>values</code></td><td>Full state after each step</td></tr>
<tr><td><code>updates</code></td><td>Only the state updates from each step</td></tr>
<tr><td><code>messages</code></td><td>LLM token chunks with metadata</td></tr>
<tr><td><code>custom</code></td><td>Whatever your nodes emit through <code>get_stream_writer</code></td></tr>
<tr><td><code>checkpoints</code></td><td>Checkpoint events (needs a checkpointer)</td></tr>
<tr><td><code>tasks</code></td><td>Task start and finish events, with results and errors</td></tr>
<tr><td><code>debug</code></td><td>Everything: checkpoints plus tasks</td></tr></tbody></table></div>`,
cite:[{s:"streaming",n:"Stream modes"}]},
{id:"r30b",title:"Custom progress events and subgraphs",body:`<p>Pass a list of modes to combine them. With <code>version="v2"</code>, each part has a <code>type</code>, an <code>ns</code> namespace and its <code>data</code>. Add <code>subgraphs=True</code> to see nested graphs too. <code>ns</code> is <code>()</code> for the root and names the subgraph otherwise.</p>`,
code:`from typing import TypedDict
from langgraph.graph import StateGraph, START, END
from langgraph.config import get_stream_writer

class State(TypedDict):
    topic: str
    result: str

def process_node(state: State):
    writer = get_stream_writer()
    writer({"status": "processing..."})
    return {"result": f"Processed: {state['topic']}"}

graph = (StateGraph(State).add_node(process_node)
         .add_edge(START, "process_node").add_edge("process_node", END).compile())

for chunk in graph.stream({"topic": "example"}, stream_mode=["updates", "custom"], version="v2"):
    if chunk["type"] == "updates":
        print(f"Updates: {chunk['data']}")
    elif chunk["type"] == "custom":
        print(f"Custom: {chunk['data']}")

# Nested graphs: chunk["ns"] is () for the root, ("node:id",) for a subgraph
for chunk in graph.stream({"topic": "x"}, subgraphs=True, stream_mode="updates", version="v2"):
    print(chunk["ns"], chunk["data"])`,lang:"py",
cite:[{s:"streaming",n:"get_stream_writer, subgraphs=True"}]},
{id:"r30c",title:"The Functional API",body:`
<p>No nodes, no edges, no state schema. <code>@entrypoint</code> marks the workflow and <code>@task</code> marks units of work. Tasks return futures, so starting several before calling <code>.result()</code> runs them in parallel. You still get checkpointing, interrupts and streaming. The Functional API "does not require thinking about graph structure. You can use standard Python constructs." The Graph API is better when you want the structure drawn and inspectable.</p>`,
code:`from langgraph.func import entrypoint, task
from langgraph.checkpoint.memory import InMemorySaver

@task
def my_operation(input_value):
    return process(input_value)

@entrypoint(checkpointer=InMemorySaver())
def workflow(data: dict) -> dict:
    result = my_operation(data).result()
    return {"output": result}`,lang:"py",
cite:[{s:"functional",n:"entrypoint and task; when to choose"}]},
{id:"r30d",title:"Determinism and side effects",body:`
<blockquote>When you resume a workflow run, the code does NOT resume from the same line of code where execution stopped.</blockquote>
<p>Instead, the entrypoint runs again from the top, and finished tasks return their saved results. So put non-deterministic work and side effects (API calls, file writes, random numbers, timestamps) <b>inside tasks</b>, where they run once. Code outside tasks must give the same result every time it runs. The <code>previous</code> parameter gives an entrypoint the last saved value for the thread, which is a simple form of short-term memory.</p>`,
cite:[{s:"functional",n:"Determinism, side effects in tasks, previous"}]}
],

{id:"r31",num:"XXVI",p:7,x:490,y:590,name:"The Bazaar",topic:"Model provider integrations",
objective:"Use any model provider, endpoint or local model behind the same interface.",
sections:[
{id:"r31a",title:"One package per provider",body:`
<blockquote>A provider is a company or platform that hosts AI models and exposes them through an API.</blockquote>
<p>Each provider ships as its own package named <code>langchain-&lt;provider&gt;</code>: <code>langchain-openai</code>, <code>langchain-anthropic</code>, <code>langchain-google-vertexai</code> and so on. Because they all implement the same interfaces, you can "swap providers without changing your code." The catalogue lists over 1,000 integrations across chat models, embeddings, vector stores, document loaders, tools and toolkits, checkpointers and middleware.</p>`,
cite:[{s:"providers",n:"Provider definition, naming, categories"}]},
{id:"r31b",title:"Prefixes and direct classes",body:`
<div class="tbl"><table><thead><tr><th>Provider</th><th><code>init_chat_model</code> prefix</th><th>Direct class</th></tr></thead><tbody>
<tr><td>OpenAI</td><td><code>openai</code></td><td><code>langchain_openai.ChatOpenAI</code></td></tr>
<tr><td>Anthropic</td><td><code>anthropic</code></td><td><code>langchain_anthropic.ChatAnthropic</code></td></tr>
<tr><td>Azure OpenAI</td><td><code>azure_openai</code></td><td><code>langchain_openai.AzureChatOpenAI</code></td></tr>
<tr><td>Google Gemini</td><td><code>google_genai</code></td><td><code>langchain_google_genai.ChatGoogleGenerativeAI</code></td></tr>
<tr><td>AWS Bedrock</td><td><code>bedrock_converse</code></td><td><code>langchain_aws.ChatBedrock</code></td></tr>
<tr><td>Hugging Face</td><td><code>huggingface</code></td><td><code>langchain_huggingface.ChatHuggingFace</code></td></tr>
<tr><td>OpenRouter</td><td><code>openrouter</code></td><td><code>langchain_openrouter.ChatOpenRouter</code></td></tr></tbody></table></div>
<p>Use <code>init_chat_model</code> when the provider might change. Use the direct class when you need provider-specific parameters.</p>`,
code:`from langchain.chat_models import init_chat_model

model = init_chat_model("gpt-5.5", model_provider="openai")
same_idea = init_chat_model("anthropic:claude-sonnet-5")      # provider:model shorthand

from langchain_anthropic import ChatAnthropic
direct = ChatAnthropic(model="claude-sonnet-5")`,lang:"py",sketch:"Sketch: the two ways to construct a model",
cite:[{s:"models",n:"Provider prefixes and direct imports"}]},
{id:"r31c",title:"Any endpoint, any machine",body:`<p>Any server that speaks the OpenAI API (a self-hosted gateway, an inference server) works through <code>model_provider="openai"</code> plus a <code>base_url</code>. Local models run through Ollama.</p>`,
code:`from langchain.chat_models import init_chat_model

model = init_chat_model(
    model="MODEL_NAME",
    model_provider="openai",
    base_url="BASE_URL",
    api_key="YOUR_API_KEY",
)

local = init_chat_model("model_name", model_provider="ollama")`,lang:"py",
cite:[{s:"models",n:"OpenAI-compatible endpoints, Ollama"}]},
{id:"r31d",title:"Choose at runtime, know the limits, throttle",body:`
<ul><li><b>Configurable models</b> pick the model per call through config, which is useful for A/B tests and per-tenant models.</li><li><b>Profiles</b> describe what a model can do (<code>max_input_tokens</code>, <code>tool_calling</code>, <code>image_inputs</code>…), so code can check capabilities instead of hardcoding model names.</li><li><b>Rate limiters</b> keep you under provider quotas.</li></ul>`,
code:`from langchain.chat_models import init_chat_model
from langchain.rate_limiters import InMemoryRateLimiter

configurable_model = init_chat_model(
    temperature=0,
    configurable_fields=("model", "model_provider", "temperature", "max_tokens"),
    config_prefix="first",
)
configurable_model.invoke("query", config={"configurable": {"first_model": "claude-sonnet-4-6"}})

model = init_chat_model("gpt-5.5")
model.profile        # {"max_input_tokens": 400000, "image_inputs": True, "tool_calling": True, ...}

limiter = InMemoryRateLimiter(requests_per_second=0.1, check_every_n_seconds=0.1, max_bucket_size=10)
throttled = init_chat_model("gpt-5.5", rate_limiter=limiter)`,lang:"py",
cite:[{s:"models",n:"configurable_fields, profile, InMemoryRateLimiter"}]}
],

{id:"r32",num:"XXVII",p:7,x:620,y:660,name:"The Granary",topic:"Loaders, embeddings and vector stores",
objective:"Get data in, embed it efficiently, and keep the store swappable.",
sections:[
{id:"r32a",title:"Document loaders",body:`
<p>Every loader inherits from <code>BaseLoader</code> and offers <code>load()</code> to get everything at once and <code>lazy_load()</code> to stream documents, which is better for large sources. Each <code>Document</code> has <code>page_content</code> and <code>metadata</code>. Keep the metadata, because it's what you'll filter on later. Families include PDFs (PyPDF, PyMuPDF, PDFPlumber, Docling), web pages (Firecrawl, Apify, Unstructured), cloud storage (S3-style blob stores, GCS, Google Drive) and multi-format parsers.</p>`,
code:`from langchain_docling.loader import DoclingLoader

FILE_PATH = "https://arxiv.org/pdf/2408.09869"
loader = DoclingLoader(file_path=FILE_PATH)

documents = loader.load()            # everything at once

for document in loader.lazy_load():  # or stream, for big sources
    print(document)`,lang:"py",
cite:[{s:"loaders",n:"Interface, Document, categories"}]},
{id:"r32b",title:"Embeddings, and caching them",body:`
<p>Every embedding integration exposes <code>embed_documents(texts)</code> and <code>embed_query(text)</code>. Popular providers include OpenAI, Google, Cohere, Hugging Face, Mistral, Ollama, NVIDIA and Voyage AI. Re-embedding unchanged text wastes money, so wrap the model in <code>CacheBackedEmbeddings</code>. Namespace the cache by model so vectors from two models never mix.</p>`,
code:`from langchain_classic.embeddings import CacheBackedEmbeddings
from langchain_classic.storage import LocalFileStore

store = LocalFileStore("./embedding_cache/")
cached_embedder = CacheBackedEmbeddings.from_bytes_store(
    underlying_embeddings,
    store,
    namespace=underlying_embeddings.model,
)`,lang:"py",
cite:[{s:"embeddings",n:"Interface, providers, CacheBackedEmbeddings"}]},
{id:"r32c",title:"The vector store interface",body:`
<p>Every vector store implements the same core methods: <code>add_documents</code>, <code>delete</code> and <code>similarity_search</code>. Many also support metadata filters, but "support for metadata-based filtering varies between implementations." Popular choices include PGVector, Pinecone, Qdrant, Milvus, Weaviate, Chroma, Redis, Elasticsearch and MongoDB Atlas.</p>`,
code:`from langchain_core.vectorstores import InMemoryVectorStore

vector_store = InMemoryVectorStore(embedding=SomeEmbeddingModel())

vector_store.add_documents(documents=[doc1, doc2], ids=["id1", "id2"])
vector_store.delete(ids=["id1"])

similar_docs = vector_store.similarity_search("your query here")
filtered = vector_store.similarity_search("query", k=3, filter={"source": "tweets"})`,lang:"py",
cite:[{s:"vectorstores",n:"Core interface, filtering, popular stores"}]},
{id:"r32d",title:"Keep it swappable",body:`
<p>Because loaders, embeddings and stores share interfaces, the search tool from Realm VI doesn't change when you move from <code>InMemoryVectorStore</code> to a production store. Only the constructor line does. Three habits help:</p>
<ul><li>Give documents stable <code>ids</code> so re-ingesting a source updates it instead of duplicating it.</li><li>Index and query with the same embedding model.</li><li>Check that your target store supports the filters you rely on before you migrate.</li></ul>`,
cite:[{s:"vectorstores",n:"Swap implementations without changing logic"},{s:"retrieval",n:"RAG building blocks"}]}
],

{id:"r33",num:"XXVIII",p:7,x:750,y:590,name:"The Caravan Post",topic:"Tool integrations and building your own",
objective:"Add ready-made tools safely, and know how to package your own integration.",
sections:[
{id:"r33a",title:"Tools and toolkits",body:`
<blockquote>Utilities designed to be called by a model: their inputs are designed to be generated by models, and their outputs are designed to be passed back to models.</blockquote>
<p>A <b>toolkit</b> is a set of tools meant to be used together. The catalogue groups them as search, code interpreters, productivity (email, calendar, messaging), web browsing, databases, finance, security and media generation.</p>`,
cite:[{s:"toolsint",n:"Definition and categories"}]},
{id:"r33b",title:"Tavily web search",body:"",
code:`# pip install -qU langchain-tavily      (and set TAVILY_API_KEY)
from langchain_tavily import TavilySearch
from langchain.agents import create_agent
from langchain.chat_models import init_chat_model

tool = TavilySearch(max_results=5, topic="general")
tool.invoke({"query": "What happened at the last wimbledon"})

model = init_chat_model(model="gpt-5.5", model_provider="openai", temperature=0)
agent = create_agent(model, [tool])`,lang:"py",
cite:[{s:"tavily",n:"Install, TavilySearch, agent"}]},
{id:"r33c",title:"Gate the tools that act",body:`
<p>Search tools only read. Productivity, finance and database tools change things. Put anything with real-world effects behind the controls you already know: approval with <code>HumanInTheLoopMiddleware</code> (Realm VIII), and call budgets with <code>ToolCallLimitMiddleware</code>.</p>`,
code:`from langchain.agents import create_agent
from langchain.agents.middleware import HumanInTheLoopMiddleware, ToolCallLimitMiddleware
from langgraph.checkpoint.memory import InMemorySaver

agent = create_agent(
    "anthropic:claude-sonnet-5",
    tools=[search, send_email, run_sql],
    middleware=[
        HumanInTheLoopMiddleware(interrupt_on={"send_email": True, "run_sql": True, "search": False}),
        ToolCallLimitMiddleware(tool_name="search", run_limit=10),
    ],
    checkpointer=InMemorySaver(),
)`,lang:"py",sketch:"Sketch: approvals and budgets for integration tools",
cite:[{s:"hitl",n:"interrupt_on"},{s:"mwbuilt",n:"ToolCallLimitMiddleware"}]},
{id:"r33d",title:"Publish your own integration",body:`
<ol><li>Create an independent PyPI package named <code>langchain-yourprovider</code>.</li><li>Extend the right base class: <code>BaseChatModel</code>, <code>Embeddings</code>, <code>VectorStore</code> or <code>BaseTool</code>.</li><li>Pass the standard tests from <code>langchain-tests</code> (e.g. <code>ChatModelUnitTests</code>, plus integration tests).</li><li>Publish, then list it in the integrations catalogue.</li></ol>
<p>The guide encourages new chat models, tools and toolkits, retrievers, embeddings, vector stores, middleware and sandboxes. It discourages text-completion models, document loaders and key-value stores.</p>`,
cite:[{s:"contrib",n:"Package, base classes, standard tests"}]}
],

{id:"q33b",type:"mc",q:"Which import gives you Tavily search in current LangChain?",o:["from langchain_community.tools import Tavily","from langchain_tavily import TavilySearch","from tavily import Agent","from langchain.tools import tavily"],a:1,why:"The partner package is langchain-tavily.",s:"tavily"},

{id:"r34",num:"XXIX",p:7,x:880,y:660,name:"The Gate of Protocols",topic:"MCP: connecting agents to servers",
objective:"Load tools from any MCP server into create_agent or create_deep_agent.",
sections:[
{id:"r34a",title:"What MCP is",body:`
<blockquote>Model Context Protocol (MCP) is an open protocol that standardizes how applications provide tools and context to language models.</blockquote>
<p>Someone writes an MCP server once, and any MCP client can use it. In LangChain the client is <code>MCPAdapter</code>, which ships inside LangChain as <code>langchain.mcp</code> and is built on FastMCP. It discovers a server's tools and turns them into ordinary LangChain tools for <code>create_agent</code>.</p>`,
code:`pip install "langchain[mcp]"      # requires langchain >= 1.4.0`,lang:"sh",
cite:[{s:"mcp",n:"Definition, install"},{s:"mcpmigrate",n:"Version requirement"}]},
{id:"r34b",title:"Quickstart: the LangChain docs as tools",body:`<p>LangChain runs a public MCP server for its own docs, so you can try MCP with no setup. <code>MCPAdapter</code> is an async context manager: entering it connects, and exiting it releases the connection.</p>`,
code:`from langchain.agents import create_agent
from langchain.mcp import MCPAdapter

async def main():
    async with MCPAdapter("https://docs.langchain.com/mcp") as adapter:
        tools = await adapter.list_tools()
        agent = create_agent("claude-sonnet-5", tools)
        return await agent.ainvoke({"messages": [{
            "role": "user",
            "content": "How do I add short-term memory to a LangChain agent?",
        }]})`,lang:"py",
cite:[{s:"mcp",n:"Quickstart, docs MCP server"},{s:"mcpconn",n:"Async context manager"}]},
{id:"r34c",title:"Transports are inferred",body:`
<div class="tbl"><table><thead><tr><th>You pass</th><th>Transport</th></tr></thead><tbody>
<tr><td>An <code>http(s)</code> URL string</td><td>Streamable HTTP</td></tr>
<tr><td>A script <code>Path</code></td><td>stdio subprocess, one per adapter</td></tr>
<tr><td>A FastMCP server object</td><td>In memory, with no subprocess or socket. Ideal for tests.</td></tr>
<tr><td>A transport object</td><td>Whatever you preconfigured</td></tr>
<tr><td>An <code>{"mcpServers": {...}}</code> dict</td><td>Several servers behind one adapter (Realm XXX)</td></tr></tbody></table></div>`,

from langchain.mcp import MCPAdapter

in_memory = MCPAdapter(server)                   # a FastMCP instance
stdio = MCPAdapter(Path("weather_server.py"))    # launched over stdio
http = MCPAdapter("https://example.com/mcp")     # streamable HTTP`,lang:"py",

{id:"r34d",title:"Deep agents, and migrating old code",body:`
<p>"Deep Agents fully support Model Context Protocol (MCP) tools." Pass the list into <code>tools=</code>. If your code uses the old standalone <code>langchain-mcp-adapters</code> package, <code>MultiServerMCPClient</code> becomes <code>MCPAdapter</code>, <code>get_tools()</code> becomes <code>list_tools()</code>, and tool interceptors become <code>@wrap_tool_call</code> middleware. Prompts and resources aren't adapted any more; read them through the FastMCP client directly. WebSocket servers should move to Streamable HTTP.</p>`,
code:`from deepagents import create_deep_agent
from langchain.mcp import MCPAdapter

async def main():
    config = {"mcpServers": {"my_server": {"url": "http://localhost:8000/mcp"}}}
    async with MCPAdapter(config) as adapter:
        tools = await adapter.list_tools()
        agent = create_deep_agent(model="anthropic:claude-sonnet-5", tools=tools)`,lang:"py",
code2:`# Before (langchain-mcp-adapters)
from langchain_mcp_adapters.client import MultiServerMCPClient
client = MultiServerMCPClient({
    "math": {"transport": "stdio", "command": "python", "args": ["/path/to/math_server.py"]},
    "weather": {"transport": "http", "url": "http://localhost:8000/mcp"},
})
tools = await client.get_tools()

# After (langchain.mcp)
from langchain.mcp import MCPAdapter
config = {"mcpServers": {
    "math": {"command": "python", "args": ["/path/to/math_server.py"]},
    "weather": {"url": "http://localhost:8000/mcp"},
}}
async with MCPAdapter(config) as adapter:
    tools = await adapter.list_tools()`,sketch2:"Migration, from the migration guide",

{id:"r35",num:"XXX",p:7,x:1000,y:580,name:"The Envoys' Court",topic:"MCP in production",
objective:"Run many servers safely: sessions, results, approvals, elicitation and per-user auth.",
sections:[
{id:"r35a",title:"Many servers, one adapter",body:`
<p>An <code>MCPConfig</code> dict puts several servers behind one adapter. Tool names are <b>prefixed with their config key</b>, so two servers that both expose <code>search</code> become <code>weather_search</code> and <code>calc_search</code>. One limitation: the servers in a config "share a single negotiated protocol era." When servers need different credentials or protocol versions, use a <code>ClientGroup</code> instead.</p>
<p><b>Sessions.</b> By default you discover tools inside <code>async with</code> and leave. The tools keep their client, so "they stay callable after the context exits." To reuse one session across many calls, keep the context open while the agent runs. In deployments, discover per run with <code>cache_mode="use"</code> so cached results within the server's TTL are reused.</p>`,
code:`CONFIG = {
    "mcpServers": {
        "weather": {"command": "python", "args": ["/path/to/weather_server.py"]},
        "calc": {"command": "python", "args": ["/path/to/calc_server.py"]},
    }
}

async with MCPAdapter(CONFIG) as adapter:
    tools = await adapter.list_tools(cache_mode="use")`,lang:"py",
cite:[{s:"mcpconn",n:"MCPConfig, prefixes, sessions, cache_mode, ClientGroup"}]},
{id:"r35b",title:"Read results properly",body:`
<ul><li>Image and file blocks become standard LangChain <b>content blocks</b>.</li><li><b>Structured content</b> is attached as the <code>ToolMessage</code> artifact, available to your code but not shown to the model as text.</li><li>When a server reports <code>isError=True</code>, the adapter returns a <code>ToolMessage</code> with <code>status="error"</code>, so the agent can see the failure and correct itself.</li></ul>`,
code:`from langchain.messages import ToolMessage

for message in result["messages"]:
    if isinstance(message, ToolMessage) and message.artifact is not None:
        structured = message.artifact["structured_content"]

for block in message.content_blocks:
    if block["type"] == "image":
        print(f"Image mime type: {block.get('mime_type')}")`,lang:"py",
cite:[{s:"mcptools",n:"Content blocks, artifacts, errors"}]},
{id:"r35c",title:"Gate by annotation, intercept with middleware",body:`
<p>Each adapted tool carries MCP metadata, including annotations such as <code>destructive_hint</code>. Use them to decide which tools need approval without hardcoding tool names. To log or modify calls, use <code>@wrap_tool_call</code>. The MCP metadata is available at <code>request.tool.metadata["mcp"]</code>.</p>`,
code:`from langchain.agents import create_agent
from langchain.agents.middleware import HumanInTheLoopMiddleware, wrap_tool_call

def is_destructive(tool) -> bool:
    annotations = (tool.metadata or {}).get("mcp", {}).get("tool", {}).get("annotations", {})
    return annotations.get("destructive_hint", False)

@wrap_tool_call
def log_mcp_calls(request, handler):
    print(f"calling {request.tool_call['name']}")
    return handler(request)

approval = HumanInTheLoopMiddleware(
    interrupt_on={t.name: is_destructive(t) for t in tools}     # derived, not hardcoded
)
agent = create_agent("claude-sonnet-5", tools,
                     middleware=[approval, log_mcp_calls], checkpointer=checkpointer)`,lang:"py",sketch:"Sketch: is_destructive and log_mcp_calls are from the docs; wiring is illustrative",
cite:[{s:"mcptools",n:"destructive_hint gating"},{s:"mcpmigrate",n:"@wrap_tool_call replaces interceptors"}]},
{id:"r35d",title:"Elicitation and authentication",body:`
<p><b>Elicitation.</b> When a server needs input partway through a call, the adapter raises a LangGraph interrupt. Resume with <code>accept</code> (plus form content), <code>decline</code> or <code>cancel</code>. As with every interrupt (Realm XXII), "resuming reruns the tool from the beginning," so keep it idempotent.</p>
<p><b>Auth.</b> <code>Client(url, auth=...)</code> takes a bearer token string, <code>"oauth"</code> for the full OAuth 2.1 flow, or any <code>httpx.Auth</code>. Use a <code>ClientGroup</code> for different credentials per server. In deployments, authenticate each run as the user who invoked it, not with a shared key, and keep cached responses separate per verified user.</p>`,
code:`# Resume an elicitation
answer = {"action": "accept", "content": {"date": "2026-09-14"}}
await agent.ainvoke(Command(resume={"responses": {question["key"]: answer}}), config)

# Per-user auth inside a deployed graph factory
from fastmcp.client import Client
from fastmcp.client.auth import BearerAuth

CONFIG = {"mcpServers": {"docs": {"url": "https://example.com/mcp"}}}

async def make_graph(runtime):
    user = runtime.user.identity if runtime.user is not None else "anonymous"
    auth = BearerAuth(token_for(user))
    async with MCPAdapter(Client(CONFIG, auth=auth)) as adapter:
        tools = await adapter.list_tools()
        return create_agent("claude-sonnet-5", tools)`,lang:"py",
cite:[{s:"mcptools",n:"Elicitation via interrupt"},{s:"mcpauth",n:"Bearer, OAuth, per-user auth"}]}
],

{id:"r36",num:"XXXI",p:7,x:1110,y:490,name:"The Lighthouse",topic:"Building MCP servers and exposing agents",
objective:"Publish your own tools over MCP, and serve deployed agents as MCP tools.",
sections:[
{id:"r36a",title:"Write a server with FastMCP",body:`<p>A server is a <code>FastMCP</code> instance with decorated functions. Run it over stdio by default, or over HTTP so remote clients can connect.</p>`,
code:`from fastmcp import FastMCP

mcp = FastMCP("My MCP Server")

@mcp.tool
def greet(name: str) -> str:
    return f"Hello, {name}!"

if __name__ == "__main__":
    mcp.run(transport="http", port=8000)      # or mcp.run() for stdio

# CLI alternative:
# fastmcp run my_server.py:mcp --transport http --port 8000`,lang:"py",
cite:[{s:"fastmcp",n:"Server, run, CLI"}]},
{id:"r36b",title:"Test it without a network",body:`<p>Give <code>MCPAdapter</code> the server object itself and it connects in memory. You can test the full tool round trip, including schemas, results and errors, in a normal test run.</p>`,
code:`import pytest
from langchain.mcp import MCPAdapter
from my_server import mcp

@pytest.mark.asyncio
async def test_greet_tool():
    async with MCPAdapter(mcp) as adapter:          # in-process, no socket
        tools = {t.name: t for t in await adapter.list_tools()}
        assert "greet" in tools
        assert "Ada" in str(await tools["greet"].ainvoke({"name": "Ada"}))`,lang:"py",sketch:"Sketch: in-memory transport used as a test harness",
cite:[{s:"mcp",n:"In-process FastMCP: ideal for tests"}]},
{id:"r36c",title:"Your deployed agent is already an MCP server",body:`
<p>Agent Server exposes every deployed agent as an MCP tool at <code>/mcp</code> over Streamable HTTP. It uses "the same authentication as the rest of the LangGraph API," and browser requests are checked against your CORS origins. Tool names come from the agent's name, with whitespace turned into underscores, invalid characters removed, and a 128-character limit. Agents whose input schema can't be generated are left out.</p>
<p>Give each graph a <code>description</code> and explicit input and output schemas, so other models see a clean tool instead of your internal message state. Set <code>"disable_mcp": true</code> to turn the endpoint off.</p>`,
code:`{
    "graphs": {
        "my_agent": {
            "path": "./my_agent/agent.py:graph",
            "description": "A description of what the agent does"
        }
    },
    "http": { "disable_mcp": true },
    "env": ".env"
}`,lang:"json",

code:`import asyncio
from fastmcp.client import Client
from fastmcp.client.transports import StreamableHttpTransport
from langchain.mcp import MCPAdapter

async def main():
    async with MCPAdapter(
        Client(StreamableHttpTransport(
            "https://mcp-finance-agent.xxx.us.langgraph.app/mcp",
            headers={"X-Api-Key": "your-key"},
        ))
    ) as adapter:
        tools = await adapter.list_tools()
        print(tools)

asyncio.run(main())`,lang:"py",

{id:"r37",num:"XXXII",p:8,x:990,y:370,name:"The Envoy's Landing",topic:"Google ADK fundamentals",
objective:"Build and run an ADK agent, and map ADK's concepts onto what you already know.",
sections:[
{id:"r37a",title:"What ADK is",body:`
<blockquote>The open-source agent development framework that lets you build, debug, and deploy reliable AI agents at enterprise scale.</blockquote>
<p>That's Google's <b>Agent Development Kit</b>. It ships for Python (<code>pip install google-adk</code>), TypeScript, Go, Java and Kotlin. Its building blocks are LLM agents, workflow agents, graph-based workflows (new in ADK 2.0), tools including MCP and OpenAPI, sessions and memory, callbacks and plugins, evaluation, deployment, and the A2A protocol for agents talking to agents.</p>`,
cite:[{s:"adkhome",n:"Definition, languages, features"}]},
{id:"r37b",title:"Your first agent",body:`<p><code>adk create my_agent</code> scaffolds <code>agent.py</code>, <code>.env</code> and <code>__init__.py</code>. ADK looks for a module-level <code>root_agent</code>. Put <code>GOOGLE_API_KEY</code> in <code>.env</code>, then run it in the terminal, the dev web UI, or as an API server.</p>`,
code:`from google.adk.agents.llm_agent import Agent

def get_current_time(city: str) -> dict:
    """Returns the current time in a specified city."""
    return {"status": "success", "city": city, "time": "10:30 AM"}

root_agent = Agent(
    model='gemini-flash-latest',
    name='root_agent',
    description="Tells the current time in a specified city.",
    instruction="You are a helpful assistant that tells current time.",
    tools=[get_current_time],
)`,lang:"py",
code2:`pip install google-adk
adk create my_agent

adk run my_agent            # terminal chat
adk web --port 8000         # dev UI (development only)
adk api_server my_agent     # HTTP API`,sketch2:"Commands, from the Python quickstart",
cite:[{s:"adkstart",n:"Install, layout, root_agent, CLI"}]},
{id:"r37c",title:"LlmAgent parameters that matter",body:`
<div class="tbl"><table><thead><tr><th>Parameter</th><th>Does</th></tr></thead><tbody>
<tr><td><code>name</code>, <code>model</code></td><td>Required. The model is a string such as <code>"gemini-flash-latest"</code>, or a wrapper object</td></tr>
<tr><td><code>description</code></td><td>Short summary that <em>other</em> agents read when deciding whether to delegate</td></tr>
<tr><td><code>instruction</code></td><td>The system prompt. <code>{var}</code> injects session state; <code>{artifact.var?}</code> injects optional artifact content</td></tr>
<tr><td><code>tools</code></td><td>Functions or <code>BaseTool</code> instances</td></tr>
<tr><td><code>output_key</code></td><td>Saves the final response text into session state under this key</td></tr>
<tr><td><code>output_schema</code> / <code>input_schema</code></td><td>Structured JSON output / validated input</td></tr>
<tr><td><code>include_contents</code></td><td><code>'none'</code> makes the agent stateless: it sees only its instruction and current input</td></tr>
<tr><td><code>planner</code></td><td><code>BuiltInPlanner</code> or <code>PlanReActPlanner</code> for multi-step reasoning</td></tr></tbody></table></div>
<p>One caveat: "Using <code>output_schema</code> with <code>tools</code> in the same LLM request is only supported by specific models, including Gemini 3.0. For other models, ADK falls back to a function tool."</p>
<p><b>Models.</b> Gemini works by name. For Vertex AI set <code>GOOGLE_GENAI_USE_VERTEXAI=true</code>, <code>GOOGLE_CLOUD_PROJECT</code> and <code>GOOGLE_CLOUD_LOCATION</code>. Other providers go through the LiteLLM wrapper.</p>`,
code:`from google.adk.agents import LlmAgent
from google.adk.models.lite_llm import LiteLlm

capital_agent = LlmAgent(
    model="gemini-flash-latest",
    name="capital_agent",
    description="Answers questions about capital cities.",
    instruction="Extract country from user input. Use get_capital_city tool.",
    tools=[get_capital_city],
    output_key="found_capital",
)

claude_agent = LlmAgent(name="claude_agent", model=LiteLlm(model="anthropic/claude-sonnet-5"))`,lang:"py",sketch:"Sketch: LlmAgent from the docs, plus a LiteLlm model",
cite:[{s:"adkllm",n:"Parameters, templating, output_schema caveat"},{s:"adkmodels",n:"Vertex env vars, LiteLlm"}]},
{id:"r37d",title:"Map it onto what you know",body:`
<p>Rough equivalents, to help transfer what you've learned. The two frameworks aren't identical, so check each concept's own docs before relying on the comparison.</p>
<div class="tbl"><table><thead><tr><th>ADK</th><th>Closest LangChain / LangGraph idea</th></tr></thead><tbody>
<tr><td><code>Agent</code> / <code>LlmAgent</code></td><td><code>create_agent</code> (Realm IV)</td></tr>
<tr><td><code>Runner</code> + <code>Session</code></td><td><code>invoke</code> + checkpointer and <code>thread_id</code> (Realm V)</td></tr>
<tr><td>Session state, <code>output_key</code></td><td>Graph state and reducers (Realm XIX)</td></tr>
<tr><td><code>MemoryService</code></td><td>Store / <code>StoreBackend</code> (Realms XII, XXIII)</td></tr>
<tr><td>Callbacks / plugins</td><td>Middleware hooks (Realm VII)</td></tr>
<tr><td>Sequential / Parallel / Loop agents, ADK 2.0 <code>Workflow</code></td><td>LangGraph workflows (Realms XX–XXI)</td></tr>
<tr><td><code>AgentTool</code> / <code>transfer_to_agent</code></td><td>Subagent-as-tool / handoffs (Realm XXIV)</td></tr>
<tr><td><code>adk eval</code></td><td>LangSmith datasets and evaluators (Realms XIV–XV)</td></tr>
<tr><td>A2A, <code>RemoteA2aAgent</code></td><td>Agent Server's MCP/A2A endpoints (Realm XXXI)</td></tr></tbody></table></div>`,

],

{id:"r38",num:"XXXIII",p:8,x:860,y:320,name:"The Chronicle House",topic:"Runner, sessions, state and memory",
objective:"Drive an agent with a Runner, and keep state and memory in the right scope.",
sections:[
{id:"r38a",title:"The event loop",body:`
<blockquote>The Agent runs until it has something to report – it then yields or emits an Event. The Runner receives this Event, processes any associated actions (like saving state changes via Services), and forwards the event onwards. The Agent's logic resumes from where it paused only after the Runner has processed the event.</blockquote>
<p>This leads to one guarantee to remember: a state change is only "guaranteed to be persisted" after the event that carries its <code>state_delta</code> has been yielded and processed by the Runner.</p>`,
cite:[{s:"adkloop",n:"Runner/agent yield-resume cycle"}]},
{id:"r38b",title:"Drive an agent with a Runner",body:`<p>Outside <code>adk run</code> and <code>adk web</code>, you create a session service and a session, then iterate over <code>runner.run_async</code>. Every step arrives as an event, and the final answer is the event where <code>is_final_response()</code> is true. This example comes from LangSmith's ADK tracing guide.</p>`,
code:`import asyncio
from google.adk.agents import Agent
from google.adk.runners import Runner
from google.adk.sessions import InMemorySessionService
from google.genai import types

async def main():
    agent = Agent(name="weather_agent", model="gemini-flash-latest",
                  description="Provides weather information.",
                  instruction="Use the get_weather tool to answer weather questions.",
                  tools=[get_weather])

    session_service = InMemorySessionService()
    session = await session_service.create_session(
        app_name="weather_app", user_id="user_123", session_id="session_456")

    runner = Runner(agent=agent, app_name="weather_app", session_service=session_service)

    async for event in runner.run_async(
        user_id="user_123",
        session_id=session.id,
        new_message=types.Content(role="user", parts=[types.Part(text="What's the weather in San Francisco?")]),
    ):
        if event.is_final_response():
            print(event.content.parts[0].text)

asyncio.run(main())`,lang:"py",
cite:[{s:"lsadktrace",n:"Runner + InMemorySessionService example"}]},
{id:"r38c",title:"State scopes",body:`
<div class="tbl"><table><thead><tr><th>Key prefix</th><th>Shared across</th><th>Persists</th></tr></thead><tbody>
<tr><td>(none)</td><td>This session</td><td>With <code>DatabaseSessionService</code> or <code>VertexAiSessionService</code></td></tr>
<tr><td><code>user:</code></td><td>All sessions of one user</td><td>With persistent services</td></tr>
<tr><td><code>app:</code></td><td>All users and sessions of the app</td><td>With persistent services</td></tr>
<tr><td><code>temp:</code></td><td>This invocation only</td><td>Never</td></tr></tbody></table></div>
<p>Change state through <code>output_key</code>, through <code>EventActions(state_delta=...)</code> appended as an event, or through <code>context.state</code> in tools and callbacks. <b>Never</b> assign to <code>session.state</code> on a session you fetched: that skips event history, breaks persistence and invites race conditions.</p>`,
code:`def my_tool_function(context: ToolContext):
    count = context.state.get("user_action_count", 0)
    context.state["user_action_count"] = count + 1      # recorded in the event's state_delta

# Wrong: bypasses persistence and event tracking
retrieved_session = await session_service.get_session(...)
retrieved_session.state['key'] = value`,lang:"py",

{id:"r38d",title:"Memory across sessions",body:`
<p>A <b>Session</b> is "a single, ongoing interaction." <b>Memory</b> spans "multiple past sessions." A <code>MemoryService</code> ingests finished sessions (<code>add_session_to_memory</code>) and answers searches (<code>search_memory</code>). Agents read it through the <code>load_memory</code> tool, which they call when they decide to, or <code>preload_memory</code>, which runs at the start of every turn. <code>InMemoryMemoryService</code> is for prototypes with keyword matching. <code>VertexAiMemoryBankService</code> is managed, with semantic search and LLM extraction.</p>`,
code:`from google.adk.memory import InMemoryMemoryService

memory_service = InMemoryMemoryService()
await memory_service.add_session_to_memory(completed_session)`,lang:"py",
cite:[{s:"adksessions",n:"Session / state / memory definitions"},{s:"adkmemory",n:"MemoryService, load/preload_memory"}]}
],

{id:"r39",num:"XXXIV",p:8,x:730,y:380,name:"The Guild of Tools",topic:"ADK tools, MCP and LangChain tools",
objective:"Write good function tools, steer the flow from inside tools, and bring in MCP and LangChain tools.",
sections:[
{id:"r39a",title:"Function tools that models use well",body:`
<p>ADK builds the schema from the function's name, docstring, parameters and type hints, so "a well-written and comprehensive docstring is crucial." Document each argument. Return a <b>dict with a <code>status</code> key</b> (<code>success</code>, <code>error</code>, <code>pending</code>), so the agent can handle failures as its instructions say.</p>`,
code:`def get_weather(city: str, unit: str):
    """Retrieves the weather for a city in the specified unit.

    Args:
        city (str): The city name.
        unit (str): The temperature unit, either 'Celsius' or 'Fahrenheit'.
    """
    return {"status": "success", "report": f"Weather for {city} is sunny."}`,lang:"py",
cite:[{s:"adkfn",n:"Docstrings, status dicts"}]},
{id:"r39b",title:"ToolContext, AgentTool and long-running tools",body:`
<ul><li>Add a <code>tool_context: ToolContext</code> parameter to read and write <b>state</b>, or to steer with <b>actions</b>: <code>escalate</code> (stop a loop), <code>transfer_to_agent</code>, <code>skip_summarization</code>.</li><li><code>AgentTool</code> wraps an agent so another agent calls it as a tool. That is explicit delegation, where the caller gets the result back.</li><li><code>LongRunningFunctionTool</code> returns a <code>pending</code> result, and the run waits until the client sends the final answer, for example a human approval.</li></ul>`,
code:`from google.adk.tools import ToolContext, AgentTool, LongRunningFunctionTool

def my_tool(arg1: str, tool_context: ToolContext):
    user_id = tool_context.state.get("user_id")
    # tool_context.actions.transfer_to_agent = "secondary_agent"

agent_tool = AgentTool(agent=sub_agent)
main_agent = Agent(name="main", model="gemini-flash-latest", tools=[agent_tool])

def ask_for_approval(purpose: str, amount: float):
    return {'status': 'pending', 'ticket-id': 'approval-ticket-1'}

long_tool = LongRunningFunctionTool(func=ask_for_approval)`,lang:"py",
cite:[{s:"adkfn",n:"ToolContext, AgentTool, LongRunningFunctionTool"},{s:"adktools",n:"ToolContext actions"}]},
{id:"r39c",title:"MCP tools with McpToolset",body:`
<p><code>McpToolset</code> connects to a server over stdio or Streamable HTTP. Always set <code>tool_filter</code> so the model sees only the tools it needs, which saves context and is safer. In production, "agents deployed to production must define McpToolset synchronously in agent.py." Outside <code>adk web</code>, close toolsets with <code>await toolset.close()</code>.</p>`,
code:`import os
from google.adk.agents import LlmAgent
from google.adk.tools.mcp_tool import McpToolset
from google.adk.tools.mcp_tool.mcp_session_manager import (
    StdioConnectionParams, StreamableHTTPConnectionParams,
)
from mcp import StdioServerParameters

local_toolset = McpToolset(
    connection_params=StdioConnectionParams(
        server_params=StdioServerParameters(
            command="npx",
            args=["-y", "@modelcontextprotocol/server-filesystem", "./accessible_files"],
        ),
    ),
    tool_filter=["list_directory", "read_file"],
)

remote_toolset = McpToolset(
    connection_params=StreamableHTTPConnectionParams(
        url="https://mapstools.googleapis.com/mcp",
        headers={"X-Goog-Api-Key": os.getenv("GOOGLE_MAPS_API_KEY"),
                 "Accept": "application/json, text/event-stream"},
        timeout=5, sse_read_timeout=300,
    )
)

agent = LlmAgent(model="gemini-flash-latest", name="multi_mcp_agent",
                 instruction="Access files and location data.",
                 tools=[local_toolset, remote_toolset])`,lang:"py",
cite:[{s:"adkmcp",n:"McpToolset, tool_filter, deployment note"}]},
{id:"r39d",title:"Built-in, OpenAPI and LangChain tools",body:`
<p>ADK also ships <b>built-in tools</b> such as Google Search, code execution and RAG, plus <b>OpenAPI tools</b> generated from a spec. It can also use other frameworks' tools: LangChain tools through <code>LangchainTool</code>, and CrewAI tools too. Everything from The Caravan Post (Realm XXVIII) is available to ADK agents. The class now lives in <code>google.adk.integrations.langchain</code>. The old <code>google.adk.tools.langchain_tool</code> path only re-exports it.</p>`,
code:`from google.adk.agents import Agent
from google.adk.integrations.langchain import LangchainTool
from langchain_tavily import TavilySearch

tavily = LangchainTool(tool=TavilySearch(max_results=5))

research_agent = Agent(name="researcher", model="gemini-flash-latest",
                       instruction="Search the web before answering.", tools=[tavily])`,lang:"py",sketch:"Sketch: wrapping a LangChain tool for ADK",
cite:[{s:"adktools",n:"Built-in, OpenAPI, third-party tools"},{s:"adklctool",n:"LangchainTool module location"}]}
],
